# スクショOCR（リスト表示4スキルで上書き）— ファイル名＝武将名
# 最終更新: 2026-05-23
generals:
  南華老仙:
    skills:
      - name: 神聖し
        effect: 所属部隊が歩兵の場合、属する陣の戦闘時、味方の防御力が6%アップ（集結時、同じ陣で累加可能、上限12%。絶対値上限はない）
        v: 6
        cap: 12
        scope: rally
      - name: 慈兵
        effect: 所属陣の毎回の交戦後、味方の残り参戦可能兵士が0の場合、味方が今回の交戦で損失した参戦可能兵士の5%を直ちに回復する（集結による累加不可、効果が最も高いもののみ有効）。さらに戦闘終了後、今回重傷を負った武将を1名自動回復する
        v: 5
        scope: rally
      - name: 苦の救済
        effect: 所属陣の毎回の交戦時、味方が受けるダメージを低下。低下率は22%×味方の最終防御力÷敵方の最終防御力（低下するダメージ上限は敵方の元ダメージの25%、下限は15%。集結による累加不可、効果が最も高いもののみ有効）
        v: 22
        down: true
        cap: 25
        scope: rally
      - name: 駆雷策電
        effect: 1回目の交戦時、属する陣の毎回の交戦時、味方に追加実ダメージを与える。数値は慈兵スキルで回復した兵士数×200%（増加する実ダメージの上限は10%、下限は6%、集結による累加不可、効果が最も高いものが有効）
        v: 10
        scope: rally

  朱然:
    skills:
      - name: 胆守
        effect: 所属部隊の戦車の軍紀が基礎軍紀×15%アップ
        v: 15
        scope: self
      - name: 奪勢
        effect: 初回の交戦前、敵方主陣の参戦可能兵士を一部撃破する。その数は味方角陣の初期参戦可能兵士の20%（集結による累加は不可、効果が最高のもののみ有効。撃破できる参戦可能兵士は味方および敵方主陣の初期参戦可能兵士の10%まで）
        v: 20
        scope: array
      - name: 中軍柱石
        effect: 所属陣が角陣の場合、戦闘時、味方角陣の防御力が編成時の防御力×16.5%アップ（集結時の累加は30%まで、絶対値上限はなし）。また、味方の主陣が受ける実ダメージが低下、低下率は16.5%×味方角陣の初回交戦前の防御力÷敵方角陣の初回交戦前の防御力（集結による累加は不可、低下する実ダメージの上限は敵方の元の実ダメージの20%、下限は10%。敵方に角陣がない場合は固定で15%有効）
        v: 16.5
        cap: 30
        scope: array
      - name: 名震敵国
        effect: 所属陣が角陣の場合、戦闘時、味方角陣の連撃が編成時の連撃×12%アップ（集結時の累加は20%まで）
        v: 12
        cap: 20
        scope: array

  潘璋:
    skills:
      - name: 武猛
        effect: 軍団が属する陣の歩兵の防御力が基礎防御力×40%アップ
        v: 40
        scope: legion
      - name: 搗届
        effect: 所属軍団が敵方武将を捕虜にする確率が50%アップ。属する陣の戦闘時、敵方の防御力が低下。低下率は、軍団が属する陣内の捕虜確率アップスキルを有する武将数×5%（宝物スキルは含まない。集結時の重ねがけ不可、効果が最高値のもののみ有効。低下率の上限は20%まで、絶対値の上限はなし）
        v: 5
        down: true
        cap: 20
        scope: rally
      - name: 焚身断梁
        effect: 属する陣の戦闘時、味方が与えるダメージが元の数値×19.8%アップ。味方の最終抵抗が敵より高い場合、さらに味方が与えるダメージが元の数値×5.5%アップ（集結時の重ねがけ不可、効果が最高値のみ有効。追加値はプレイヤーに対してのみ有効）
        v: 19.8
        scope: rally
      - name: 伏甲撃破
        effect: 属する陣の戦闘時、敵方の抵抗が低下、低下率は（5%+敵方歩兵比率×3%）。集結時の重ねがけ不可、効果が最高値のみ有効
        v: 5
        down: true
        scope: rally

  玄周泰:
    skills:
      - name: 忠魂
        effect: 所属陣の戦闘時、味方の軍紀がアップ。アップ率は編成時の軍紀×2%〜8%の中でランダム。（集結時の累加不可。効果は最高値のみ有効）
        v: 8
        scope: rally
      - name: 磐護
        effect: 所属部隊が歩兵の場合、属する陣の戦闘時、味方の防御力が編成時の防御力×20%アップ。集結時、同じ陣の累加可能。増加する防御力の上限は、所属部隊兵士の基礎防御力×100%
        v: 20
        scope: rally
      - name: 銅筋鉄骨
        effect: 所属軍団が属する陣の歩兵のシールドが基礎シールド×22%アップ。属する陣の毎回の交戦で味方が与えるダメージがアップ。アップ率は味方の残りシールド率×27.5%（集結時の累加不可、効果は最高値のみ有効、アップするダメージは15%を下回らない）
        v: 22
        scope: legion
      - name: 満身創痍
        effect: 所属陣の戦闘時、味方の貫通抵抗が編成時の貫通抵抗×5%アップ（集結時の累加不可、効果は最高値のみ有効）
        v: 5
        scope: rally

  高覧:
    skills:
      - name: 烈胆
        effect: 所属軍団が属する陣の騎兵の軍紀が基礎軍紀×15%アップ
        v: 15
        scope: legion
      - name: 霆撃
        effect: 所属部隊が騎兵の場合、属する陣の戦闘時、敵方の攻撃力が元の攻撃力×20%低下。低下する攻撃力上限は（100+300×敵方騎兵比率）。集結による累加は不可。
        v: 20
        down: true
        scope: rally
      - name: 敵営粉砕
        effect: 所属陣の戦闘時、敵方の軍紀が元の軍紀×19.8%低下（集結時、同じ陣の累加は30%まで）。味方プレイヤーが1名しかいない場合、戦闘時、追加で元の軍紀×5.5%低下
        v: 19.8
        down: true
        cap: 30
        scope: rally
      - name: 制敵攻破
        effect: 所属陣の戦闘時、敵方の連撃が低下。低下率は（5%+敵方騎兵の比率×3%）。集結による累加は不可、効果が最高値のみ有効
        v: 5
        down: true
        scope: rally
