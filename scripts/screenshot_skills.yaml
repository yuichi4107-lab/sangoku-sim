# スクショOCR（穴埋め・上書き）— ファイル名＝武将名ルール
# 最終更新: 2026-05-23
generals:
  玄蔡文姫:
    skills:
      - name: 出塞
        effect: 所属陣の戦闘時、味方が受ける実ダメージが減少、減少値は10%×味方の前回の交戦で損失した参戦可能兵士数（集結による累加なし、効果が最も高いもののみ有効）
        v: 10
        down: true
        scope: rally
      - name: 終曲
        effect: 所属部隊が弓兵の場合、所属陣の戦闘時、敵方の攻撃力-20%。低下の上限は（100+300×敵方弓兵比率）、集結による累加は不可
        v: 20
        down: true
        scope: rally
      - name: 胡笳悲歌
        effect: 所属陣の戦闘時、敵方兵士の貫通が減少。減少値は、戦闘前における元の貫通のより高いほうの数値×16.5%（集結時、同じ陣で累加可能。減少する貫通は敵方の元の貫通の20%）。同時に味方兵士の貫通がアップ、アップ値は戦闘前の元の貫通のより高いほうの数値×5.5%（集結時、同じ陣で累加可能。増加する貫通上限は味方の元の貫通の10%）
        v: 16.5
        down: true
        cap: 20
        scope: rally
      - name: 乱世の哀音
        effect: 所属陣の戦闘時、敵方の連撃が低下。低下率は（5%+敵方の弓兵比率×3%）。集結による累加は不可、効果が最も高いもののみ有効
        v: 5
        down: true
        scope: rally

  玄文鴦:
    troop_type: 騎兵
    slot_stat: 統率
    role_tags: [将印武将]
    skills:
      - name: 突騎
        effect: 統帥となり騎兵を帯同時、自身の率兵数が基礎率兵数×50%アップ
        v: 50
        scope: self
      - name: 斬帥
        effect: 戦闘勝利時、10%の確率で敵方武将に重傷を負わせる。属する陣の戦闘時、敵方の攻撃力が低下。低下率は、属する陣内にいる重傷スキルを有する武将数×5%（処刑スキルは含まない。集結時の重ねがけ不可、効果が最高値のみ有効。低下率の上限は20%まで、絶対値の上限はなし）
        v: 5
        down: true
        cap: 20
        scope: rally
      - name: 勇力絶大
        effect: 所属陣の初回交戦、味方が受けるダメージ20%低下。その後の毎回の交戦で、味方が受けるダメージ減少、数値は前回の交戦の味方の元ダメージ×20%、減少するダメージの上限は敵方の元ダメージの25%、下限は15%（集結時の累加は不可。効果が最高値のみ有効）
        v: 20
        down: true
        cap: 25
        scope: rally
