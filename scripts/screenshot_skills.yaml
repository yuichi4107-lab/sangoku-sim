  # 郭嘉.jpeg は一番上の武将が「玄・郭嘉」だったため玄郭嘉として登録（ファイル名は郭嘉）
  玄郭嘉:
    troop_type: 騎兵
    skills:
      - name: 奇俊
        effect: 属する陣が毎回の交戦前に50%の確率で名謀を発動。発動後、交戦のたびに味方の初回交戦前の防御力が編成時の防御力×10%増加（集結時、同じ陣で累加可能。交戦で増える防御力は毎回20%を超えず、200ptを超えない。今回の戦闘の累計は60%を超えず、600ptを超えない。戦闘1回につき1回のみ発動できる。毎回増える防御力は累加でき、戦闘終了まで持続）
        v: 10
        scope: rally
      - name: 遺計
        effect: 武将の所属部隊が騎兵の場合、属する陣の1回目の交戦で、味方の残り参戦可能兵士数が初期の参戦可能兵士数の10%を下回らない（集結時、同じ陣は効果が最も高いスキルを選んで有効となる。戦闘1回につき1回目の交戦中に1回のみ発動可）
        v: 10
        scope: rally
      - name: 兵勢無形
        effect: 所属陣の前回の交戦後、味方の残り参戦可能兵士数が初期の参戦可能兵士数の70%を下回ると、兵士数が初期参戦可能兵士数×20%増加し、追加で参戦する（追加で参戦した兵士は最後にダメージを受ける。集結した同じ陣による累加は最大30%、戦闘1回につき1回のみ発動）
        v: 20
        cap: 30
        scope: rally
