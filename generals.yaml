meta:
  game: 三国覇王戦記～乱世の系譜～
  publisher: Six Waves Inc.
  data_version: '0.5'
  last_updated: '2026-05-14'
  rarity_order:
  - 緑
  - 青
  - 紫
  - 橙
  - 玄
  troop_types:
  - 歩兵
  - 騎兵
  - 弓兵
  - 戦車
  - 万能
  slot_stats:
  - 統率
  - 武力
  - 知性
  progression_axes:
    breakthrough:
      label: 武将突破
      values:
      - 0
      - 1
      - 2
      - 3
      - 4
    equipment:
      label: 装備
      values:
      - 0
      - 1
      - 2
      - 3
      - 4
    level_break:
      label: Lv突破
      values:
      - false
      - true
    seal:
      label: 将印
      values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
  skill_scopes:
    self: 武将自身/所属部隊のみ
    legion: 軍団全体（軍団上限の累加対象）
    rally: 集結全体（集結上限の累加対象）
    array: 角陣（戦車副陣）
  cap_rules:
    no_cap:
      cap_type: none
      note: 上限なし。重ねるほど効果が伸びる
    legion_buff_default:
      scope: legion
      cap_type: unknown
      note: 軍団内バフの累加上限は公開情報で未確認
    rally_debuff_attack:
      scope: rally
      cap_type: fixed_percent
      cap_value: -50
      shared: true
      note: 集結・敵攻撃ダウン系（関羽武聖など）
    rally_suppress:
      scope: rally
      cap_type: fixed_percent
      cap_value: 80
      shared: true
      note: 集結・抑制操作系（張遼虎威など）
    rally_shield_reduce:
      scope: rally
      cap_type: fixed_value
      cap_value: -10000000
      shared: true
      note: 集結・敵シールド減少（馬超一騎当千など）
    rally_attack_up:
      scope: rally
      cap_type: fixed_percent
      cap_value: 50
      shared: true
      note: 集結・全体攻撃up（張寧姫克敵攻虎など）。副条件として兵士1人当たり最大100pt増
    rally_renge_up:
      scope: rally
      cap_type: fixed_percent
      cap_value: 60
      shared: true
      note: 集結・連撃up（張寧姫疾風虎勁など）
    rally_renge_down_shared:
      scope: rally
      cap_type: fixed_percent
      cap_value: -50
      shared: true
      note: 集結・連撃down系（玄孫権/関平など、共有プール）
    rally_per_soldier_pt_50:
      scope: rally
      cap_type: fixed_value
      cap_value: 50
      shared: false
      note: 兵士1人当たり最大50pt（玄趙雲死闘）
    rally_target_ratio_dynamic:
      scope: rally
      cap_type: dynamic_base
      cap_value: 0.1
      base_formula: min(敵集結合計兵力, 自集結合計兵力)
      shared: false
      note: 敵兵士負傷上限は集結軍団のうち合計兵力が少ない方の10%（関羽過関斬将）
    convert_pierce_30:
      scope: rally
      cap_type: ratio_of_base
      cap_value: 30
      cap_basis: 敵の元の貫通値
      shared: false
      note: 貫通転化系の上限（張遼制敵主義）
    rally_resist_down_80_shared:
      scope: rally
      cap_type: fixed_percent
      cap_value: -80
      shared: true
      note: 集結・敵抵抗ダウン（典韋・曹仁・王双系の共有プール、上限80%）
    rally_resist_down_50_non_shared:
      scope: rally
      cap_type: fixed_percent
      cap_value: -50
      shared: false
      note: 集結・敵抵抗ダウン（個別プール、上限50%）
    rally_renge_down_non_shared:
      scope: rally
      cap_type: fixed_percent
      cap_value: -50
      shared: false
      note: 集結・敵連撃ダウン（個別プール、上限50%）
  floor_rules:
    attack: 10
    defense: 10
    rensa: 20
    resist: 20
    pierce: 20
    pierce_resist: 20
    shield: 20
    discipline: 20
    final_damage: 10
    source: ゲーム内ルール説明ポップアップ (IMG_0671/0672, 2026-05-15)
    note: 敵方デバフが下げきれない下限。属性ごとに10%または20%。
