<style>
  :root {
    --bg: #f4ecd8;

  * { box-sizing: border-box; }
  html, body { -webkit-text-size-adjust: 100%; }

  h1 { font-size: 17px; margin: 0 0 4px 0; border-bottom: 2px solid var(--border); padding-bottom: 4px; }

  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row:last-child { margin-bottom: 0; }
  label.field { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  input[type="text"] { padding: 6px 8px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 14px; }
  select { padding: 6px; border: 1px solid var(--border); background: #fff; font-size: 14px; }
  button { padding: 8px 12px; background: var(--accent); color: #fff; border: none; cursor: pointer; font-family: inherit; font-size: 14px; border-radius: 4px; }

  .gcard .owned-check input[type="checkbox"] { width: 26px; height: 26px; cursor: pointer; accent-color: var(--ok); }
  .gcard .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gcard .name-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .gcard .name { font-size: 16px; font-weight: 600; }
  .gcard .badges { font-size: 11px; color: var(--muted); display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .gcard .badge { display: inline-block; padding: 1px 6px; background: #ede7d9; border-radius: 8px; }
  .gcard .badge.gen { background: #c8b070; color: #fff; }
  .gcard .badge.troop-騎兵 { background: #b3d4f0; }
  .gcard .badge.troop-歩兵 { background: #d4e0b3; }
  .gcard .badge.troop-弓兵 { background: #e8d0a8; }
  .gcard .badge.troop-戦車 { background: #c8b8d0; }
  .gcard .badge.troop-万能 { background: #d8c890; }
  .gcard .prog { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .gcard .prog label { font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; user-select: none; border-radius: 4px; min-height: 36px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .gcard .prog label.on { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 600; }
  .gcard .prog label input { display: none; }
  .gcard .prog .seal-wrap { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px; border: 1px solid var(--border); background: #fff; border-radius: 4px; min-height: 36px; }
  .gcard .prog .seal-wrap input { width: 40px; padding: 4px; font-size: 14px; text-align: center; border: 1px solid var(--border); }
  .gcard:not(.owned) .prog { display: none; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal.active { display: flex; }
  .modal-content { background: var(--paper); padding: 16px; max-width: 90%; border: 1px solid var(--border); border-radius: 4px; }
  .modal-content button { margin-top: 8px; }

  /* PC（広い画面）でも見やすく */
  @media (min-width: 700px) {

    .gcard .name { font-size: 17px; }

<h1>三国覇王戦記 武将所持登録</h1>
<div class="lead">
  所持している武将にチェック、突破/装備の段階を入力してください。<br>
  完了したら下の「📤 送信（オンライン）」を押すと、依頼者に直接データが届きます。<br>
  入力内容はこの端末に自動保存されるので、途中で閉じても続きから入力できます。
</div>

<div class="topbar">
  <div class="row">
    <label class="field" style="flex:1;min-width:180px;">
      👤 名前
      <input type="text" id="user-name" placeholder="例: 田中" style="flex:1;min-width:120px;">
    </label>
    <span class="counter">所持: <strong id="owned-count">0</strong> / <span id="total-count">0</span></span>
  </div>
  <div class="row">
    <select id="filter-troop">
      <option value="">兵種：全て</option>
      <option>歩兵</option><option>騎兵</option><option>弓兵</option><option>戦車</option><option>万能</option>
    </select>
    <select id="filter-rarity">
      <option value="">レア：全て</option>
      <option>橙</option><option>玄</option>
    </select>
    <input type="text" id="filter-search" placeholder="🔍 武将名" style="flex:1;min-width:100px;">
    <label class="field"><input type="checkbox" id="filter-owned-only">所持のみ</label>
  </div>
  <div class="row" style="font-size:12px;color:var(--muted);">
    一括（表示中に適用）:
    <label class="field"><input type="checkbox" id="bulk-owned">所持</label>
    <label class="field"><input type="checkbox" id="bulk-bt3">3突</label>
    <label class="field"><input type="checkbox" id="bulk-bt4">4突</label>
    <label class="field"><input type="checkbox" id="bulk-equipment">4装</label>
  </div>
  <div class="row">
    <button id="btn-submit" style="background:#2e8b3a;font-weight:600;">📤 送信（オンライン）</button>
    <button id="btn-clear" class="red">🗑️ 全クリア</button>
  </div>
</div>

<div id="roster-list"></div>


<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modal-msg" style="white-space:pre-line; margin-bottom:8px; font-size:14px;"></div>
    <div style="text-align:right;">
      <button id="modal-ok">OK</button>
    </div>
  </div>
</div>

<script>
// =========================
// データ・状態
// =========================
const STORAGE_KEY = 'sangoku_register_v1';

const state = {
  data: null,
  userName: '',
  ownerships: {},
  filters: { troop: '', rarity: '', search: '', ownedOnly: false },
};

function defaultOwn() {
  return { owned: false, breakthrough: 0, equipment: 0, seal: 0 };
}
function getOwn(genId) {
  if (!state.ownerships[genId]) state.ownerships[genId] = defaultOwn();
  return state.ownerships[genId];
}

function loadData() {
  if (!window.GENERALS_DATA) {
    document.body.innerHTML = '<h1 style="color:red;">データロードエラー: ページを再読み込みしてください。</h1>';
    throw new Error('GENERALS_DATA missing');
  }
  state.data = window.GENERALS_DATA;
}

function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    userName: state.userName,
    ownerships: state.ownerships,
  }));
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    state.userName = obj.userName || '';
    state.ownerships = obj.ownerships || {};
  } catch (e) { console.warn(e); }
}

// =========================
// 描画
// =========================
function filteredGenerals() {
  return state.data.generals.filter(g => {
    if (state.filters.troop && g.troop_type !== state.filters.troop) return false;
    if (state.filters.rarity && g.base_rarity !== state.filters.rarity) return false;
    if (state.filters.search && !g.name.includes(state.filters.search) && !((g.yomi||'').includes(state.filters.search))) return false;
    if (state.filters.ownedOnly && !getOwn(g.id).owned) return false;
    return true;
  });
}

function updateOwnedCount() {
  const total = state.data.generals.length;
  let owned = 0;
  for (const g of state.data.generals) {
    if (getOwn(g.id).owned) owned++;
  }
  document.getElementById('owned-count').textContent = owned;
  document.getElementById('total-count').textContent = total;
}

function renderRoster() {
  const container = document.getElementById('roster-list');
  container.innerHTML = '';
  const list = filteredGenerals();
  for (const g of list) {
    const own = getOwn(g.id);
    const card = document.createElement('div');
    card.className = 'gcard' + (own.owned ? ' owned' : '');
    card.innerHTML = `
      <div class="owned-check">
        <input type="checkbox" ${own.owned ? 'checked' : ''} data-id="${g.id}" data-axis="owned">
      </div>
      <div class="info">
        <div class="name-row">
          <span class="name">${g.name}</span>
          <span class="badges">
            <span class="badge ${g.base_rarity === '玄' ? 'gen' : ''}">${g.base_rarity}</span>
            <span class="badge troop-${g.troop_type}">${g.troop_type || '?'}</span>
          </span>
        </div>
        <div class="prog">
          <label class="${own.breakthrough === 3 ? 'on' : ''}"><input type="checkbox" ${own.breakthrough === 3 ? 'checked' : ''} data-id="${g.id}" data-axis="bt3">3突</label>
          <label class="${own.breakthrough === 4 && own.equipment !== 4 && (own.seal||0) === 0 ? 'on' : ''}"><input type="checkbox" ${own.breakthrough === 4 && own.equipment !== 4 && (own.seal||0) === 0 ? 'checked' : ''} data-id="${g.id}" data-axis="bt4">4突</label>
          <label class="${own.equipment === 4 ? 'on' : ''}"><input type="checkbox" ${own.equipment === 4 ? 'checked' : ''} data-id="${g.id}" data-axis="equipment">4装</label>
          <span class="seal-wrap ${(own.seal||0) > 0 ? 'on' : ''}">印<input type="number" min="0" max="10" value="${own.seal}" data-id="${g.id}" data-axis="seal"></span>
        </div>
      </div>
    `;
    container.appendChild(card);
  }
  // bind
  container.querySelectorAll('input[data-axis]').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.id;
      const axis = inp.dataset.axis;
      const own = getOwn(id);
      let needFullRerender = false;
      if (axis === 'owned') { own.owned = inp.checked; needFullRerender = true; }
      // なし→3突→4突→(4装 or 将印)。4装と将印(印>0)は排他。
      else if (axis === 'bt3') {
        if (inp.checked) { own.breakthrough = 3; own.equipment = 0; own.seal = 0; }
        else if (own.breakthrough === 3) own.breakthrough = 0;
        needFullRerender = true;
      } else if (axis === 'bt4') {
        if (inp.checked) { own.breakthrough = 4; own.equipment = 0; own.seal = 0; }
        else if (own.breakthrough === 4 && own.equipment === 0 && (own.seal||0) === 0) own.breakthrough = 0;
        needFullRerender = true;
      } else if (axis === 'equipment') {
        if (inp.checked) { own.breakthrough = 4; own.equipment = 4; own.seal = 0; }
        else own.equipment = 0;
        needFullRerender = true;
      } else if (axis === 'seal') {
        const v = Math.max(0, Math.min(10, parseInt(inp.value, 10) || 0));
        own.seal = v;
        if (v > 0) { own.breakthrough = 4; own.equipment = 0; }  // 将印パス: 装備と排他
        needFullRerender = true;
      }
      saveLocal();
      updateOwnedCount();
      if (needFullRerender) renderRoster();
    });
  });
  updateOwnedCount();
}

['bulk-owned', 'bulk-bt3', 'bulk-bt4', 'bulk-equipment'].forEach(id => {

      else if (id === 'bulk-bt4') { if (on) { own.breakthrough = 4; own.equipment = 0; own.seal = 0; } else if (own.breakthrough === 4 && own.equipment === 0 && (own.seal||0) === 0) own.breakthrough = 0; }
      else if (id === 'bulk-equipment') { if (on) { own.breakthrough = 4; own.equipment = 4; own.seal = 0; } else own.equipment = 0; }
    }
    saveLocal();
    renderRoster();
    e.target.checked = false;  // 一括チェック自体は OFF に戻す（UX）
  });
});

// オンライン送信先（メインシミュ index.html と同じGAS endpoint）
const SUBMIT_API_URL = 'https://script.google.com/macros/s/AKfycbzHbJsj9mdyVqJvMl85_NkB5y4k4tbQ2hYXahT3gVNAPaQfCU4629xuvmnEtQJc6B26/exec';

// File→base64 ヘルパー
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const r = reader.result;
      const idx = r.indexOf(',');
      resolve(idx >= 0 ? r.slice(idx + 1) : r);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 画像添付モーダル → 添付なしでは送信不可（複数枚を追加・個別削除可）
function showImageAttachModal() {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--paper);padding:16px;border:1px solid var(--border);border-radius:4px;max-width:400px;width:100%;';
    box.innerHTML = `
      <div style="font-weight:600;font-size:15px;margin-bottom:6px;">📸 兵士属性スクショの添付（必須）</div>
      <div style="font-size:12px;color:#555;margin-bottom:10px;line-height:1.5;">
        ゲーム内「詳細情報」画面の「兵士属性」スクショを添付してください。<br>
        通常はスクロールしながら <strong>3〜4枚</strong> 必要です。<br>
        「画像を追加」を繰り返し押して複数枚選択できます。<br>
        <span style="color:#c33;">※ 1枚以上添付しないと送信できません。</span>
      </div>
      <button id="btn-img-add" style="background:#5a7a5a;padding:8px 14px;width:100%;margin-bottom:8px;">📷 画像を追加</button>
      <input type="file" id="img-input" accept="image/*" multiple style="display:none;">
      <div id="img-preview" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;max-height:240px;overflow:auto;"></div>
      <div id="img-count" style="font-size:11px;color:#666;margin-bottom:8px;text-align:center;"></div>
      <div style="display:flex;gap:6px;justify-content:flex-end;">
        <button id="btn-img-cancel" style="background:#888;">キャンセル</button>
        <button id="btn-img-ok" style="background:var(--ok);" disabled>📤 送信</button>
      </div>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const fileInput = box.querySelector('#img-input');
    const preview = box.querySelector('#img-preview');
    const btnOk = box.querySelector('#btn-img-ok');
    const btnAdd = box.querySelector('#btn-img-add');
    const countLabel = box.querySelector('#img-count');
    let files = [];

    function refresh() {
      preview.innerHTML = '';
      files.forEach((f, idx) => {
        const url = URL.createObjectURL(f);
        const wrap = document.createElement('div');
        wrap.style.cssText = 'border:1px solid var(--border);padding:2px;background:#fff;position:relative;';
        wrap.innerHTML = `
          <img src="${url}" style="display:block;width:80px;height:80px;object-fit:cover;">
          <div style="font-size:10px;text-align:center;width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${idx + 1}. ${f.name}</div>
          <button data-del="${idx}" title="削除" style="position:absolute;top:2px;right:2px;background:#c33;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:18px;padding:0;">×</button>`;
        preview.appendChild(wrap);
      });
      preview.querySelectorAll('button[data-del]').forEach(b => {
        b.addEventListener('click', () => {
          files.splice(parseInt(b.dataset.del, 10), 1);
          refresh();
        });
      });
      countLabel.textContent = files.length ? `添付中: ${files.length}枚` : '（まだ画像が添付されていません）';
      btnOk.disabled = files.length === 0;
      btnOk.style.opacity = files.length === 0 ? '0.4' : '1';
      btnOk.textContent = files.length ? `📤 送信（${files.length}枚）` : '📤 送信';
    }
    refresh();

    btnAdd.addEventListener('click', () => {
      fileInput.value = '';  // 同じファイル再選択も発火させるため
      fileInput.click();
    });
    fileInput.addEventListener('change', () => {
      const added = Array.from(fileInput.files || []);
      for (const nf of added) {
        // 同名重複は無視
        if (files.some(f => f.name === nf.name && f.size === nf.size)) continue;
        files.push(nf);
      }
      refresh();
    });
    box.querySelector('#btn-img-cancel').onclick = () => { document.body.removeChild(overlay); resolve(null); };
    btnOk.onclick = () => { document.body.removeChild(overlay); resolve(files); };
  });
}

document.getElementById('btn-submit').addEventListener('click', async () => {
  const name = (state.userName || '').trim();
  if (!name) {
    notify('「名前」を入力してください。\n（依頼者がデータを識別するために必須です）');
    document.getElementById('user-name').focus();
    return;
  }

  // 画像添付モーダル
  const files = await showImageAttachModal();
  if (!files) return;  // キャンセル
  if (!files.length) { notify('画像が必要です。'); return; }

  const btn = document.getElementById('btn-submit');
  const orig = btn.textContent;
  btn.textContent = '送信中…';
  btn.disabled = true;
  try {
    // 画像を base64 化
    const images = [];
    for (const f of files) {
      const b64 = await fileToBase64(f);
      images.push({ name: f.name, mimeType: f.type || 'image/png', base64: b64 });
    }
    const payload = {
      action: 'submit_user',
      user_name: name,
      ownerships: state.ownerships,
      images: images,
    };
    const form = new URLSearchParams();
    form.append('payload', JSON.stringify(payload));
    await fetch(SUBMIT_API_URL, {
      method: 'POST',
      body: form,
      mode: 'no-cors',
    });
    notify(`✅ 送信完了\n\n名前: ${name}\n登録した武将数: ${Object.values(state.ownerships).filter(o => o.owned).length}\n添付画像: ${images.length}枚\n\nデータは依頼者に届きました。\nご協力ありがとうございました！`);
  } catch (err) {
    notify(`❌ 送信失敗: ${err.message}\n\nお手数ですが「💾 JSONダウンロード」でファイル保存後、依頼者に直接お送りください。`);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('入力した所持データを全てクリアします。よろしいですか？')) return;
  state.ownerships = {};
  saveLocal();
  renderRoster();
});

// 起動
