name: build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply approved Codex changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Missing replacement target in {path}')
              write(path, text.replace(old, new, 1))

          def insert_after(path, marker, addition, sentinel):
              text = read(path)
              if sentinel in text:
                  return
              if marker not in text:
                  raise SystemExit(f'Missing insertion target in {path}')
              write(path, text.replace(marker, marker + addition, 1))

          replace_once(
              'index.html',
              '  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }\n  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }',
              '  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px; width: 100%; max-width: 1440px; margin: 0 auto; }\n  @media (max-width: 900px) { main { padding: 12px; } }',
          )
          insert_after(
              'index.html',
              'const PRIORITY_WEIGHTS = [16, 8, 4, 2, 1];\n',
              "const FORCED_AUTO_GENERAL_IDS = new Set(['関平', '蒋欽', '李典', 'chouryou']);\nconst FORCED_AUTO_SCORE_BONUS = 1000000000;\n\nfunction isForcedAutoGeneral(g) {\n  return !!(g && FORCED_AUTO_GENERAL_IDS.has(g.id));\n}\n\n",
              'FORCED_AUTO_GENERAL_IDS',
          )
          insert_after(
              'index.html',
              '  for (let i = 0; i < scores.length; i++) score += scores[i] * (PRIORITY_WEIGHTS[i] || 0);\n',
              '  if (isForcedAutoGeneral(g)) score += FORCED_AUTO_SCORE_BONUS;\n',
              'FORCED_AUTO_SCORE_BONUS;',
          )
          insert_after(
              'index.html',
              '        if (ga === gb) continue;\n',
              '        const gaObj = genMap.get(ga), gbObj = genMap.get(gb);\n        if (!troopAllowedForPhase((gbObj || {}).troop_type, filled[a].troop, filled[a].bi < 0)) continue;\n        if (!troopAllowedForPhase((gaObj || {}).troop_type, filled[b].troop, filled[b].bi < 0)) continue;\n',
              'const gaObj = genMap.get(ga), gbObj = genMap.get(gb);',
          )

          formation_block = '''\n### 強制選択武将\n\n以下の武将は、自動編成で通常スコアより優先して選択する。\n\n| 武将 | 兵種 | 強制選択される条件 |\n|---|---|---|\n| 関平 | 騎兵 | 騎兵の軍団が兵種指定されている |\n| 蒋欽 | 弓兵 | 弓兵の軍団が兵種指定されている |\n| 李典 | 歩兵 | 歩兵の軍団が兵種指定されている |\n| 張遼 | 万能 | いずれかの軍団で兵種指定されている |\n\n- 兵種未指定の軍団は従来どおり自動編成対象外のため、強制選択もしない。\n- 強制選択武将も、対象プレイヤーが所持していること、同じプレイヤーの他軍団で未使用であることを前提にする。\n- 張遼は `troop_type: 万能` のため、歩兵・騎兵・弓兵のどの指定軍団にも配置できる。\n'''
          replace_once('docs/formation_rules.md', '最終更新: 2026-06-03', '最終更新: 2026-06-04')
          insert_after(
              'docs/formation_rules.md',
              '- slot_stat（統率/武力/知性の登録属性）は配置可否に影響しない（スキルの担当条件はスコアで考慮 → 第4節）。\n',
              formation_block,
              '### 強制選択武将',
          )
          insert_after(
              'docs/usage.md',
              '- **戦車武将のルール**: 1軍団あたり**最大3人**まで。配置は**角陣のみ**（部隊枠には入りません）。\n',
              '- **強制選択武将**: 関平（騎兵）/ 蒋欽（弓兵）/ 李典（歩兵）/ 張遼（万能）は、兵種指定済みの対象軍団がある場合に優先して配置されます。\n',
              '強制選択武将',
          )
          insert_after(
              'docs/usage_full.md',
              '- **戦車武将のルール**: 1軍団あたり**最大3人**まで。配置は**角陣のみ**(部隊枠には入らない)。\n',
              '- **強制選択武将**: 関平(騎兵) / 蒋欽(弓兵) / 李典(歩兵) / 張遼(万能) は、兵種指定済みの対象軍団がある場合に優先して配置される。\n',
              '強制選択武将',
          )
          PY

          perl -0777 -ne 'while(/<script>(.*?)<\/script>/sg){print $1, "\n"}' index.html | node --check -
          git diff --check -- index.html docs/formation_rules.md docs/usage.md docs/usage_full.md
          if [[ -n "$(git status --porcelain -- index.html docs/formation_rules.md docs/usage.md docs/usage_full.md)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html docs/formation_rules.md docs/usage.md docs/usage_full.md
            git commit -m "自動編成ルールと画面レイアウトを公開"
            git push
          else
            echo "No content changes to commit"
          fi
