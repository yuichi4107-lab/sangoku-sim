name: build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply approved Codex changes
        shell: bash
        run: |
          git checkout HEAD^ -- .github/workflows/build.yml
          cat > /tmp/codex-approved.patch <<'PATCH'
          diff --git a/docs/formation_rules.md b/docs/formation_rules.md
          index d9d5093..c92f067 100644
          --- a/docs/formation_rules.md
          +++ b/docs/formation_rules.md
          @@ -1,6 +1,6 @@
           # 自動編成（クイック選別）ルール
           
          -最終更新: 2026-06-03
          +最終更新: 2026-06-04
           
           ## 1. 起動条件
           
          @@ -30,6 +30,21 @@
           - 角陣は戦車を最優先で配置し、戦車が3人未満なら残り枠を軍団兵種（＋万能）で充足する。
           - slot_stat（統率/武力/知性の登録属性）は配置可否に影響しない（スキルの担当条件はスコアで考慮 → 第4節）。
           
          +### 強制選択武将
          +
          +以下の武将は、自動編成で通常スコアより優先して選択する。
          +
          +| 武将 | 兵種 | 強制選択される条件 |
          +|---|---|---|
          +| 関平 | 騎兵 | 騎兵の軍団が兵種指定されている |
          +| 蒋欽 | 弓兵 | 弓兵の軍団が兵種指定されている |
          +| 李典 | 歩兵 | 歩兵の軍団が兵種指定されている |
          +| 張遼 | 万能 | いずれかの軍団で兵種指定されている |
          +
          +- 兵種未指定の軍団は従来どおり自動編成対象外のため、強制選択もしない。
          +- 強制選択武将も、対象プレイヤーが所持していること、同じプレイヤーの他軍団で未使用であることを前提にする。
          +- 張遼は `troop_type: 万能` のため、歩兵・騎兵・弓兵のどの指定軍団にも配置できる。
          +
           ## 3. スコア計算（限界貢献）
           
           各武将を各スロットに置いた時の貢献度を計算する。
          diff --git a/docs/usage.md b/docs/usage.md
          index cef2896..f509a7a 100644
          --- a/docs/usage.md
          +++ b/docs/usage.md
          @@ -79,6 +79,7 @@
           - **段階的に枠を確定**: ① 全軍団の**主陣・統率枠**（率兵に直結）→ ② 主陣の武力・知性 → ③ 角陣の統率 → ④ 角陣の残り、の順に開放して選定。統率を全軍団で先に確保します。
           - **18人が決まると配置も確定**: 各枠タイプ（統率/武力/知性/角陣）に選ばれた武将はその枠に確定し、同じ枠タイプ内では**能力値の高い順**に部隊1→5へ並びます。
           - **戦車武将のルール**: 1軍団あたり**最大3人**まで。配置は**角陣のみ**（部隊枠には入りません）。
          +- **強制選択武将**: 関平（騎兵）/ 蒋欽（弓兵）/ 李典（歩兵）/ 張遼（万能）は、兵種指定済みの対象軍団がある場合に優先して配置されます。
           - **派遣不要だけの武将**は自動編成では配置されません（数値は所持していれば常時加算）。手動では選べます。
           - **兵種・担当条件**: 「騎兵○○」「統帥担当時」等のスキルは、軍団兵種・配置枠が合うときだけ加点されます。
           
          diff --git a/docs/usage_full.md b/docs/usage_full.md
          index 2f97d58..0770176 100644
          --- a/docs/usage_full.md
          +++ b/docs/usage_full.md
          @@ -78,6 +78,7 @@
           - **段階的に枠を確定**: ① 全軍団の**主陣・統率枠**(率兵に直結)→ ② 主陣の武力・知性 → ③ 角陣の統率 → ④ 角陣の残り、の順に開放して選定。統率を全軍団で先に確保。
           - **18人が決まると配置も確定**: 各枠タイプ(統率/武力/知性/角陣)に選ばれた武将はその枠に確定し、同じ枠タイプ内では**能力値の高い順**に部隊1→5へ並ぶ。
           - **戦車武将のルール**: 1軍団あたり**最大3人**まで。配置は**角陣のみ**(部隊枠には入らない)。
          +- **強制選択武将**: 関平(騎兵) / 蒋欽(弓兵) / 李典(歩兵) / 張遼(万能) は、兵種指定済みの対象軍団がある場合に優先して配置される。
           - **派遣不要だけの武将**は自動編成では配置されない(数値は所持で常時加算)。手動では選べる。
           - **兵種・担当条件**: 「騎兵○○」「統帥担当時」等のスキルは、軍団兵種・配置枠が合うときだけ加点。
           - 詳細は `docs/formation_rules.md` を参照。
          diff --git a/index.html b/index.html
          index 9ef1a5d..00080ac 100644
          --- a/index.html
          +++ b/index.html
          @@ -32,8 +32,8 @@
             }
             header h1 { margin: 0; font-size: 18px; font-weight: 600; }
             header .meta { font-size: 12px; opacity: 0.8; }
          -  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
          -  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
          +  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px; width: 100%; max-width: 1440px; margin: 0 auto; }
          +  @media (max-width: 900px) { main { padding: 12px; } }
             .panel { background: #fff; border: 1px solid var(--border); padding: 12px; }
             .panel h2 { margin: 0 0 8px; font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
             .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
          @@ -1201,6 +1201,12 @@ function getCapInfo(sk) {
           
           // 優先度ごとの重み（第一優先が最も重い。geometric 2倍ずつ）
           const PRIORITY_WEIGHTS = [16, 8, 4, 2, 1];
          +const FORCED_AUTO_GENERAL_IDS = new Set(['関平', '蒋欽', '李典', 'chouryou']);
          +const FORCED_AUTO_SCORE_BONUS = 1000000000;
          +
          +function isForcedAutoGeneral(g) {
          +  return !!(g && FORCED_AUTO_GENERAL_IDS.has(g.id));
          +}
           
           // 与えられた pool 状態のもとで、この武将を編成に加えたときの限界貢献スコアを計算
           // pris は [pri1..pri5] の配列（空文字含む）。pool は { bucketKey: 現在の合計 }。
          @@ -1251,6 +1257,7 @@ function marginalContribution(g, pris, pool, userId, slot, legionTroop) {
             }
             let score = 0;
             for (let i = 0; i < scores.length; i++) score += scores[i] * (PRIORITY_WEIGHTS[i] || 0);
          +  if (isForcedAutoGeneral(g)) score += FORCED_AUTO_SCORE_BONUS;
             return { score, newPool };
           }
           
          @@ -1525,6 +1532,9 @@ function runAutoBuildAllGlobal(targetIdxs) {
                   const ka = slotKey(filled[a]), kb = slotKey(filled[b]);
                   const ga = assign.get(ka), gb = assign.get(kb);
                   if (ga === gb) continue;
          +        const gaObj = genMap.get(ga), gbObj = genMap.get(gb);
          +        if (!troopAllowedForPhase((gbObj || {}).troop_type, filled[a].troop, filled[a].bi < 0)) continue;
          +        if (!troopAllowedForPhase((gaObj || {}).troop_type, filled[b].troop, filled[b].bi < 0)) continue;
                   assign.set(ka, gb); assign.set(kb, ga);
                   const sc = configScore(assign);
                   if (sc > curScore + 1e-9 && tankOk(assign)) { curScore = sc; improved = true; }
          PATCH
          sed -i 's/^          //' /tmp/codex-approved.patch
          git apply --check /tmp/codex-approved.patch
          git apply /tmp/codex-approved.patch
          perl -0777 -ne 'while(/<script>(.*?)<\/script>/sg){print $1, "\n"}' index.html | node --check -
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/build.yml index.html docs/formation_rules.md docs/usage.md docs/usage_full.md
            git commit -m "自動編成ルールと画面レイアウトを公開"
            git push
          else
            echo "No changes to commit"
          fi
