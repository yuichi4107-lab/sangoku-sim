# =====================================================================
# 三国覇王戦記～乱世の系譜～ 武将データベース
# サンプル v0.3 ／ スキル特化・段階対応版
# Six Waves Inc. 配信版
# ---------------------------------------------------------------------
# v0.3 の確定事項（2026-05-14, schema.md と一致）:
#   ・育成段階の運用は「案A」: by_breakthrough は5要素配列を完全維持、
#     判明分のみ実数、未判明は null。
#   ・将印（seal）は 0〜5 の6段。
#   ・ステータス（統率・武力・魅力等）は非収録。スキル特化でいく。
#     → 旧 stats / level_break_bonus ブロックは削除。
# v0.2 からの変更点：
#   ・stats / level_break_bonus を削除（スキル特化方針）。
#   ・data_version を 0.3 に更新。
# =====================================================================

meta:
  game: "三国覇王戦記～乱世の系譜～"
  publisher: "Six Waves Inc."
  data_version: "0.3"
  last_updated: "2026-05-14"
  rarity_order: ["緑", "青", "紫", "橙", "玄"]
  troop_types: ["歩兵", "騎兵", "弓兵", "戦車", "万能"]

  # -------------------------------------------------------------------
  # 育成段階の軸（progression_axes）
  #   4つの軸はすべて独立。プレイヤーごとに組み合わせが異なる。
  #   例：「突破4・装備2・Lv突破あり・将印1」など自由な組み合わせが成立する。
  # -------------------------------------------------------------------
  progression_axes:
    breakthrough:        # 武将突破（覚醒進度）
      label: "武将突破"
      values: [0, 1, 2, 3, 4]
      note: >
        覚醒の進行度。進度4で「玄武将」化し覚醒スキルが解放される。
        スキルの解放可否・倍率に最も大きく影響する軸。
    equipment:           # 装備段階
      label: "装備"
      values: [0, 1, 2, 3, 4]
      note: >
        装備の強化段。主に攻撃/防御/貫通などの兵士属性に影響。
        スキル倍率に影響する場合もある（スキル側の equipment テーブルで表現）。
    level_break:         # Lv上限突破
      label: "Lv突破"
      values: [false, true]
      note: >
        武将レベルの上限解放（LvMAX突破）。率兵数・基礎ステータスに影響。
        true / false の2値で管理。
    seal:                # 将印
      label: "将印"
      values: [0, 1, 2, 3, 4, 5]
      note: >
        将印システムによる追加強化枠。段数はゲーム仕様に合わせて調整可。
        将印固有の効果は skills 内 seal_bonus で表現。

  skill_scopes:
    self:   "武将自身/所属部隊のみ"
    legion: "軍団全体（軍団上限の累加対象）"
    rally:  "集結全体（集結上限の累加対象）"
    array:  "角陣（戦車副陣）"

  cap_rules:
    legion_buff_default:
      scope: "legion"
      cap_type: "unknown"
      note: "軍団内バフの累加上限は公開情報では未確認。要検証。"
    rally_debuff_attack:
      scope: "rally"
      cap_type: "fixed_percent"
      cap_value: -50
      note: "集結時の敵攻撃ダウン系は合算-50%で頭打ち。"
    rally_suppress:
      scope: "rally"
      cap_type: "fixed_percent"
      cap_value: 80
      note: "抑制操作系は集結で80%上限。"
    rally_shield_reduce:
      scope: "rally"
      cap_type: "fixed_value"
      cap_value: -10000000
      note: "集結時の敵シールド減少は累計-1000万ptで頭打ち。"
    rally_attack_up:
      scope: "rally"
      cap_type: "fixed_percent"
      cap_value: 50
      note: "集結時の全体攻撃アップ系は+50%上限。"
    rally_renge_up:
      scope: "rally"
      cap_type: "fixed_percent"
      cap_value: 60
      note: "集結時の連撃アップ系は+60%上限。"
    no_cap:
      cap_type: "none"
      note: "上限なし。重ねるほど効果が伸びる。"

  # -------------------------------------------------------------------
  # スキル値の持ち方（value_model）の説明
  #   各スキルの value は「段階別テーブル」で表現する。
  #
  #   by_breakthrough : 突破0〜4 それぞれの実数（5要素の配列）
  #   by_equipment    : 装備0〜4 による加算/上書き（任意・スキル依存）
  #   unlocked_at     : そのスキルが解放される突破段（例：覚醒スキルは4）
  #
  #   値が不明な段階は null を入れる。
  #   配列の中に null が混ざる ＝「その段はまだ実数未登録」。
  #   シミュレーターは null の段が選ばれたら「要ゲーム内確認」と表示する。
  # -------------------------------------------------------------------
  value_model:
    description: >
      段階別の実数を持つための共通フォーマット。判明分のみ入れ、
      未判明は null。confidence で確度を併記する。

generals:

  # ====================================================================
  # サンプル1：張遼（橙→玄）
  #   突破4で覚醒スキル「制敵主義」が解放されるケースを表現。
  # ====================================================================
  - id: "chouryou"
    name: "張遼"
    yomi: "ちょうりょう"
    base_rarity: "橙"
    troop_type: "歩兵"
    faction: "魏"
    role_tags: ["集結デバフ", "歩兵軍団バフ", "覚醒推奨"]

    skills:
      # --- 通常スキル：突破段で倍率が伸びる ---
      - name: "虎威"
        type: "debuff"
        scope: "rally"
        unlocked_at: 0                       # 最初から所持
        effect: "敵全兵種の抑制係数アップ／敵が味方にかける抑制をダウン"
        unit: "percent"
        value:
          by_breakthrough: [null, null, null, null, 20]  # 突破4で20%とだけ判明
          by_equipment:    [0, null, null, null, null]   # 装備による加算は未登録
          confidence: "low"
        cap:
          rule: "rally_suppress"
          cap_value: 80

      - name: "突撃"
        type: "buff"
        scope: "legion"
        unlocked_at: 0
        effect: "軍団内の歩兵の攻撃力アップ"
        unit: "percent"
        value:
          by_breakthrough: [null, null, null, null, 20]
          by_equipment:    [null, null, null, null, null]
          confidence: "low"
        cap:
          rule: "legion_buff_default"
          cap_value: null

      # --- 覚醒スキル：突破4で初めて解放 ---
      - name: "制敵主義"
        type: "convert"
        scope: "rally"
        unlocked_at: 4                       # ★突破3以下では存在しない
        effect: "敵全兵士の貫通10%を自軍の貫通に転化"
        unit: "percent"
        value:
          by_breakthrough: [null, null, null, null, 10]
          confidence: "low"
        cap:
          rule: "ratio_of_base"
          cap_value: 30
          cap_basis: "敵の元の貫通値"

    # --- 将印による追加効果（将印段ごと）---
    seal_bonus:
      by_seal: [null, null, null, null, null, null]   # 将印0〜5、実数未登録
      effect_note: "将印固有の強化。内容・実数とも要確認。"
      confidence: "unknown"

    sources:
      - "https://sangoku-haou.gamer-wiki.com/character/tyouryou"
      - "https://www.haou-no-waza.com/"

  # ====================================================================
  # サンプル2：于禁（橙）
  #   軍団スキル+50%の触媒型。装備段でも倍率が動く想定の書き方。
  # ====================================================================
  - id: "ukin"
    name: "于禁"
    yomi: "うきん"
    base_rarity: "橙"
    troop_type: "騎兵"
    faction: "魏"
    role_tags: ["騎兵軍団触媒", "集結強化", "最優先育成"]

    skills:
      - name: "恐弦"
        type: "buff"
        scope: "legion"
        unlocked_at: 0
        effect: "軍団内の騎兵の攻撃力アップ"
        unit: "percent"
        value:
          by_breakthrough: [null, null, null, null, 15]
          by_equipment:    [null, null, null, null, null]
          confidence: "low"
        cap:
          rule: "legion_buff_default"
          cap_value: null

      - name: "仮節鉞"
        type: "amplify"
        scope: "legion"
        unlocked_at: 4
        effect: "軍団内の全騎兵の付加スキル効果を+50%（触媒スキル）"
        unit: "percent"
        value:
          by_breakthrough: [null, null, null, null, 50]
          confidence: "low"
        cap:
          rule: "legion_buff_default"
          cap_value: null
          note: "触媒型。同種複数時の上限挙動は要検証。"

    seal_bonus:
      by_seal: [null, null, null, null, null, null]
      effect_note: "要確認。"
      confidence: "unknown"

    sources:
      - "https://sangoku-haou.gamer-wiki.com/haou-commander-recommended"

# ---------------------------------------------------------------------
# 編成シミュレーターでの使い方（このv0.2で実現したいこと）
# ---------------------------------------------------------------------
# 1. プレイヤーは武将ごとに自分の段階を入力する：
#      張遼 → 突破:3 / 装備:4 / Lv突破:true / 将印:1
#
# 2. シミュレーターは入力段階に応じてスキルを解決する：
#      ・unlocked_at(4) > 突破(3) なら「制敵主義」は編成に存在しない扱い
#      ・value.by_breakthrough[3] が null なら「実効値: 要確認」と表示
#      ・value が判明していれば by_breakthrough[突破] ＋ by_equipment[装備]
#        ＋ seal_bonus.by_seal[将印] を合算して実効値とする
#
# 3. scope:rally のスキルを合計するとき cap_rules の上限を適用し、
#    超過分は「オーバーフロー（無効）」として可視化する。
#
# 4. scope:legion で cap_value:null（unknown）のものは
#    「単純加算の参考値」＋「上限未確認」の注記つきで表示する。
#
# ※ 段階別の実数（by_breakthrough / by_equipment / by_seal）は
#   現状ほぼ null。ゲーム内で確認でき次第ここを埋めれば、
#   武将データ側を直すだけでシミュレーターの精度が上がる設計。
# =====================================================================
