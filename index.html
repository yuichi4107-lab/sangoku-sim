<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>三国覇王戦記 編成シミュレーター</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f5f1;
    --fg: #222;
    --muted: #777;
    --border: #d0c9bf;
    --accent: #8b4513;
    --warn: #b9460e;
    --ok: #2f7a3f;
    --legion: #e8eef4;
    --rally: #f5ebe0;
    --array: #efe5f0;
    --self: #f0f0e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    background: var(--bg); color: var(--fg);
    font-size: 14px; line-height: 1.5;
  }
  header {
    padding: 12px 20px; background: #2f2a23; color: #f5efe2;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 3px solid var(--accent);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { font-size: 12px; opacity: 0.8; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--border); padding: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .filters input, .filters select {
    border: 1px solid var(--border); padding: 4px 6px; font-size: 13px;
    background: #fff; font-family: inherit;
  }
  .filters label { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #ede7d9; padding: 4px 6px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  td { padding: 3px 6px; border-bottom: 1px solid #eee5d6; vertical-align: middle; }
  tr.owned td { background: #fafaf3; }
  tr.selected td { background: #fff3e0; }
  .roster-scroll { max-height: 70vh; overflow-y: auto; border: 1px solid var(--border); }
  .badge { display: inline-block; padding: 1px 5px; font-size: 11px; border-radius: 2px; margin-right: 4px; }
  .b-rarity-橙 { background: #f5a623; color: #fff; }
  .b-rarity-玄 { background: #4a4a4a; color: #fff; }
  .b-troop { background: #ddd; color: #333; }
  .b-troop-歩兵 { background: #c7d8c0; }
  .b-troop-騎兵 { background: #e6c5a3; }
  .b-troop-弓兵 { background: #d9c0e0; }
  .b-troop-戦車 { background: #c9d4e2; }
  .b-troop-万能 { background: #ebe2c1; }
  .progression { display: inline-flex; gap: 4px; align-items: center; }
  .progression input[type="number"] { width: 36px; padding: 1px 2px; font-size: 12px; }
  .progression input[type="checkbox"] { margin: 0; }
  .progression label { font-size: 11px; color: var(--muted); }
  .skill-row { padding: 4px 0; border-bottom: 1px dotted #ccc; }
  .skill-row:last-child { border-bottom: none; }
  .scope-badge { display: inline-block; padding: 1px 5px; font-size: 10px; border-radius: 2px; margin-right: 4px; }
  .scope-legion { background: var(--legion); }
  .scope-rally { background: var(--rally); }
  .scope-array { background: var(--array); }
  .scope-self { background: var(--self); }
  .conf-low, .conf-unknown { color: var(--warn); font-weight: 600; }
  .conf-medium { color: var(--accent); }
  .conf-high { color: var(--ok); }
  .summary-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted #ccc; }
  .summary-row .label { color: var(--muted); }
  .summary-row .value { font-weight: 600; }
  .overflow { color: var(--warn); }
  .ok { color: var(--ok); }
  button {
    border: 1px solid var(--border); background: #fff; padding: 4px 10px;
    cursor: pointer; font-family: inherit; font-size: 12px;
  }
  button:hover { background: #f0e8d8; }
  .controls { margin-bottom: 8px; }
  details { margin: 6px 0; }
  summary { cursor: pointer; padding: 2px 0; font-weight: 600; }
  .warn-banner { background: #fbecdc; border-left: 4px solid var(--warn); padding: 6px 10px; margin-bottom: 8px; font-size: 12px; }
  .empty-slot { color: var(--muted); font-style: italic; }
  .formation-grid { display: grid; grid-template-columns: 60px 1fr 1fr 1fr; gap: 4px; font-size: 12px; margin: 6px 0; }
  .formation-grid .header { font-weight: 600; background: #ede7d9; padding: 2px 4px; text-align: center; }
  .formation-grid .row-label { font-weight: 600; padding: 4px; background: #f5efe2; text-align: center; }
  .formation-grid select { width: 100%; font-size: 11px; padding: 2px; border: 1px solid var(--border); font-family: inherit; background: #fff; }
  .formation-grid .slot { padding: 2px; }
  .formation-grid .array-row .row-label { background: var(--array); }
  .attr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .attr-table th, .attr-table td { border: 1px solid var(--border); padding: 4px 6px; text-align: center; }
  .attr-table th { background: #ede7d9; font-weight: 600; }
  .attr-table td.attr-name { text-align: left; font-weight: 600; background: #f5efe2; }
  .attr-table td.up { color: var(--ok); }
  .attr-table td.down { color: var(--warn); }
  .attr-table td.zero { color: var(--muted); }
  .attr-table td.empty { color: #ccc; }
  .attr-table td.has-detail { cursor: pointer; }
  .attr-table td.has-detail:hover { background: #f5efe2; }
  .pool-card { border:1px solid var(--border); padding:6px 8px; margin-bottom:6px; background:#fff; }
  .pool-card .head { display:flex; gap:8px; align-items:center; font-size:13px; }
  .pool-card .bar { display:inline-block; vertical-align:middle; height:8px; background:#eee; width:120px; position:relative; border:1px solid #ccc; }
  .pool-card .bar > span { display:block; height:100%; background: var(--ok); }
  .pool-card .bar.overflow > span { background: var(--warn); }
  .pool-card .status-full { color: var(--warn); font-weight:600; }
  .pool-card .status-room { color: var(--ok); font-weight:600; }
  .pool-card .pool-note { font-size:11px; color: var(--muted); }
  .pool-card .recs { font-size:12px; color:#444; margin-top:4px; }
  .pool-card .recs em { color: var(--muted); }
  .attr-list { font-size: 11px; color: var(--muted); margin-top: 2px; display: none; text-align: left; }
  .attr-table td.expanded .attr-list { display: block; }
</style>
</head>

<script>
'use strict';

// JS エラーを画面に表示するためのフォールバック
window.addEventListener('error', (e) => {
  const banner = document.getElementById('loading-banner');
  if (banner) {
    banner.style.display = '';
    banner.innerHTML = `<strong>JSエラー:</strong> ${e.message}<br><code style="font-size:11px;">${(e.error && e.error.stack) || ''}</code>`;
  }
});

// ============================================================
// 状態管理
// ============================================================
const STORAGE_KEY = 'sangoku_sim_v06';   // 4ユーザー化のため鍵を変更
const SLOT_KEYS = ['統率', '武力', '知性'];
const MAIN_TROOPS = ['歩兵', '騎兵', '弓兵'];   // 主陣の兵種は3種のみ（万能はワイルドカード扱い）
const DEFAULT_NUM_USERS = 4;  // 初回起動時の規定プレイヤー数
const NUM_LEGIONS = 8;        // 最大4人×2軍団 = 8軍団

// Launch preview などのサンドボックス環境では window.prompt / confirm が
// 利用できないため、DOMベースの簡易モーダルで代替する。
// Enter で確定 / Escape または背景クリックでキャンセル。
function openModal({ message, defaultValue, withInput, okLabel, cancelLabel, alertOnly }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;padding:16px 18px;border-radius:6px;min-width:280px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,0.2);font-family:inherit;';
    const msg = document.createElement('div');
    msg.style.cssText = 'white-space:pre-wrap;margin-bottom:12px;font-size:13px;line-height:1.5;';
    msg.textContent = message;
    box.appendChild(msg);
    let input = null;
    if (withInput) {
      input = document.createElement('input');
      input.type = 'text';
      input.value = defaultValue ?? '';
      input.style.cssText = 'width:100%;padding:6px 8px;font-size:14px;font-family:inherit;border:1px solid #bbb;border-radius:4px;box-sizing:border-box;margin-bottom:12px;';
      box.appendChild(input);
    }
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.textContent = cancelLabel || 'キャンセル';
    cancel.style.cssText = 'padding:4px 12px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer;font-family:inherit;';
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.textContent = okLabel || 'OK';
    ok.style.cssText = 'padding:4px 12px;border:1px solid var(--accent,#1976d2);background:var(--accent,#1976d2);color:#fff;border-radius:4px;cursor:pointer;font-family:inherit;';
    if (!alertOnly) row.appendChild(cancel);
    row.appendChild(ok);
    box.appendChild(row);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const close = (v) => { document.body.removeChild(overlay); resolve(v); };
    cancel.addEventListener('click', () => close(withInput ? null : false));
    ok.addEventListener('click', () => close(withInput ? (input.value ?? '') : true));
    overlay.addEventListener('click', e => { if (e.target === overlay) close(withInput ? null : false); });
    if (input) {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); close(input.value ?? ''); }
        else if (e.key === 'Escape') { e.preventDefault(); close(null); }
      });
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      setTimeout(() => ok.focus(), 0);
    }
  });
}
function askText(message, defaultValue = '') {
  return openModal({ message, defaultValue, withInput: true });
}
function askConfirm(message) {
  return openModal({ message, withInput: false });
}
function notify(message) {
  return openModal({ message, withInput: false, alertOnly: true });
}

function emptyBattalion() { return { 統率: null, 武力: null, 知性: null }; }
function defaultUsers() {
  return Array.from({ length: DEFAULT_NUM_USERS }, (_, i) => ({ id: i + 1, name: `プレイヤー${i + 1}` }));
}
// ユニークな新規ユーザーIDを生成
function nextUserId() {
  return state.users.reduce((m, u) => Math.max(m, u.id), 0) + 1;
}
function emptyFormation(userId = 1) {
  return {
    user_id: userId,
    selected: true,
    troop_type: null,
    battalions: [emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion()],
    array: emptyBattalion(),
    auto: { pri1: '', pri2: '' },
  };
}
function defaultFormations() {
  // 軍団1〜8 は plr1×2, plr2×2, plr3×2, plr4×2 をデフォルト割り当て
  return Array.from({ length: NUM_LEGIONS }, (_, i) => emptyFormation(Math.floor(i / 2) + 1));
}

function canPlaceInTroop(general, troop) {
  if (!troop) return true;
  if (general.troop_type === troop) return true;
  if (general.troop_type === '万能') return true;
  return false;
}

const state = {
  data: null,
  users: defaultUsers(),
  ownerships: { 1: {}, 2: {}, 3: {}, 4: {} },  // userId -> { genId -> ownEntry }（動的に増減）
  activeUserId: 1,
  filters: { troop: '', rarity: '', search: '', ownedOnly: false },
  formations: defaultFormations(),
  // 第一優先・第二優先は集結全体で共有（全軍団で1セット）
  priority: { pri1: '', pri2: '' },
  aggMode: 'formation',
};

// 指定IDのプレイヤーを削除（所持データ／関連軍団もクリーンアップ）
function deleteUser(userId) {
  if (state.users.length <= 1) {
    notify('最後の1人は削除できません');
    return;
  }
  state.users = state.users.filter(u => u.id !== userId);
  delete state.ownerships[userId];
  // このユーザーに割り当たっていた軍団は、残ったユーザー先頭に再割当＋配置クリア
  const fallback = state.users[0].id;
  state.formations.forEach((f, idx) => {
    if (f.user_id === userId) {
      state.formations[idx] = emptyFormation(fallback);
    }
  });
  if (state.activeUserId === userId) state.activeUserId = fallback;
}

// プレイヤー追加
function addUser(name) {
  const id = nextUserId();
  state.users.push({ id, name: name || `プレイヤー${id}` });
  state.ownerships[id] = {};
  return id;
}

function loadState() {
  try {
    const v6 = localStorage.getItem(STORAGE_KEY);
    const v5 = localStorage.getItem('sangoku_sim_v05');
    const v4 = localStorage.getItem('sangoku_sim_v04');
    const raw = v6 || v5 || v4;
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.filters) Object.assign(state.filters, s.filters);
    if (s.aggMode) state.aggMode = s.aggMode;

    // users（可変人数対応）
    if (Array.isArray(s.users) && s.users.length >= 1) {
      state.users = s.users.map((u, i) => ({ id: u.id ?? (i + 1), name: u.name || `プレイヤー${i + 1}` }));
    }
    if (s.activeUserId) state.activeUserId = s.activeUserId;

    // ownerships（v6: 動的キー / v5以前: 単一）
    state.ownerships = {};
    if (s.ownerships && typeof s.ownerships === 'object') {
      for (const u of state.users) {
        state.ownerships[u.id] = s.ownerships[u.id] || s.ownerships[String(u.id)] || {};
      }
    } else if (s.ownership) {
      // 旧データはプレイヤー1へ移行
      state.ownerships[1] = s.ownership;
    }
    // 不足キーを補完
    for (const u of state.users) {
      if (!state.ownerships[u.id]) state.ownerships[u.id] = {};
    }
    // activeUserId が消えたユーザーを指していたら先頭に戻す
    if (!state.users.find(u => u.id === state.activeUserId)) {
      state.activeUserId = state.users[0].id;
    }

    // formations: v6=8軍団 / v5=3軍団（プレイヤー1扱い） / v4=単一（プレイヤー1の軍団1扱い）
    const normFormation = (f, userId = 1) => ({
      user_id: f.user_id ?? userId,
      selected: f.selected !== false,
      troop_type: f.troop_type ?? null,
      battalions: (f.battalions && f.battalions.length === 5) ? f.battalions : [emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion()],
      array: f.array || emptyBattalion(),
      auto: f.auto || { pri1: '', pri2: '' },
    });
    if (Array.isArray(s.formations) && s.formations.length === NUM_LEGIONS) {
      state.formations = s.formations.map(f => normFormation(f));
    } else if (Array.isArray(s.formations)) {
      // 旧3軍団 → 軍団1〜3 へ移行、残り5軍団は新規
      const old = s.formations.map(f => normFormation(f, 1));
      state.formations = defaultFormations();
      old.forEach((f, i) => { if (i < NUM_LEGIONS) state.formations[i] = f; });
    } else if (s.formation && Array.isArray(s.formation.battalions) && s.formation.battalions.length === 5) {
      state.formations[0] = normFormation(s.formation, 1);
    }

    // 第一/第二優先は集結全体で1セットに変更（v06後期）
    // 既存データが無い場合は、各軍団の f.auto から最初の非空ペアを採用
    if (s.priority && typeof s.priority === 'object') {
      state.priority = {
        pri1: s.priority.pri1 || '',
        pri2: s.priority.pri2 || '',
      };
    } else {
      const seed = state.formations.find(f => f.auto && (f.auto.pri1 || f.auto.pri2));
      if (seed) {
        state.priority = { pri1: seed.auto.pri1 || '', pri2: seed.auto.pri2 || '' };
      }
    }
  } catch (e) { console.warn('localStorage load failed', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users: state.users,
      ownerships: state.ownerships,
      activeUserId: state.activeUserId,
      filters: state.filters,
      formations: state.formations,
      priority: state.priority,
      aggMode: state.aggMode,
    }));
  } catch (e) { console.warn('localStorage save failed', e); }
}

// 指定ユーザーの武将所持エントリを取得（初期化込み）
function getOwn(userId, genId) {
  // 旧コール署名 getOwn(genId) との後方互換: 第二引数が省略されたら activeUserId 扱い
  if (genId === undefined) { genId = userId; userId = state.activeUserId; }
  if (!state.ownerships[userId]) state.ownerships[userId] = {};
  if (!state.ownerships[userId][genId]) {
    state.ownerships[userId][genId] = { owned: false, breakthrough: 0, equipment: 0, level_break: false, seal: 0 };
  }
  return state.ownerships[userId][genId];
}
// その軍団 (formation) の所属ユーザーで武将所持を取得
function getOwnByFormation(formation, genId) {
  return getOwn(formation.user_id, genId);
}

// ============================================================
// 戦闘貢献の判定（編成候補フィルタ）
// ============================================================
// 戦闘系語彙（effect 文中に1つでも含まれれば戦闘貢献ありとみなす）
// xlsx 由来の略記（ダメ・実ダメ・抑制 等）も含める
const COMBAT_KEYWORDS = [
  '攻撃', '防御', '連撃', '抵抗', '貫通', 'シールド', '軍紀',
  'ダメージ', 'ダメ', '実ダメ', '抑制', '反射',
  '兵力', '兵士', '兵', '率兵', '殺害', '損失', '参戦', '行軍速度', '速度',
  '支援', 'スキル', '属性', '増益', '減益', '副将', '集結', '陣',
];
// 非戦闘系（戦闘外の用途のみ）の典型語彙: 派遣収益/内政/採集/建設/探索
const NON_COMBAT_KEYWORDS = ['派遣収益', '内政', '採集', '建設', '探索', '研究'];
// スキルが戦闘系か（effect 文判別。name は見ない）
function isCombatSkill(sk) {
  const eff = (sk && sk.effect) || '';
  if (!eff) return false;
  // 「派遣不要」自体は単なる発動条件ラベルなので戦闘判定に使わない
  return COMBAT_KEYWORDS.some(kw => eff.includes(kw));
}
// 武将に1つでも戦闘系スキルがあるか
function hasCombatSkill(g) {
  return (g.skills || []).some(isCombatSkill);
}

// ============================================================
// スキル解決ロジック
// ============================================================
// 単一スキルの実効値を計算（突破段・装備段に応じる）
function resolveSkillValue(skill, own) {
  // 突破段で未解放？
  if ((skill.unlocked_at ?? 0) > own.breakthrough) return null;
  // 装備段で未解放？
  if (skill.unlocked_at_equipment != null && skill.unlocked_at_equipment > own.equipment) return null;

  const v = skill.value || {};
  const bt = (v.by_breakthrough || [])[own.breakthrough];
  const eq = (v.by_equipment || [])[own.equipment];
  if (bt == null) return null;  // 未登録段
  let total = bt;
  if (typeof eq === 'number') total += eq;
  return total;
}

// 編成内の (userId, genId) 配置エントリを返す
function formationPlacements() {
  const out = [];
  for (const f of state.formations) {
    for (const bat of f.battalions) {
      for (const k of SLOT_KEYS) if (bat[k]) out.push({ userId: f.user_id, genId: bat[k] });
    }
    for (const k of SLOT_KEYS) if (f.array[k]) out.push({ userId: f.user_id, genId: f.array[k] });
  }
  return out;
}

// 編成全体の効果集計（4プレイヤー×8軍団）
function aggregate() {
  if (!state.data) return {};
  const buckets = { legion: {}, rally: {}, array: {}, self: {} };
  const issues = [];
  const breakdown = [];

  // 評価対象の (general, own) ペアを集める
  const targets = [];  // { g, own, userName }
  const userById = Object.fromEntries(state.users.map(u => [u.id, u]));
  if (state.aggMode === 'formation') {
    for (const p of formationPlacements()) {
      const g = state.data.generals.find(x => x.id === p.genId);
      if (!g) continue;
      const own = getOwn(p.userId, p.genId);
      targets.push({ g, own, userName: userById[p.userId]?.name || '' });
    }
  } else {
    // 'owned-all': アクティブユーザーの所持武将のみ
    const uid = state.activeUserId;
    for (const g of state.data.generals) {
      const own = getOwn(uid, g.id);
      if (!own.owned) continue;
      targets.push({ g, own, userName: userById[uid]?.name || '' });
    }
  }

  for (const { g, own, userName } of targets) {
    for (const sk of g.skills) {
      const eff = resolveSkillValue(sk, own);
      const entry = {
        general: userName ? `${userName}・${g.name}` : g.name,
        skill: sk.name,
        scope: sk.scope,
        unit: sk.unit,
        value: eff,
        cap: sk.cap || null,
        stacking: sk.stacking || 'additive',
        confidence: (sk.value && sk.value.confidence) || 'unknown',
        unlocked_at: sk.unlocked_at,
        unlocked_at_equipment: sk.unlocked_at_equipment,
        attribute: sk.effect_attribute || 'その他',
        direction: sk.direction || null,
      };
      breakdown.push(entry);

      if (eff == null) {
        // 値未登録 or 未解放
        if ((sk.unlocked_at ?? 0) > own.breakthrough) {
          // 未解放: 計算に含めない
        } else {
          issues.push(`${g.name}/${sk.name}: 段階別実数が未登録（要ゲーム内確認）`);
        }
        continue;
      }

      // scope毎に振り分け、cap_ruleキーでグループ集計
      const scope = sk.scope || 'self';
      if (!buckets[scope]) buckets[scope] = {};
      const ruleKey = (sk.cap && sk.cap.rule) || 'no_cap_implicit';
      const groupKey = (sk.cap && sk.cap.shared) ? ruleKey + '#shared' : `${g.id}/${sk.name}#${ruleKey}`;
      // shared: 同じrule (共有) → 同じ bucket key で合算
      // 非shared: 個別bucket
      if (!buckets[scope][ruleKey]) buckets[scope][ruleKey] = [];
      buckets[scope][ruleKey].push(entry);
    }
  }

  // cap適用
  const aggregated = {};
  for (const scope of Object.keys(buckets)) {
    aggregated[scope] = [];
    for (const ruleKey of Object.keys(buckets[scope])) {
      const items = buckets[scope][ruleKey];
      if (!items.length) continue;
      // 累加不可スキル: 最大値のみ採用
      const additive = items.filter(i => i.stacking !== 'non_stackable');
      const nonStack = items.filter(i => i.stacking === 'non_stackable');
      let sum = additive.reduce((s, i) => s + (i.value || 0), 0);
      if (nonStack.length) {
        // 同じ rule の non_stackable は max
        const maxVal = Math.max(...nonStack.map(i => Math.abs(i.value || 0))) * (nonStack[0].value < 0 ? -1 : 1);
        sum += maxVal;
      }
      // capRule をデータから取得
      const ruleDef = state.data.meta.cap_rules[ruleKey];
      let capValue = null;
      let isShared = false;
      if (ruleDef) {
        capValue = ruleDef.cap_value;
        isShared = !!ruleDef.shared;
      }
      // 個別スキルが cap.cap_value を上書き指定している場合も考慮
      // (簡易: 最初のitemの cap.cap_value を見る)
      if (items[0].cap && items[0].cap.cap_value != null) capValue = items[0].cap.cap_value;

      let capped = sum;
      let overflow = false;
      if (capValue != null) {
        if (capValue > 0 && sum > capValue) { capped = capValue; overflow = true; }
        if (capValue < 0 && sum < capValue) { capped = capValue; overflow = true; }
      }
      aggregated[scope].push({
        ruleKey, items, sum, capped, capValue, overflow,
        ruleNote: ruleDef ? ruleDef.note : null,
        isShared,
      });
    }
  }
  return { aggregated, issues, breakdown };
}

  add.textContent = '＋ プレイヤー追加';
  add.addEventListener('click', async () => {

      <div style="font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:8px;">${url}</div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">

  document.getElementById('btn-export-user').addEventListener('click', async () => {
    if (!state.users.length) {
      notify('登録されているプレイヤーがいません。');
      return;
    }
    // 選択モーダルを動的に組み立て
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;';
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--paper);border:1px solid var(--border);padding:14px;min-width:280px;max-width:90%;max-height:80%;overflow:auto;';
    box.innerHTML = '<div style="font-weight:600;margin-bottom:8px;">エクスポートするプレイヤーを選択</div>';
    const listDiv = document.createElement('div');
    listDiv.style.cssText = 'display:flex;flex-direction:column;gap:4px;margin-bottom:8px;';
    state.users.forEach(u => {
      const lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid var(--border);cursor:pointer;';
      lbl.innerHTML = `<input type="checkbox" data-uid="${u.id}" checked> <span>${u.name}</span>`;
      listDiv.appendChild(lbl);
    });
    box.appendChild(listDiv);
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:6px;justify-content:flex-end;';
    btnRow.innerHTML = '<button id="btn-export-all">全選択</button><button id="btn-export-none">全解除</button><button id="btn-export-ok" style="background:var(--accent);color:#fff;">エクスポート</button><button id="btn-export-cancel">キャンセル</button>';
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const cleanup = () => document.body.removeChild(overlay);
    box.querySelector('#btn-export-all').onclick = () => listDiv.querySelectorAll('input').forEach(i => i.checked = true);
    box.querySelector('#btn-export-none').onclick = () => listDiv.querySelectorAll('input').forEach(i => i.checked = false);
    box.querySelector('#btn-export-cancel').onclick = cleanup;
    box.querySelector('#btn-export-ok').onclick = () => {
      const selectedIds = Array.from(listDiv.querySelectorAll('input:checked')).map(i => parseInt(i.dataset.uid, 10));
      if (!selectedIds.length) { notify('1名以上選択してください。'); return; }
      const ts = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}`;
      for (const uid of selectedIds) {
        const user = state.users.find(u => u.id === uid);
        if (!user) continue;
        const payload = {
          schema: 'sangoku_user_v1',
          exported_at: new Date().toISOString(),
          user_name: user.name,
          data_version: state.data.meta.data_version,
          ownerships: state.ownerships[uid] || {},
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const safeName = user.name.replace(/[^\p{L}\p{N}_-]/gu, '_');
        const fname = `sangoku_user_${safeName}_${dateStr}.json`;
        const a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      cleanup();
      notify(`${selectedIds.length}名分をエクスポートしました。`);
    };
  });

  // ユーザーをインポート: sangoku_user_v1 を読んでプレイヤー追加（複数ファイル可、同名上書き確認）
  const addUserInput = document.getElementById('file-add-user-json');
  document.getElementById('btn-add-user-json').addEventListener('click', () => {
    addUserInput.value = '';
    addUserInput.click();
  });
  addUserInput.addEventListener('change', async () => {
    const files = Array.from(addUserInput.files || []);
    if (!files.length) return;
    const added = [];
    const overwritten = [];
    const skipped = [];
    for (const f of files) {
      try {
        const text = await f.text();
        const obj = JSON.parse(text);
        if (obj.schema !== 'sangoku_user_v1') {
          skipped.push(`${f.name}: 未対応形式 (schema=${obj.schema || 'なし'})`);
          continue;
        }
        const name = (obj.user_name || f.name.replace(/\.json$/i, '')).trim() || '名無し';
        // 同名ユーザーがいたら上書き確認
        const existing = state.users.find(u => u.name === name);
        if (existing) {
          const ok = await askConfirm(`「${name}」は既に登録済みです。\n所持データを上書きしますか？\n\n[OK]=上書き / [キャンセル]=スキップ`);
          if (!ok) { skipped.push(`${name}: 上書きキャンセル`); continue; }
          state.ownerships[existing.id] = obj.ownerships || {};
          overwritten.push(name);
        } else {
          const newId = Math.max(0, ...state.users.map(u => u.id)) + 1;
          state.users.push({ id: newId, name });
          state.ownerships[newId] = obj.ownerships || {};
          added.push(name);
        }
      } catch (e) {
        skipped.push(`${f.name}: ${e.message}`);
      }
    }
    saveState();
    renderUserTabs();
    renderRoster();
    renderFormation();
    renderSummary();
    const lines = [];
    if (added.length) lines.push(`新規追加: ${added.length}名 (${added.join(', ')})`);
    if (overwritten.length) lines.push(`上書き: ${overwritten.length}名 (${overwritten.join(', ')})`);
    if (skipped.length) lines.push(`スキップ: ${skipped.length}件\n  ・${skipped.join('\n  ・')}`);
    notify(lines.length ? lines.join('\n') : '処理対象なし');
  });

  // 集計モード切替
  document.querySelectorAll('input[name="agg-mode"]').forEach(r => {
    if (r.value === state.aggMode) r.checked = true;
    r.addEventListener('change', () => {
      if (r.checked) {
        state.aggMode = r.value;
        saveState();
        renderSummary();
      }
    });
  });

  // 一括チェックボックス
  const bulkBindings = [
    {
      id: 'bulk-owned',
      apply: (own, on, g) => {
        own.owned = on;
        // 所持解除時はそのプレイヤー所属の軍団から外す
        if (!on) {
          for (const f of state.formations) {
            if (f.user_id !== state.activeUserId) continue;
            for (const bat of f.battalions) {
              for (const k of SLOT_KEYS) if (bat[k] === g.id) bat[k] = null;
            }
            for (const k of SLOT_KEYS) if (f.array[k] === g.id) f.array[k] = null;
          }
        }
      },
    },
    { id: 'bulk-bt3',          apply: (own, on) => { own.breakthrough = on ? 3 : (own.breakthrough === 3 ? 0 : own.breakthrough); } },
    { id: 'bulk-bt4',          apply: (own, on) => { own.breakthrough = on ? 4 : (own.breakthrough === 4 ? 0 : own.breakthrough); } },
    { id: 'bulk-equipment',    apply: (own, on) => { own.equipment    = on ? 4 : 0; } },
  ];
  for (const b of bulkBindings) {
    const cb = document.getElementById(b.id);
    if (!cb) continue;
    cb.addEventListener('change', () => {
      const on = cb.checked;
      const filtered = filteredGenerals();
      for (const g of filtered) {
        const own = getOwn(g.id);
        b.apply(own, on, g);
      }
      saveState();
      renderRoster();
      renderFormation();
      renderSummary();
    });
  }

  // 選択中の軍団をまとめて自動編成
  document.getElementById('btn-auto-build-all').addEventListener('click', async () => {
    const targets = state.formations
      .map((f, idx) => ({ f, idx }))
      .filter(({ f }) => f.selected);
    if (!targets.length) {
      notify('チェックを入れた軍団がありません');
      return;
    }
    // 第一/第二優先は集結全体で共有 → どちらか1つでも未指定なら全体停止
    if (!state.priority.pri1 && !state.priority.pri2) {
      notify('第一優先または第二優先を指定してください（集結全体共通）');
      return;
    }
    // 兵種未指定の軍団チェック（兵種は軍団ごとに残す）
    const missing = targets.filter(({ f }) => !f.troop_type);
    if (missing.length) {
      const names = missing.map(({ idx }) => `軍団${idx + 1}`).join('、');
      if (!await askConfirm(`${names} は兵種が未指定です。\nスキップして他軍団のみ編成しますか？`)) return;
    }
    // 対象軍団を順番に編成（pool は runAutoBuilderFor 内で他軍団から自動集計）
    for (const { idx, f } of targets) {
      if (!f.troop_type) continue;
      runAutoBuilderFor(idx);
    }
  });

  // 編成クリア（全軍団）
  document.getElementById('btn-clear-formation').addEventListener('click', async () => {
    if (!await askConfirm(`全${NUM_LEGIONS}軍団の編成をクリアします。よろしいですか？`)) return;
    state.formations = state.formations.map(f => emptyFormation(f.user_id));
    saveState();
    renderFormation();
    renderSummary();
  });
}

// 自動編成ビルダー
// ============================================================
// CORE_ATTRS は下で定義されている定数を参照するため、関数化して遅延評価する
function buildPriorityOptions() {
  const out = [{ value: '', label: '— なし —' }];
  for (const a of CORE_ATTRS) {
    out.push({ value: `${a}/up`,   label: `${a} up`   });
    out.push({ value: `${a}/down`, label: `${a} down` });
  }
  return out;
}

// 旧 initAutoBuilder は撤去。auto-builder は renderFormation 内で軍団ごとに描画する。

// スキルの cap 情報を取得
function getCapInfo(sk) {
  const ruleKey = (sk.cap && sk.cap.rule) || null;
  const isShared = !!(sk.cap && sk.cap.shared);
  const ruleDef = ruleKey && state.data ? state.data.meta.cap_rules[ruleKey] : null;
  let capValue = null;
  if (sk.cap && sk.cap.cap_value != null) capValue = sk.cap.cap_value;
  else if (ruleDef && ruleDef.cap_value != null) capValue = ruleDef.cap_value;
  // shared プールキー（個別の場合は null → 都度独立判定）
  const scope = sk.scope || 'self';
  const bucketKey = isShared && ruleKey ? `${scope}#${ruleKey}#shared` : null;
  return { ruleKey, isShared, capValue, scope, bucketKey };
}

// 与えられた pool 状態のもとで、この武将を編成に加えたときの限界貢献スコアを計算
// pool は { bucketKey: 現在の合計 } のマップ。返す newPool は更新版。
function marginalContribution(g, pri1, pri2, pool, userId) {
  const own = getOwn(userId != null ? userId : state.activeUserId, g.id);
  let s1 = 0, s2 = 0;
  const newPool = { ...pool };
  for (const sk of (g.skills || [])) {
    const eff = resolveSkillValue(sk, own);
    if (eff == null) continue;
    const key = `${sk.effect_attribute}/${sk.direction}`;
    const matchP1 = pri1 && key === pri1;
    const matchP2 = pri2 && key === pri2;
    if (!matchP1 && !matchP2) continue;
    const info = getCapInfo(sk);
    let marginal = eff;
    if (info.bucketKey && info.capValue != null) {
      // 共有プール: 現在合計を見て cap 超過分はカット
      const before = newPool[info.bucketKey] || 0;
      let after;
      if (info.capValue > 0) {
        after = (before >= info.capValue) ? before : Math.min(before + eff, info.capValue);
      } else {
        after = (before <= info.capValue) ? before : Math.max(before + eff, info.capValue);
      }
      marginal = after - before;
      newPool[info.bucketKey] = after;
    } else if (info.capValue != null) {
      // 個別 cap: このスキル単独で cap 超過分カット
      if (info.capValue > 0) marginal = Math.min(eff, info.capValue);
      else marginal = Math.max(eff, info.capValue);
    }
    const absM = Math.abs(marginal);
    if (matchP1) s1 += absM;
    if (matchP2) s2 += absM;
  }
  return { score: s1 * 2 + s2, newPool };
}

function runAutoBuilderFor(legionIdx) {
  const f = state.formations[legionIdx];
  const userId = f.user_id;
  const troop = f.troop_type;
  // 第一/第二優先は集結全体で共有
  const pri1 = state.priority.pri1;
  const pri2 = state.priority.pri2;
  if (!pri1 && !pri2) {
    notify('第一優先または第二優先を指定してください');
    return;
  }
  if (!troop) {
    notify('兵種を指定してください');
    return;
  }

  // 同じユーザーの他軍団で使用中の武将を除外
  const usedByOtherSameUser = new Set();
  state.formations.forEach((other, idx) => {
    if (idx === legionIdx) return;
    if (other.user_id !== userId) return;
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) usedByOtherSameUser.add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) usedByOtherSameUser.add(other.array[k]);
  });

  const ownedGens = state.data.generals.filter(g =>
    getOwn(userId, g.id).owned &&
    !usedByOtherSameUser.has(g.id) &&
    hasCombatSkill(g)  // 戦闘系スキルが無い武将は編成候補から除外
  );

  // この軍団をクリア（他軍団は触らない）
  state.formations[legionIdx] = {
    user_id: userId,
    selected: f.selected,
    troop_type: troop,
    battalions: [emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion()],
    array: emptyBattalion(),
    auto: { pri1, pri2 },
  };
  const fNew = state.formations[legionIdx];
  const used = new Set();
  let pool = {};

  // 全軍団（他ユーザー含む）に既に置かれた武将のスキルから集結 cap プール初期値を計算
  for (const other of state.formations) {
    if (other === fNew) continue;
    const placed = new Set();
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) placed.add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) placed.add(other.array[k]);
    for (const gid of placed) {
      const g = state.data.generals.find(x => x.id === gid);
      if (!g) continue;
      const own = getOwn(other.user_id, g.id);
      for (const sk of (g.skills || [])) {
        const eff = resolveSkillValue(sk, own);
        if (eff == null) continue;
        const info = getCapInfo(sk);
        if (info.bucketKey) pool[info.bucketKey] = (pool[info.bucketKey] || 0) + eff;
      }
    }
  }

  function slotMatch(g, slot) {
    const ss = g.slot_stat;
    if (ss == null) return true;
    if (Array.isArray(ss)) return ss.includes(slot);
    return ss === slot;
  }

  function pickBest(candidateFilter) {
    let best = null;
    for (const g of ownedGens) {
      if (used.has(g.id)) continue;
      if (!candidateFilter(g)) continue;
      const { score, newPool } = marginalContribution(g, pri1, pri2, pool, userId);
      if (best === null || score > best.score) {
        best = { g, score, newPool };
      }
    }
    return best;
  }

  for (let bi = 0; bi < 5; bi++) {
    const bat = fNew.battalions[bi];
    for (const slot of SLOT_KEYS) {
      const best = pickBest(g => canPlaceInTroop(g, troop) && slotMatch(g, slot));
      if (best) {
        bat[slot] = best.g.id;
        used.add(best.g.id);
        pool = best.newPool;
      }
    }
  }
  for (const slot of SLOT_KEYS) {
    let best = pickBest(g => g.troop_type === '戦車' && slotMatch(g, slot));
    if (!best) best = pickBest(g => slotMatch(g, slot));
    if (best) {
      fNew.array[slot] = best.g.id;
      used.add(best.g.id);
      pool = best.newPool;
    }
  }

  saveState();
  renderFormation();
  renderSummary();
}

function renderFormation() {
  const container = document.getElementById('formation');
  container.innerHTML = '';

  state.formations.forEach((f, li) => {
    const panel = document.createElement('details');
    panel.open = true;
    panel.style.cssText = 'border:1px solid var(--border);margin-bottom:10px;padding:6px 8px;background:#fcfaf3;';
    const summary = document.createElement('summary');
    summary.style.cssText = 'font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    const t = f.troop_type;
    const badge = t ? `<span class="badge b-troop b-troop-${t}">${t}</span>` : `<span style="color:var(--muted);font-weight:normal;">兵種未指定</span>`;
    const userOpts = state.users.map(u =>
      `<option value="${u.id}" ${u.id === f.user_id ? 'selected' : ''}>${u.name}</option>`
    ).join('');
    summary.innerHTML = `
      <input type="checkbox" data-legion="${li}" data-ab="select" ${f.selected ? 'checked' : ''} title="一括自動編成の対象にする">
      <span>軍団${li + 1}</span>
      <select data-legion="${li}" data-ab="user" title="プレイヤー" style="font-size:12px;">${userOpts}</select>
      ${badge}
    `;
    panel.appendChild(summary);
    // 子要素のクリックで折りたたみが切り替わらないように
    const cb = summary.querySelector('input[type="checkbox"]');
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', (e) => {
      f.selected = e.target.checked;
      saveState();

    });
    const userSel = summary.querySelector('select[data-ab="user"]');
    userSel.addEventListener('click', (e) => e.stopPropagation());

      const newUid = parseInt(e.target.value, 10);
      // ユーザー変更時はこの軍団の配置をクリア（別ユーザーの所持武将は使えない）

      f.battalions = [emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion()];

      renderFormation();

    ctrl.innerHTML = `
      <strong>自動編成設定:</strong>
      <label>兵種<select data-legion="${li}" data-ab="troop"></select></label>
      <button data-legion="${li}" data-ab="clear">この軍団をクリア</button>
    `;
    panel.appendChild(ctrl);
    // selectsを埋める
    const troopSel = ctrl.querySelector('select[data-ab="troop"]');
    troopSel.innerHTML = '<option value="">— 兵種未指定 —</option>' + MAIN_TROOPS.map(t => `<option value="${t}">${t}</option>`).join('');
    if (f.troop_type) troopSel.value = f.troop_type;
    troopSel.addEventListener('change', () => {
      f.troop_type = troopSel.value || null;
      saveState(); renderFormation(); renderSummary();
    });
    ctrl.querySelector('button[data-ab="clear"]').addEventListener('click', async () => {
      if (!await askConfirm(`軍団${li + 1} をクリアします`)) return;
      const keepUid = state.formations[li].user_id;
      state.formations[li] = emptyFormation(keepUid);
      saveState(); renderFormation(); renderSummary();
    });

    // 主陣
    const mainGrid = document.createElement('div');
    mainGrid.className = 'formation-grid';
    mainGrid.appendChild(makeHeaderCell(''));
    for (const s of SLOT_KEYS) mainGrid.appendChild(makeHeaderCell(s));
    f.battalions.forEach((bat, idx) => {
      const lab = document.createElement('div');
      lab.className = 'row-label';
      lab.textContent = `部隊${idx + 1}`;
      mainGrid.appendChild(lab);
      for (const slot of SLOT_KEYS) {
        mainGrid.appendChild(makeSlotCell(bat, slot, { isArray: false, legionIdx: li }));
      }

    panel.appendChild(mainGrid);

    // 角陣
    const arrayGrid = document.createElement('div');
    arrayGrid.className = 'formation-grid array-row';
    arrayGrid.appendChild(makeHeaderCell(''));
    for (const s of SLOT_KEYS) arrayGrid.appendChild(makeHeaderCell(s));
    const arrLab = document.createElement('div');
    arrLab.className = 'row-label';
    arrLab.textContent = '角陣';
    arrLab.title = '戦車優先・他兵種も可';
    arrayGrid.appendChild(arrLab);

    container.appendChild(panel);
  });
}

function makeHeaderCell(text) {
  const div = document.createElement('div');
  div.className = 'header';
  div.textContent = text;
  return div;
}

function makeSlotCell(bat, slot, opts) {
  const wrap = document.createElement('div');
  wrap.className = 'slot';
  const sel = document.createElement('select');
  const optEmpty = document.createElement('option');
  optEmpty.value = ''; optEmpty.textContent = '— 空 —';
  sel.appendChild(optEmpty);

  const legionIdx = opts.legionIdx;
  const formation = (legionIdx != null) ? state.formations[legionIdx] : null;
  const userId = formation ? formation.user_id : state.activeUserId;

  // 同じユーザーの他軍団スロットで使用中の武将を除外
  const usedElsewhere = new Set();
  for (const f of state.formations) {
    if (f.user_id !== userId) continue;
    for (const b of f.battalions) {
      for (const k of SLOT_KEYS) {
        if (!b[k]) continue;
        if (b === bat && k === slot) continue;
        usedElsewhere.add(b[k]);
      }
    }
    for (const k of SLOT_KEYS) {
      if (!f.array[k]) continue;
      if (f.array === bat && k === slot) continue;
      usedElsewhere.add(f.array[k]);
    }
  }

  const legionTroop = formation ? formation.troop_type : null;

  const candidates = state.data.generals.filter(g => {
    const own = getOwn(userId, g.id);
    if (!own.owned) return false;
    if (usedElsewhere.has(g.id)) return false;
    if (!hasCombatSkill(g)) return false;  // 戦闘貢献なしは候補に出さない
    if (!opts.isArray) {
      if (!canPlaceInTroop(g, legionTroop)) return false;
    }
    const ss = g.slot_stat;
    if (ss == null) return true;
    if (Array.isArray(ss)) return ss.includes(slot);
    return ss === slot;
  });
  for (const g of candidates) {
    const o = document.createElement('option');
    o.value = g.id;
    o.textContent = `${g.name} (${g.troop_type}/${g.base_rarity})`;
    if (bat[slot] === g.id) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    bat[slot] = sel.value || null;
    saveState();
    renderFormation();  // 他軍団のドロップダウンも更新
    renderSummary();
  });
  wrap.appendChild(sel);
  return wrap;
}

function filteredGenerals() {
  return state.data.generals.filter(g => {
    if (state.filters.troop && g.troop_type !== state.filters.troop) return false;
    if (state.filters.rarity && g.base_rarity !== state.filters.rarity) return false;
    if (state.filters.search && !g.name.includes(state.filters.search) && !(g.yomi || '').includes(state.filters.search)) return false;
    if (state.filters.ownedOnly && !getOwn(g.id).owned) return false;
    return true;
  });
}

function updateBulkCheckboxes() {
  const filtered = filteredGenerals();
  if (!filtered.length) return;
  const axes = [
    { id: 'bulk-owned',         pick: o => o.owned },
    { id: 'bulk-bt3',           pick: o => o.breakthrough === 3 },
    { id: 'bulk-bt4',           pick: o => o.breakthrough === 4 },
    { id: 'bulk-equipment',     pick: o => o.equipment === 4 },
  ];
  for (const a of axes) {
    const cb = document.getElementById(a.id);
    if (!cb) continue;
    const states = filtered.map(g => a.pick(getOwn(g.id)));
    const allOn = states.every(Boolean);
    const allOff = states.every(s => !s);
    cb.checked = allOn;
    cb.indeterminate = !allOn && !allOff;
  }
}

function renderRoster() {
  const tbody = document.querySelector('#roster-table tbody');
  tbody.innerHTML = '';
  const filtered = filteredGenerals();

  document.getElementById('roster-count').textContent = `(${filtered.length} / ${state.data.generals.length})`;

  for (const g of filtered) {
    const own = getOwn(g.id);
    const tr = document.createElement('tr');
    if (own.owned) tr.classList.add('owned');

    // 所持チェック
    const tdOwn = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = own.owned;
    cb.addEventListener('change', () => {
      own.owned = cb.checked;
      // 所持解除した武将を、このプレイヤー所属の軍団から外す
      if (!cb.checked) {
        for (const f of state.formations) {
          if (f.user_id !== state.activeUserId) continue;
          for (const bat of f.battalions) {
            for (const k of SLOT_KEYS) if (bat[k] === g.id) bat[k] = null;
          }
          for (const k of SLOT_KEYS) if (f.array[k] === g.id) f.array[k] = null;
        }
      }
      saveState(); renderRoster(); renderFormation(); renderSummary();
    });
    tdOwn.appendChild(cb);
    tr.appendChild(tdOwn);

    // 武将名
    const tdName = document.createElement('td');
    tdName.innerHTML = `<strong>${g.name}</strong>${g.yomi ? `<span style="color:var(--muted);font-size:11px;"> (${g.yomi})</span>` : ''}`;
    tr.appendChild(tdName);

    // 属性
    const tdAttr = document.createElement('td');
    const slotS = Array.isArray(g.slot_stat) ? g.slot_stat.join('/') : (g.slot_stat || '?');
    tdAttr.innerHTML =
      `<span class="badge b-rarity-${g.base_rarity}">${g.base_rarity}</span>` +
      `<span class="badge b-troop b-troop-${g.troop_type}">${g.troop_type}</span>` +
      `<span style="font-size:11px;color:var(--muted);">${slotS}</span>`;
    tr.appendChild(tdAttr);

    // 育成段階（突破は 3段/4段、装備は 4段、将印は数値）
    const tdProg = document.createElement('td');
    tdProg.innerHTML = `
      <span class="progression">
        <label>3突<input type="checkbox" ${own.breakthrough === 3 ? 'checked' : ''} data-id="${g.id}" data-axis="bt3"></label>
        <label>4突<input type="checkbox" ${own.breakthrough === 4 ? 'checked' : ''} data-id="${g.id}" data-axis="bt4"></label>
        <label>4装<input type="checkbox" ${own.equipment === 4 ? 'checked' : ''} data-id="${g.id}" data-axis="equipment_bool"></label>
        <label>印<input type="number" min="0" max="5" value="${own.seal}" data-id="${g.id}" data-axis="seal"></label>
      </span>
    `;
    tr.appendChild(tdProg);

    tbody.appendChild(tr);
  }

  updateBulkCheckboxes();

  // bind progression inputs
  tbody.querySelectorAll('input[data-axis]').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.id;
      const axis = inp.dataset.axis;
      const own = getOwn(id);
      if (axis === 'bt3') {
        // 突3 ON: breakthrough=3、突4の方は自動でOFF
        if (inp.checked) own.breakthrough = 3;
        else if (own.breakthrough === 3) own.breakthrough = 0;
      } else if (axis === 'bt4') {
        if (inp.checked) own.breakthrough = 4;
        else if (own.breakthrough === 4) own.breakthrough = 0;
      } else if (axis === 'equipment_bool') {
        own.equipment = inp.checked ? 4 : 0;
      } else {
        own[axis] = parseInt(inp.value, 10) || 0;
      }
      saveState();
      // 突3/突4 は排他なのでロースタ全体を再描画して相手のチェック状態を反映
      if (axis === 'bt3' || axis === 'bt4') renderRoster();
      renderSummary();
    });
  });
}

function fmtVal(v, unit) {
  if (v == null) return '—';
  if (unit === 'percent') return `${v > 0 ? '+' : ''}${v}%`;
  return `${v}`;
}

const CORE_ATTRS = ['攻撃', '防御', '連撃', '貫通', '抵抗', 'シールド', '貫通抵抗', 'ダメージ', '軍紀', '率兵', '兵士数', '抑制'];
const SCOPE_LABELS = { legion: '軍団', rally: '集結', array: '角陣', self: '自部隊' };

// 属性マトリクス集計
function aggregateByAttribute(breakdown) {
  // 戻り値: { [attr]: { [scope]: { up: [items], down: [items], both: [items] } }, その他: [items] }
  const matrix = {};
  for (const attr of [...CORE_ATTRS, 'その他']) {
    matrix[attr] = { legion: {up:[], down:[], both:[]}, rally: {up:[], down:[], both:[]}, array: {up:[], down:[], both:[]}, self: {up:[], down:[], both:[]} };
  }
  for (const b of breakdown) {
    if (b.value == null) continue;
    const attr = b.attribute || 'その他';
    const dir = b.direction || (b.value > 0 ? 'up' : (b.value < 0 ? 'down' : null));
    if (!dir) continue;
    const scope = b.scope || 'self';
    if (!matrix[attr] || !matrix[attr][scope]) continue;
    if (!matrix[attr][scope][dir]) matrix[attr][scope][dir] = [];
    matrix[attr][scope][dir].push(b);
  }
  return matrix;
}

function renderAttributeMatrix(breakdown) {
  const el = document.getElementById('attr-matrix');
  el.innerHTML = '';
  if (!breakdown.length) {
    el.innerHTML = '<em style="color:var(--muted);">集計対象の武将がありません。</em>';
    return;
  }
  const matrix = aggregateByAttribute(breakdown);

  const table = document.createElement('table');
  table.className = 'attr-table';
  const thead = document.createElement('thead');
  thead.innerHTML = `
    <tr>
      <th>属性</th>
      <th>集結</th>
      <th>軍団</th>
      <th>角陣</th>
      <th>自部隊</th>
    </tr>
  `;
  table.appendChild(thead);
  const tbody = document.createElement('tbody');

  // 各属性行: 該当属性で全スコープ effects=0 の行は非表示（B）
  for (const attr of CORE_ATTRS) {
    // 行内の全 effects を先に集約してから、ゼロ行ならスキップ
    const cells = [];
    let rowHasEffect = false;
    for (const scope of ['rally', 'legion', 'array', 'self']) {
      const ups = matrix[attr][scope].up || [];
      const downs = matrix[attr][scope].down || [];
      const both = matrix[attr][scope].both || [];
      const all = [...ups, ...downs, ...both];
      if (all.length) rowHasEffect = true;
      const sum = all.reduce((s, i) => s + (i.value || 0), 0);
      cells.push({ effective: all, sum });
    }
    if (!rowHasEffect) continue;

    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="attr-name">${attr}</td>`;
    for (const c of cells) {
      const td = document.createElement('td');
      if (c.effective.length === 0) {
        td.className = 'empty';
        td.textContent = '—';
      } else {
        td.className = (c.sum > 0 ? 'up' : (c.sum < 0 ? 'down' : 'zero')) + ' has-detail';
        const signed = (c.sum > 0 ? '+' : '') + fmtVal(c.sum, 'percent');
        const detailLines = c.effective.map(i => {
          const capParts = [];
          if (i.cap && i.cap.cap_value != null) capParts.push(`上限${i.cap.cap_value}%`);
          if (i.cap && i.cap.floor_value != null) capParts.push(`下限${i.cap.floor_value}%`);
          if (i.cap && i.cap.shared === true) capParts.push('共有');
          else if (i.cap && i.cap.shared === false) capParts.push('非共有');
          const capStr = capParts.length ? ` [${capParts.join('・')}]` : '';
          return `${i.general}/${i.skill.slice(0,16)} (${fmtVal(i.value, 'percent')})${capStr}`;
        });
        td.innerHTML = `<strong>${signed}</strong>` +
          `<div class="attr-list">${detailLines.join('<br>')}</div>`;
        td.title = 'クリックで詳細を展開/折りたたみ';
        td.addEventListener('click', () => td.classList.toggle('expanded'));
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  el.appendChild(table);

  if (!tbody.children.length) {
    el.innerHTML = '<em style="color:var(--muted);">主要属性での効果はありません。</em>';
  }

  // その他は別枠でリスト表示
  const others = [];
  for (const scope of ['rally','legion','array','self']) {
    for (const dir of ['up','down','both']) {
      for (const b of (matrix['その他'][scope][dir] || [])) others.push(b);
    }
  }
  if (others.length) {
    const ol = document.createElement('details');
    ol.style.marginTop = '8px';
    const sum = document.createElement('summary');
    sum.textContent = `その他 (${others.length}件)`;
    ol.appendChild(sum);
    for (const b of others) {
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.innerHTML = `<span class="scope-badge scope-${b.scope}">${SCOPE_LABELS[b.scope]||b.scope}</span> <strong>${b.general}/${b.skill}</strong> → ${fmtVal(b.value, b.unit)}`;
      ol.appendChild(row);
    }
    el.appendChild(ol);
  }
}

// 上限プール状況: capValue が設定された pool の現状と推奨武将を表示
function renderCapPoolStatus(aggregated) {
  const el = document.getElementById('cap-pools');
  if (!el) return;
  el.innerHTML = '';

  // formation に既に入っている genId 集合
  const placedIds = new Set(formationPlacements().map(p => p.genId));

  // ruleKey ごとに pool を集約（scope 別に列挙）
  const pools = [];
  const scopeLabels = SCOPE_LABELS;
  for (const scope of ['rally','legion','array','self']) {
    const byRule = aggregated[scope] || [];
    for (const p of byRule) {
      if (p.capValue == null) continue;     // 上限なしはスキップ
      if (p.ruleKey === 'no_cap_implicit' || p.ruleKey === 'no_cap') continue;
      if (!p.items.length) continue;
      pools.push({ scope, ...p });
    }
  }
  if (!pools.length) {
    el.innerHTML = '<em style="color:var(--muted);">上限ルールが適用されたスキルは編成内にありません。</em>';
    return;
  }

  // 候補武将: 編成外で、各 ruleKey と一致する cap.rule を持つスキルがある武将を抽出
  function candidatesFor(ruleKey) {
    const recs = [];
    for (const g of state.data.generals) {
      if (placedIds.has(g.id)) continue;
      for (const sk of (g.skills || [])) {
        if (sk.cap && sk.cap.rule === ruleKey) {
          // 突破4時点の値を表示
          const vals = (sk.value && sk.value.by_breakthrough) || [];
          const v4 = vals[4];
          recs.push({ gname: g.name, sname: sk.name, value: v4 });
          break; // 同武将は1スキル代表で十分
        }
      }
    }
    return recs;
  }

  for (const p of pools) {
    const card = document.createElement('div');
    card.className = 'pool-card';

    const ratio = p.capValue !== 0
      ? Math.min(100, Math.abs(p.sum) / Math.abs(p.capValue) * 100)
      : 0;
    const remaining = (p.capValue || 0) - (p.capped || 0);
    const remainStr = (p.capValue > 0)
      ? `余裕 ${(p.capValue - p.capped).toFixed(1)}%`
      : `余裕 ${(p.capped - p.capValue).toFixed(1)}%`;
    const statusHtml = p.overflow
      ? `<span class="status-full">上限到達 (溢れ ${Math.abs(p.sum - p.capped).toFixed(1)}%)</span>`
      : (Math.abs(p.sum) >= Math.abs(p.capValue) ? `<span class="status-full">上限ぴったり</span>` : `<span class="status-room">${remainStr}</span>`);

    const scopeLabel = scopeLabels[p.scope] || p.scope;
    // 構成スキルから属性・方向を導出（最頻値）
    const attrCount = {};
    const dirCount = {};
    for (const it of p.items) {
      const a = it.attribute || 'その他';
      attrCount[a] = (attrCount[a]||0) + 1;
      const d = it.direction || (it.value > 0 ? 'up' : (it.value < 0 ? 'down' : 'unknown'));
      dirCount[d] = (dirCount[d]||0) + 1;
    }
    const topAttr = Object.entries(attrCount).sort((a,b)=>b[1]-a[1])[0][0];
    const topDir = Object.entries(dirCount).sort((a,b)=>b[1]-a[1])[0][0];
    const dirLabel = topDir === 'up' ? 'アップ' : (topDir === 'down' ? 'ダウン' : '');
    const sharedLabel = p.isShared ? '共有' : '非共有';
    const titleLabel = `${scopeLabel}・${topAttr}${dirLabel}（${sharedLabel}・上限${Math.abs(p.capValue)}%）`;

    card.innerHTML = `
      <div class="head">
        <strong>${titleLabel}</strong>
        <span>${fmtVal(p.capped, 'percent')} / ${fmtVal(p.capValue, 'percent')}</span>
        <span class="bar ${p.overflow ? 'overflow' : ''}"><span style="width:${ratio}%;"></span></span>
        ${statusHtml}
      </div>
      <div class="pool-note">rule: <code>${p.ruleKey}</code>${p.ruleNote ? ' — ' + p.ruleNote : ''}</div>
    `;

    // 現メンバーリスト（武将名 / 完全スキル名 / 値 を箇条書きで明示）
    const memDiv = document.createElement('div');
    memDiv.className = 'recs';
    memDiv.innerHTML = '<strong>構成スキル:</strong><ul style="margin:2px 0 2px 18px;padding:0;">' +
      p.items.map(i => `<li><strong>${i.general}</strong> / ${i.skill} <span style="color:var(--muted)">(${fmtVal(i.value,'percent')})</span></li>`).join('') +
      '</ul>';
    card.appendChild(memDiv);

    // 余裕がある場合のみ候補表示
    if (!p.overflow && Math.abs(p.sum) < Math.abs(p.capValue)) {
      const recs = candidatesFor(p.ruleKey);
      const recDiv = document.createElement('div');
      recDiv.className = 'recs';
      if (recs.length) {
        const top = recs.slice(0, 10);
        recDiv.innerHTML = `<strong>➕ 候補武将 (${recs.length}件、上位${top.length}件):</strong><ul style="margin:2px 0 2px 18px;padding:0;">` +
          top.map(r => `<li><strong>${r.gname}</strong> / ${r.sname}${r.value != null ? ` <span style="color:var(--muted)">(${fmtVal(r.value,'percent')})</span>` : ''}</li>`).join('') +
          '</ul>';
      } else {
        recDiv.innerHTML = '<em>編成外に該当武将なし</em>';
      }
      card.appendChild(recDiv);
    }

    el.appendChild(card);
  }
}

function renderSummary() {
  const { aggregated, issues, breakdown } = aggregate();

  // 属性マトリクスを最初に描画
  renderAttributeMatrix(breakdown);

  // 上限プール状況
  renderCapPoolStatus(aggregated);

  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML = '';

  const scopeLabels = SCOPE_LABELS;

  for (const scope of ['rally', 'legion', 'array', 'self']) {
    const groups = aggregated[scope] || [];
    if (!groups.length) continue;
    const section = document.createElement('details');
    section.open = (scope === 'rally' || scope === 'legion');
    const sum = document.createElement('summary');
    sum.innerHTML = `<span class="scope-badge scope-${scope}">${scopeLabels[scope]}</span> ${groups.length}グループ`;
    section.appendChild(sum);

    for (const grp of groups) {
      const row = document.createElement('div');
      row.className = 'summary-row';
      const labels = grp.items.map(i => `${i.general}/${i.skill}`).join(', ');
      const capLabel = grp.capValue == null ? '上限未指定' :
                       (grp.overflow ? `上限${grp.capValue}（超過）` : `上限${grp.capValue}`);
      const valLabel = `合算 ${fmtVal(grp.sum, grp.items[0].unit)} → 実効 ${fmtVal(grp.capped, grp.items[0].unit)}`;
      const sharedLabel = grp.isShared ? '<span class="badge" style="background:#ddd;">共有</span>' : '';
      row.innerHTML = `
        <div class="label">${sharedLabel}${grp.ruleKey}<br><span style="font-size:11px;">${labels}</span></div>
        <div class="value ${grp.overflow ? 'overflow' : 'ok'}">${valLabel}<br><span style="font-size:11px;color:var(--muted);">${capLabel}</span></div>
      `;
      section.appendChild(row);
    }
    summaryEl.appendChild(section);
  }

  // 警告
  if (issues.length) {
    const warnEl = document.createElement('div');
    warnEl.className = 'warn-banner';
    warnEl.innerHTML = `<strong>要確認 (${issues.length}件):</strong><ul style="margin:4px 0 0 16px;padding:0;">` +
      issues.map(i => `<li>${i}</li>`).join('') + '</ul>';
    summaryEl.appendChild(warnEl);
  }

  if (!groupsHadAnyContent(aggregated)) {
    summaryEl.innerHTML = '<em style="color:var(--muted);">所持武将がありません。一覧から所持にチェックを入れてください。</em>';
  }

  // スキル詳細
  const detailEl = document.getElementById('skill-detail');
  if (breakdown.length === 0) {
    detailEl.innerHTML = '<em style="color:var(--muted);">所持武将のスキルがここに表示されます。</em>';
    return;
  }
  detailEl.innerHTML = '';
  const byGeneral = {};
  for (const b of breakdown) {
    if (!byGeneral[b.general]) byGeneral[b.general] = [];
    byGeneral[b.general].push(b);
  }
  for (const gname of Object.keys(byGeneral)) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = gname;
    d.appendChild(s);
    for (const b of byGeneral[gname]) {
      const row = document.createElement('div');
      row.className = 'skill-row';
      const lockedNote = b.value == null
        ? (b.unlocked_at > 0 ? `（突破${b.unlocked_at}で解放／現状未解放 or 未登録）` : '（値未登録）')
        : '';
      row.innerHTML = `
        <span class="scope-badge scope-${b.scope}">${scopeLabels[b.scope] || b.scope}</span>
        <strong>${b.skill}</strong>
        <span class="conf-${b.confidence}">[${b.confidence}]</span>
        ${b.stacking === 'non_stackable' ? '<span class="badge" style="background:#fbecdc;">累加不可</span>' : ''}
        ${b.unlocked_at_equipment != null ? `<span class="badge" style="background:#e8eef4;">装備${b.unlocked_at_equipment}</span>` : ''}
        → 値=${fmtVal(b.value, b.unit)} ${lockedNote}
      `;
      d.appendChild(row);
    }
    detailEl.appendChild(d);
  }
}

function groupsHadAnyContent(aggregated) {
  for (const s of Object.keys(aggregated)) {
    if (aggregated[s] && aggregated[s].length) return true;
  }
  return false;
}

// 集結共通の優先属性 UI（第一/第二優先を1セットだけ表示）
function renderGlobalPriority() {
  const priOpts = buildPriorityOptions();
  for (const key of ['pri1', 'pri2']) {
    const sel = document.getElementById(`global-${key}`);
    if (!sel) continue;
    sel.innerHTML = priOpts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    sel.value = state.priority[key] || '';
    sel.onchange = () => {
      state.priority[key] = sel.value;
      saveState();
    };
  }
}

// =========================
// グループ機能アクセス制御（パスワード解錠式）
// =========================
const GROUP_LOCK_KEY = 'sangoku_group_unlocked_v1';
const GROUP_PASSPHRASE = 'sangoku2026';

function isGroupUnlocked() {
  return localStorage.getItem(GROUP_LOCK_KEY) === '1';
}
function setGroupUnlocked(on) {
  if (on) localStorage.setItem(GROUP_LOCK_KEY, '1');
  else localStorage.removeItem(GROUP_LOCK_KEY);
}

function initGroupLock() {
  // フッター下端に控えめなボタンを設置
  const footer = document.createElement('div');
  footer.id = 'group-footer';
  footer.style.cssText = 'margin-top:24px;padding:10px 4px;text-align:center;color:#bcae8a;font-size:11px;border-top:1px dotted var(--border);';
  footer.innerHTML = `<button id="btn-group-toggle" title="グループ機能" style="background:transparent;color:#bcae8a;border:1px solid #d4c89c;padding:4px 10px;font-size:11px;border-radius:3px;">⚙️</button>`;
  document.body.appendChild(footer);

  const groupPanel = document.createElement('div');
  groupPanel.id = 'group-panel';
  groupPanel.style.cssText = 'display:none;margin:12px 0;padding:10px;background:#e8f0e0;border:1px solid #88a06a;';
  groupPanel.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
      <strong style="color:#3a5520;">🔓 グループ</strong>
      <button id="btn-mode-toggle" title="同期モード ⇄ 試作モード をワンタッチで切替" style="background:#3a5520;color:#fff;border:none;padding:4px 10px;font-size:12px;cursor:pointer;border-radius:3px;">🔗 同期モード</button>
      <span id="group-status" style="font-size:11px;color:#666;"></span>
      <button id="btn-group-lock" style="background:#999;color:#fff;border:none;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:auto;">ロックに戻す</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:12px;">
      <button id="btn-cloud-pull" title="クラウド上の最新データでこの端末を上書き">⬇️ クラウドから取得</button>
      <button id="btn-cloud-push" title="この端末の現在状態をクラウドへ保存（他端末に同期）" style="background:var(--accent);color:#fff;">⬆️ クラウドへ保存</button>
    </div>
    <div style="font-size:11px;color:#777;margin-top:6px;">
      ※ 後勝ち（last-write-wins）方式。試作モード中は保存ボタンが警告色になります。
      <a href="https://github.com/yuichi4107-lab/sangoku-sim/blob/main/docs/group_sync.md" target="_blank" style="color:#3a5520;">📖 詳細</a>
    </div>
  `;
  // フッターの直前に挿入（aside がないので body 直下）
  document.body.insertBefore(groupPanel, footer);

  // クラウド同期ロジック（後でフックを呼ぶ）
  initCloudSync();

  function refresh() {
    groupPanel.style.display = isGroupUnlocked() ? '' : 'none';
  }
  refresh();

  document.getElementById('btn-group-toggle').addEventListener('click', async () => {
    if (isGroupUnlocked()) {
      notify('グループ機能は既に解錠されています。');
      return;
    }
    const code = await askText('アクセスコードを入力してください:');
    if (code == null) return;
    if (code === GROUP_PASSPHRASE) {
      setGroupUnlocked(true);
      refresh();
      notify('✅ グループ機能を解錠しました。');
    } else {
      notify('❌ アクセスコードが違います。');
    }
  });

  document.getElementById('btn-group-lock').addEventListener('click', async () => {
    if (await askConfirm('グループ機能をロックします。よろしいですか？\n（再解錠にはアクセスコードが必要です）')) {
      setGroupUnlocked(false);
      refresh();
    }
  });
}

// =========================
// クラウド同期（GAS Web App）
// =========================
const GROUP_API_URL = 'https://script.google.com/macros/s/AKfycbzHbJsj9mdyVqJvMl85_NkB5y4k4tbQ2hYXahT3gVNAPaQfCU4629xuvmnEtQJc6B26/exec';
const GROUP_MODE_KEY = 'sangoku_group_mode_v1';  // "sync" | "draft"
let lastCloudUpdatedAt = '';

function getGroupMode() {
  return localStorage.getItem(GROUP_MODE_KEY) === 'draft' ? 'draft' : 'sync';
}
function setGroupMode(m) {
  localStorage.setItem(GROUP_MODE_KEY, m);
}

async function cloudGet() {
  const res = await fetch(GROUP_API_URL, { method: 'GET' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function cloudPut(payload) {
  // Content-Type: text/plain でプリフライト回避
  const res = await fetch(GROUP_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const r = await res.json();
  if (!r.ok) throw new Error(r.error || 'unknown');
  return r;
}

function buildSharedPayload() {
  return {
    schema: 'sangoku_group_v1',
    users: state.users,
    ownerships: state.ownerships,
    activeUserId: state.activeUserId,
    formations: state.formations,
    priority: state.priority,
    aggMode: state.aggMode,
  };
}

function applySharedPayload(d) {
  if (!d || typeof d !== 'object') return false;
  if (Array.isArray(d.users)) state.users = d.users;
  if (d.ownerships && typeof d.ownerships === 'object') state.ownerships = d.ownerships;
  if (typeof d.activeUserId === 'number' && state.users.find(u => u.id === d.activeUserId)) state.activeUserId = d.activeUserId;
  if (Array.isArray(d.formations)) state.formations = d.formations;
  if (d.priority && typeof d.priority === 'object') state.priority = d.priority;
  if (d.aggMode) state.aggMode = d.aggMode;
  saveState();
  renderUserTabs();
  renderGlobalPriority();
  renderRoster();
  renderFormation();
  renderSummary();
  return true;
}

function setGroupStatus(text, color) {
  const el = document.getElementById('group-status');
  if (!el) return;
  el.textContent = text;
  el.style.color = color || '#666';
}

function initCloudSync() {
  const btnPull = document.getElementById('btn-cloud-pull');
  const btnPush = document.getElementById('btn-cloud-push');
  const btnMode = document.getElementById('btn-mode-toggle');
  if (!btnPull) return;

  // モード表示の更新
  function refreshModeUI() {
    const mode = getGroupMode();
    if (mode === 'draft') {
      btnMode.textContent = '🧪 試作モード';
      btnMode.style.background = '#a05a2a';
      btnPush.style.background = '#c33';
      btnPush.title = '⚠️ 試作モード中。押すと試作内容が本番に反映されます';
      setGroupStatus('試作中（保存しても本番反映可、要確認）', '#a05a2a');
    } else {
      btnMode.textContent = '🔗 同期モード';
      btnMode.style.background = '#3a5520';
      btnPush.style.background = 'var(--accent)';
      btnPush.title = 'この端末の現在状態をクラウドへ保存（他端末に同期）';
      setGroupStatus('同期中', '#3a5520');
    }
  }
  refreshModeUI();

  // モード切替（ワンタッチ）
  btnMode.addEventListener('click', () => {
    const next = getGroupMode() === 'sync' ? 'draft' : 'sync';
    setGroupMode(next);
    refreshModeUI();
  });

  btnPull.addEventListener('click', async () => {
    if (!await askConfirm('クラウド上の最新データでこの端末を上書きします。よろしいですか？\n（この端末の現在の編集内容は失われます）')) return;
    setGroupStatus('取得中…', '#888');
    try {
      const r = await cloudGet();
      if (!r.ok) throw new Error('GET failed');
      if (!r.data || !Object.keys(r.data).length) {
        setGroupStatus('クラウドはまだ空です', '#888');
        notify('クラウドにはまだデータがありません。\nまず「クラウドへ保存」で初期データをアップロードしてください。');
        return;
      }
      applySharedPayload(r.data);
      lastCloudUpdatedAt = r.updated_at || '';
      notify('クラウドから取得しました。');
      refreshModeUI();
      setGroupStatus(`取得完了 ${new Date().toLocaleTimeString()}`, '#3a5520');
    } catch (e) {
      setGroupStatus('取得失敗', '#c33');
      notify(`取得失敗: ${e.message}`);
    }
  });

  btnPush.addEventListener('click', async () => {
    // 試作モード中は確認ダイアログ
    if (getGroupMode() === 'draft') {
      const ok = await askConfirm('⚠️ 試作モード中です。\n試作中の内容をクラウド（本番）に反映してよろしいですか？');
      if (!ok) return;
    }
    setGroupStatus('保存中…', '#888');
    try {
      const r = await cloudPut(buildSharedPayload());
      lastCloudUpdatedAt = r.updated_at || '';
      notify('クラウドに保存しました。');
      refreshModeUI();
      setGroupStatus(`保存完了 ${new Date().toLocaleTimeString()}`, '#3a5520');
    } catch (e) {
      setGroupStatus('保存失敗', '#c33');
      notify(`保存失敗: ${e.message}`);
    }
  });
}

</script>
</body>
</html>
