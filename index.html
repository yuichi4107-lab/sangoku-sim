// CORE_ATTRS は下で定義されている定数を参照するため、関数化して遅延評価する
function buildPriorityOptions() {
  const out = [{ value: '', label: '— なし —' }];
  for (const a of CORE_ATTRS) {
    out.push({ value: `${a}/up`,   label: `${a} up`   });
    out.push({ value: `${a}/down`, label: `${a} down` });
  }
  return out;
}

// 旧 initAutoBuilder は撤去。auto-builder は renderFormation 内で軍団ごとに描画する。

// スキルの cap 情報を取得
function getCapInfo(sk) {
  const ruleKey = (sk.cap && sk.cap.rule) || null;
  const isShared = !!(sk.cap && sk.cap.shared);
  const ruleDef = ruleKey && state.data ? state.data.meta.cap_rules[ruleKey] : null;
  let capValue = null;
  if (sk.cap && sk.cap.cap_value != null) capValue = sk.cap.cap_value;
  else if (ruleDef && ruleDef.cap_value != null) capValue = ruleDef.cap_value;
  // shared プールキー（個別の場合は null → 都度独立判定）
  const scope = sk.scope || 'self';
  const bucketKey = isShared && ruleKey ? `${scope}#${ruleKey}#shared` : null;
  return { ruleKey, isShared, capValue, scope, bucketKey };
}

// 優先度ごとの重み（第一優先が最も重い。geometric 2倍ずつ）
const PRIORITY_WEIGHTS = [16, 8, 4, 2, 1];

// 与えられた pool 状態のもとで、この武将を編成に加えたときの限界貢献スコアを計算
// pris は [pri1..pri5] の配列（空文字含む）。pool は { bucketKey: 現在の合計 }。
// slot を渡すと配置スロット条件、legionTroop を渡すと兵種条件で発動可否を判定する。
function marginalContribution(g, pris, pool, userId, slot, legionTroop) {
  const own = getOwn(userId != null ? userId : state.activeUserId, g.id);
  const scores = [0, 0, 0, 0, 0];  // 各優先度ごとの貢献
  const newPool = { ...pool };
  for (const sk of (g.skills || [])) {
    // 派遣不要スキルは配置不要で常時発動 → 配置の限界貢献には数えない
    if (isDispatchFree(sk)) continue;
    // 配置条件: スキルが特定スロット担当を要求し、現在のスロットと違うなら発動しない
    if (slot) {
      const req = skillRequiredSlot(sk);
      if (req && req !== slot) continue;
    }
    // 兵種条件: スキルが特定兵種を対象とし、軍団兵種と違うなら発動しない
    if (legionTroop) {
      const tt = skillTargetTroop(sk);
      if (tt && tt !== legionTroop) continue;
    }
    const eff = resolveSkillValue(sk, own);
    if (eff == null) continue;
    const key = `${sk.effect_attribute}/${sk.direction}`;
    // どの優先度にマッチするか（複数該当しうるが、最上位の1つに加算）
    let matchIdx = -1;
    for (let i = 0; i < pris.length; i++) {
      if (pris[i] && key === pris[i]) { matchIdx = i; break; }
    }
    if (matchIdx < 0) continue;
    const info = getCapInfo(sk);
    let marginal = eff;
    if (info.bucketKey && info.capValue != null) {
      const before = newPool[info.bucketKey] || 0;
      let after;
      if (info.capValue > 0) {
        after = (before >= info.capValue) ? before : Math.min(before + eff, info.capValue);
      } else {
        after = (before <= info.capValue) ? before : Math.max(before + eff, info.capValue);
      }
      marginal = after - before;
      newPool[info.bucketKey] = after;
    } else if (info.capValue != null) {
      if (info.capValue > 0) marginal = Math.min(eff, info.capValue);
      else marginal = Math.max(eff, info.capValue);
    }
    scores[matchIdx] += Math.abs(marginal);
  }
  let score = 0;
  for (let i = 0; i < scores.length; i++) score += scores[i] * (PRIORITY_WEIGHTS[i] || 0);
  return { score, newPool };
}

function runAutoBuilderFor(legionIdx) {
  const f = state.formations[legionIdx];
  const userId = f.user_id;
  const troop = f.troop_type;
  // 第一〜第五優先は集結全体で共有
  const pris = [state.priority.pri1, state.priority.pri2, state.priority.pri3, state.priority.pri4, state.priority.pri5];
  if (!pris.some(p => p)) {
    notify('優先属性を1つ以上指定してください');
    return;
  }
  if (!troop) {
    notify('兵種を指定してください');
    return;
  }

  // 同じユーザーの他軍団で使用中の武将を除外
  const usedByOtherSameUser = new Set();
  state.formations.forEach((other, idx) => {
    if (idx === legionIdx) return;
    if (other.user_id !== userId) return;
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) usedByOtherSameUser.add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) usedByOtherSameUser.add(other.array[k]);
  });

  const ownedGens = state.data.generals.filter(g =>
    getOwn(userId, g.id).owned &&
    !usedByOtherSameUser.has(g.id) &&
    hasPlacementCombatSkill(g)  // 派遣不要のみの武将は自動編成では配置しない（手動選択は可）
  );

  // この軍団をクリア（他軍団は触らない）
  state.formations[legionIdx] = {
    user_id: userId,
    selected: f.selected,
    troop_type: troop,
    battalions: [emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion()],
    array: emptyBattalion(),
    auto: { pri1: pris[0], pri2: pris[1] },
  };
  const fNew = state.formations[legionIdx];
  const used = new Set();
  let pool = {};

  // 全軍団（他ユーザー含む）に既に置かれた武将のスキルから集結 cap プール初期値を計算
  for (const other of state.formations) {
    if (other === fNew) continue;
    const placed = new Set();
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) placed.add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) placed.add(other.array[k]);
    for (const gid of placed) {
      const g = state.data.generals.find(x => x.id === gid);
      if (!g) continue;
      const own = getOwn(other.user_id, g.id);
      for (const sk of (g.skills || [])) {
        const eff = resolveSkillValue(sk, own);
        if (eff == null) continue;
        const info = getCapInfo(sk);
        if (info.bucketKey) pool[info.bucketKey] = (pool[info.bucketKey] || 0) + eff;
      }
    }
  }

  // slot_stat・兵種による配置制限は廃止。配置/兵種条件は marginalContribution が考慮する。
  function pickBest(slot, candidateFilter) {
    let best = null;
    for (const g of ownedGens) {
      if (used.has(g.id)) continue;
      if (candidateFilter && !candidateFilter(g)) continue;
      const { score, newPool } = marginalContribution(g, pris, pool, userId, slot, troop);
      if (best === null || score > best.score) {
        best = { g, score, newPool };
      }
    }
    return best;
  }

  for (let bi = 0; bi < 5; bi++) {
    const bat = fNew.battalions[bi];
    for (const slot of SLOT_KEYS) {
      const best = pickBest(slot, null);  // 全所持武将が候補（兵種条件はスコアで考慮）
      if (best) {
        bat[slot] = best.g.id;
        used.add(best.g.id);
        pool = best.newPool;
      }
    }
  }
  for (const slot of SLOT_KEYS) {
    const best = pickBest(slot, null);
    if (best) {
      fNew.array[slot] = best.g.id;
      used.add(best.g.id);
      pool = best.newPool;
    }
  }

  // 軍団内の枠を並べ替え（担当条件 ＞ 角陣 ＞ 能力値順）
  rearrangeLegion(fNew);

  saveState();
  renderFormation();
  renderSummary();
}

// 全体最適（グローバル貪欲＋入れ替え改善）で複数軍団を一括編成。
// 軍団番号順の逐次配置をやめ、全対象スロット×全候補から毎回最良を選ぶ。
function runAutoBuildAllGlobal(targetIdxs) {
  const pris = [state.priority.pri1, state.priority.pri2, state.priority.pri3, state.priority.pri4, state.priority.pri5];
  const targetSet = new Set(targetIdxs);
  const genMap = new Map(state.data.generals.map(g => [g.id, g]));  // id→武将 高速参照

  // 対象軍団をクリア（兵種・選択・user_id は保持）
  for (const idx of targetIdxs) {
    const f = state.formations[idx];
    f.battalions = [emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion(), emptyBattalion()];
    f.array = emptyBattalion();
    f.auto = { pri1: pris[0], pri2: pris[1] };
  }

  // 基準 cap プール: 対象外軍団に既に置かれた武将の寄与
  const basePool = {};
  state.formations.forEach((other, i) => {
    if (targetSet.has(i)) return;
    const placed = new Set();
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) placed.add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) placed.add(other.array[k]);
    for (const gid of placed) {
      const g = genMap.get(gid);
      if (!g) continue;
      const own = getOwn(other.user_id, g.id);
      for (const sk of (g.skills || [])) {
        const eff = resolveSkillValue(sk, own);
        if (eff == null) continue;
        const info = getCapInfo(sk);
        if (info.bucketKey) basePool[info.bucketKey] = (basePool[info.bucketKey] || 0) + eff;
      }
    }
  });

  // ユーザーごとの「対象外軍団で使用中」武将（候補から除外）
  const usedElse = {};
  state.formations.forEach((other, i) => {
    if (targetSet.has(i)) return;
    const u = other.user_id;
    (usedElse[u] = usedElse[u] || new Set());
    for (const b of other.battalions) for (const k of SLOT_KEYS) if (b[k]) usedElse[u].add(b[k]);
    for (const k of SLOT_KEYS) if (other.array[k]) usedElse[u].add(other.array[k]);
  });

  // 全対象スロット（bi=-1 は角陣）
  const slots = [];
  for (const idx of targetIdxs) {
    const f = state.formations[idx];
    if (!f.troop_type) continue;
    for (let bi = 0; bi < 5; bi++) for (const slot of SLOT_KEYS) slots.push({ idx, bi, slot, userId: f.user_id, troop: f.troop_type });
    for (const slot of SLOT_KEYS) slots.push({ idx, bi: -1, slot, userId: f.user_id, troop: f.troop_type });
  }
  const slotKey = s => `${s.idx}:${s.bi}:${s.slot}`;

  // ユーザーごとの候補武将（所持・派遣不要のみ除外・他軍団未使用）
  const candByUser = {};
  for (const s of slots) {
    if (s.userId in candByUser) continue;
    const ue = usedElse[s.userId] || new Set();
    candByUser[s.userId] = state.data.generals.filter(g =>
      getOwn(s.userId, g.id).owned && !ue.has(g.id) && hasPlacementCombatSkill(g));
  }

  const assign = new Map();   // slotKey -> genId
  const usedRun = {};         // userId -> Set
  const isUsed = (u, gid) => usedRun[u] && usedRun[u].has(gid);
  const markUsed = (u, gid) => (usedRun[u] = usedRun[u] || new Set()).add(gid);

  // ---- グローバル貪欲 ----
  let pool = { ...basePool };
  const remaining = [...slots];
  while (remaining.length) {
    // スコアは (userId, 兵種, スロット種) のみで決まる → 同一comboは代表1スロットだけ評価
    const reps = new Map();  // comboKey -> 代表 ri
    for (let ri = 0; ri < remaining.length; ri++) {
      const s = remaining[ri];
      const ck = `${s.userId}#${s.troop}#${s.slot}`;
      if (!reps.has(ck)) reps.set(ck, ri);
    }
    let best = null;
    for (const ri of reps.values()) {
      const s = remaining[ri];
      for (const g of candByUser[s.userId]) {
        if (isUsed(s.userId, g.id)) continue;
        const { score, newPool } = marginalContribution(g, pris, pool, s.userId, s.slot, s.troop);
        if (best === null || score > best.score) best = { ri, g, score, newPool };
      }
    }
    if (best === null) break;
    const s = remaining[best.ri];
    assign.set(slotKey(s), best.g.id);
    markUsed(s.userId, best.g.id);
    pool = best.newPool;
    remaining.splice(best.ri, 1);
  }

  // ---- 入れ替え改善（local search）----
  // 固定順で配置全体のスコアを評価（共有capも順次反映）
  function configScore(amap) {
    let p = { ...basePool };
    let total = 0;
    for (const s of slots) {
      const gid = amap.get(slotKey(s));
      if (!gid) continue;
      const g = genMap.get(gid);
      if (!g) continue;
      const { score, newPool } = marginalContribution(g, pris, p, s.userId, s.slot, s.troop);
      total += score;
      p = newPool;
    }
    return total;
  }
  let curScore = configScore(assign);
  const filled = slots.filter(s => assign.has(slotKey(s)));
  const LS_BUDGET_MS = 2000;             // 入れ替え改善の時間予算
  const lsStart = performance.now();
  let improved = true, passes = 0;
  while (improved && passes < 3 && performance.now() - lsStart < LS_BUDGET_MS) {
    improved = false; passes++;
    // (a) 同ユーザーの2スロット間で武将を入れ替え
    for (let a = 0; a < filled.length; a++) {
      if (performance.now() - lsStart > LS_BUDGET_MS) break;
      for (let b = a + 1; b < filled.length; b++) {
        if (filled[a].userId !== filled[b].userId) continue;
        const ka = slotKey(filled[a]), kb = slotKey(filled[b]);
        const ga = assign.get(ka), gb = assign.get(kb);
        if (ga === gb) continue;
        assign.set(ka, gb); assign.set(kb, ga);
        const sc = configScore(assign);
        if (sc > curScore + 1e-9) { curScore = sc; improved = true; }
        else { assign.set(ka, ga); assign.set(kb, gb); }
      }
    }
    // (b) 配置武将を同ユーザーの未使用候補と置換
    for (const s of filled) {
      if (performance.now() - lsStart > LS_BUDGET_MS) break;
      const k = slotKey(s);
      const cur = assign.get(k);
      const usedNow = new Set(assign.values());
      for (const g of candByUser[s.userId]) {
        if (usedNow.has(g.id)) continue;
        assign.set(k, g.id);
        const sc = configScore(assign);
        if (sc > curScore + 1e-9) { curScore = sc; improved = true; break; }
        else assign.set(k, cur);
      }
    }
  }

  // ---- 反映 ----
  for (const s of slots) {
    const gid = assign.get(slotKey(s));
    if (!gid) continue;
    const f = state.formations[s.idx];
    if (s.bi === -1) f.array[s.slot] = gid;
    else f.battalions[s.bi][s.slot] = gid;
  }
  // 軍団内の枠を並べ替え（担当条件 ＞ 角陣 ＞ 能力値順）
  for (const idx of targetIdxs) rearrangeLegion(state.formations[idx]);
  saveState();
  renderFormation();
  renderSummary();
}

// 軍団内の枠への並べ替え（担当条件スキル ＞ 角陣スキル ＞ 能力値順）。
// 選定（どの武将を入れるか）は変えず、配置済み武将を枠に並べ替えるだけ（スコア中立）。
function rearrangeLegion(f) {
  const ids = [];
  for (const b of f.battalions) for (const k of SLOT_KEYS) if (b[k]) ids.push(b[k]);
  for (const k of SLOT_KEYS) if (f.array[k]) ids.push(f.array[k]);
  if (!ids.length) return;

  const gmap = new Map(state.data.generals.map(g => [g.id, g]));
  const meta = {};
  for (const id of ids) {
    const g = gmap.get(id); const sks = (g && g.skills) || [];
    let req = null;
    for (const s of sks) { const r = skillRequiredSlot(s); if (r) { req = r; break; } }
    const isArray = sks.some(s => s.scope === 'array' || /角陣/.test(s.effect || ''));
    meta[id] = { req, isArray, stats: (g && g.stats) || {} };
  }
  const stat = (id, t) => Number(meta[id].stats[t]) || 0;

  // 一旦クリア
  for (const b of f.battalions) for (const k of SLOT_KEYS) b[k] = null;
  for (const k of SLOT_KEYS) f.array[k] = null;

  const pool = new Set(ids);
  const setBat = (bi, t, id) => { f.battalions[bi][t] = id; pool.delete(id); };
  const setArr = (t, id) => { f.array[t] = id; pool.delete(id); };

  // 1) 担当条件スキル → 部隊(1→5)を type別に、その能力値の高い順で
  for (const t of SLOT_KEYS) {
    const conds = [...pool].filter(id => meta[id].req === t).sort((a, b) => stat(b, t) - stat(a, t));
    let bi = 0;
    for (const id of conds) {
      while (bi <= 4 && f.battalions[bi][t]) bi++;
      if (bi > 4) break;            // 部隊満杯 → 残りは後段で処理
      setBat(bi, t, id); bi++;
    }
  }

  // 2) 角陣スキル → 角陣スロットへ（希望type = 担当条件 or 最高能力値type）
  const arrayGens = [...pool].filter(id => meta[id].isArray)
    .sort((a, b) => Math.max(...SLOT_KEYS.map(t => stat(b, t))) - Math.max(...SLOT_KEYS.map(t => stat(a, t))));
  for (const id of arrayGens) {
    if (!pool.has(id)) continue;
    const want = meta[id].req || [...SLOT_KEYS].sort((a, b) => stat(id, b) - stat(id, a))[0];
    if (!f.array[want]) { setArr(want, id); continue; }
    const free = SLOT_KEYS.find(k => !f.array[k]);
    if (free) setArr(free, id);     // 角陣満杯なら後段で部隊へ
  }

  // 3) 残り → 能力値順で 統率部隊1-5 → 武力部隊1-5 → 知性部隊1-5 → 角陣統率/武力/知性
  const order = [];
  for (const t of SLOT_KEYS) for (let bi = 0; bi < 5; bi++) order.push({ arr: false, bi, t });
  for (const t of SLOT_KEYS) order.push({ arr: true, t });
  for (const sl of order) {
    if (!pool.size) break;
    const occupied = sl.arr ? f.array[sl.t] : f.battalions[sl.bi][sl.t];
    if (occupied) continue;
    let best = null, bv = -Infinity;
    for (const id of pool) { const v = stat(id, sl.t); if (v > bv) { bv = v; best = id; } }
    if (best == null) break;
    if (sl.arr) setArr(sl.t, best); else setBat(sl.bi, sl.t, best);
  }
  // 余り（通常は発生しない）→ 空き枠へ
  if (pool.size) for (const sl of order) {
    if (!pool.size) break;
    const occupied = sl.arr ? f.array[sl.t] : f.battalions[sl.bi][sl.t];
    if (occupied) continue;
    const id = pool.values().next().value;
    if (sl.arr) setArr(sl.t, id); else setBat(sl.bi, sl.t, id);
  }
}

function renderFormation() {
  const container = document.getElementById('formation');
  container.innerHTML = '';

  state.formations.forEach((f, li) => {
    const panel = document.createElement('details');
    panel.open = true;
    panel.style.cssText = 'border:1px solid var(--border);margin-bottom:10px;padding:6px 8px;background:#fcfaf3;';
    const summary = document.createElement('summary');
    summary.style.cssText = 'font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    const t = f.troop_type;
    const badge = t ? `<span class="badge b-troop b-troop-${t}">${t}</span>` : `<span style="color:var(--muted);font-weight:normal;">兵種未指定</span>`;
    const userOpts = state.users.map(u =>
      `<option value="${u.id}" ${u.id === f.user_id ? 'selected' : ''}>${u.name}</option>`
    ).join('');
    summary.innerHTML = `
      <input type="checkbox" data-legion="${li}" data-ab="select" ${f.selected ? 'checked' : ''} title="一括自動編成の対象にする">
      <span>軍団${li + 1}</span>
      <select data-legion="${li}" data-ab="user" title="プレイヤー" style="font-size:12px;">${userOpts}</select>
      ${badge}
    `;
    panel.appendChild(summary);
    // 子要素のクリックで折りたたみが切り替わらないように
    const cb = summary.querySelector('input[type="checkbox"]');
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', (e) => {
      f.selected = e.target.checked;
      saveState();
      renderFormation();
    });
    const userSel = summary.querySelector('select[data-ab="user"]');
    userSel.addEventListener('click', (e) => e.stopPropagation());
    userSel.addEventListener('change', (e) => {
      const newUid = parseInt(e.target.value, 10);
      // ユーザー変更時はこの軍団の配置をクリア（別ユーザーの所持武将は使えない）
      f.user_id = newUid;
      f.battalions = [emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion(),emptyBattalion()];
      f.array = emptyBattalion();
      saveState();
      renderFormation();
      renderSummary();
    });

    // 自動編成コントロール（軍団ごと: 兵種のみ。第一/第二優先は集結共通=ヘッダで指定）
    const ctrl = document.createElement('div');
    ctrl.style.cssText = 'background:#fafaf3;border:1px dashed var(--border);padding:6px;margin:6px 0;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;';
    ctrl.innerHTML = `
      <strong>自動編成設定:</strong>
      <label>兵種<select data-legion="${li}" data-ab="troop"></select></label>
      <button data-legion="${li}" data-ab="clear">この軍団をクリア</button>
    `;
    panel.appendChild(ctrl);
    // selectsを埋める
    const troopSel = ctrl.querySelector('select[data-ab="troop"]');
    troopSel.innerHTML = '<option value="">— 兵種未指定 —</option>' + MAIN_TROOPS.map(t => `<option value="${t}">${t}</option>`).join('');
    if (f.troop_type) troopSel.value = f.troop_type;
    troopSel.addEventListener('change', () => {
      f.troop_type = troopSel.value || null;
      saveState(); renderFormation(); renderSummary();
    });
    ctrl.querySelector('button[data-ab="clear"]').addEventListener('click', async () => {
      if (!await askConfirm(`軍団${li + 1} をクリアします`)) return;
      const keepUid = state.formations[li].user_id;
      state.formations[li] = emptyFormation(keepUid);
      saveState(); renderFormation(); renderSummary();
    });

    // 主陣
    const mainGrid = document.createElement('div');
    mainGrid.className = 'formation-grid';
    mainGrid.appendChild(makeHeaderCell(''));
    for (const s of SLOT_KEYS) mainGrid.appendChild(makeHeaderCell(s));
    f.battalions.forEach((bat, idx) => {
      const lab = document.createElement('div');
      lab.className = 'row-label';
      lab.textContent = `部隊${idx + 1}`;
      mainGrid.appendChild(lab);
      for (const slot of SLOT_KEYS) {
        mainGrid.appendChild(makeSlotCell(bat, slot, { isArray: false, legionIdx: li }));
      }
    });
    panel.appendChild(mainGrid);

    // 角陣
    const arrayGrid = document.createElement('div');
    arrayGrid.className = 'formation-grid array-row';
    arrayGrid.appendChild(makeHeaderCell(''));
    for (const s of SLOT_KEYS) arrayGrid.appendChild(makeHeaderCell(s));
    const arrLab = document.createElement('div');
    arrLab.className = 'row-label';
    arrLab.textContent = '角陣';
    arrLab.title = '戦車優先・他兵種も可';
    arrayGrid.appendChild(arrLab);
    for (const slot of SLOT_KEYS) {
      arrayGrid.appendChild(makeSlotCell(f.array, slot, { isArray: true, legionIdx: li }));
    }
    panel.appendChild(arrayGrid);

    container.appendChild(panel);
  });
}

function makeHeaderCell(text) {
  const div = document.createElement('div');
  div.className = 'header';
  div.textContent = text;
  return div;
}

function makeSlotCell(bat, slot, opts) {
  const wrap = document.createElement('div');
  wrap.className = 'slot';
  const sel = document.createElement('select');
  const optEmpty = document.createElement('option');
  optEmpty.value = ''; optEmpty.textContent = '— 空 —';
  sel.appendChild(optEmpty);

  const legionIdx = opts.legionIdx;
  const formation = (legionIdx != null) ? state.formations[legionIdx] : null;
  const userId = formation ? formation.user_id : state.activeUserId;

  // 同じユーザーの他軍団スロットで使用中の武将を除外
  const usedElsewhere = new Set();
  for (const f of state.formations) {
    if (f.user_id !== userId) continue;
    for (const b of f.battalions) {
      for (const k of SLOT_KEYS) {
        if (!b[k]) continue;
        if (b === bat && k === slot) continue;
        usedElsewhere.add(b[k]);
      }
    }
    for (const k of SLOT_KEYS) {
      if (!f.array[k]) continue;
      if (f.array === bat && k === slot) continue;
      usedElsewhere.add(f.array[k]);
    }
  }

  const legionTroop = formation ? formation.troop_type : null;

  // 手動配置の候補: 所持 & 他軍団未使用 & 戦闘スキルあり のみ。
  // 兵種・slot_stat による制限はしない（どの武将もどのスロットに置ける）。
  const candidates = state.data.generals.filter(g => {
    const own = getOwn(userId, g.id);
    if (!own.owned) return false;
    if (usedElsewhere.has(g.id)) return false;
    if (!hasCombatSkill(g)) return false;  // 戦闘貢献なしは候補に出さない
    return true;
  });
  for (const g of candidates) {
    const o = document.createElement('option');
    o.value = g.id;
    o.textContent = `${g.name} (${g.troop_type}/${devTypeLabel(g)})`;
    if (bat[slot] === g.id) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    bat[slot] = sel.value || null;
    saveState();
    renderFormation();  // 他軍団のドロップダウンも更新
    renderSummary();
  });
  wrap.appendChild(sel);
  return wrap;
}

function filteredGenerals() {
  return state.data.generals.filter(g => {
    if (state.filters.troop && g.troop_type !== state.filters.troop) return false;
    if (state.filters.rarity && devType(g) !== state.filters.rarity) return false;
    if (state.filters.search && !g.name.includes(state.filters.search) && !(g.yomi || '').includes(state.filters.search)) return false;
    if (state.filters.ownedOnly && !getOwn(g.id).owned) return false;
    return true;
  });
}

function updateBulkCheckboxes() {
  const filtered = filteredGenerals();
  if (!filtered.length) return;
  const axes = [
    { id: 'bulk-owned',         pick: o => o.owned },
    { id: 'bulk-bt3',           pick: o => o.breakthrough === 3 },
    { id: 'bulk-bt4',           pick: o => o.breakthrough === 4 && (o.equipment||0) === 0 && (o.seal||0) === 0 },
    { id: 'bulk-eq3',           pick: o => o.equipment === 3 },
    { id: 'bulk-equipment',     pick: o => o.equipment === 4 },
  ];
  for (const a of axes) {
    const cb = document.getElementById(a.id);
    if (!cb) continue;
    const states = filtered.map(g => a.pick(getOwn(g.id)));
    const allOn = states.every(Boolean);
    const allOff = states.every(s => !s);
    cb.checked = allOn;
    cb.indeterminate = !allOn && !allOff;
  }
}

function renderRoster() {
  const tbody = document.querySelector('#roster-table tbody');
  tbody.innerHTML = '';
  const filtered = filteredGenerals();

  document.getElementById('roster-count').textContent = `(${filtered.length} / ${state.data.generals.length})`;

  for (const g of filtered) {
    const own = getOwn(g.id);
    const tr = document.createElement('tr');
    if (own.owned) tr.classList.add('owned');

    // 所持チェック
    const tdOwn = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = own.owned;
    cb.addEventListener('change', () => {
      own.owned = cb.checked;
      // 所持解除した武将を、このプレイヤー所属の軍団から外す
      if (!cb.checked) {
        for (const f of state.formations) {
          if (f.user_id !== state.activeUserId) continue;
          for (const bat of f.battalions) {
            for (const k of SLOT_KEYS) if (bat[k] === g.id) bat[k] = null;
          }
          for (const k of SLOT_KEYS) if (f.array[k] === g.id) f.array[k] = null;
        }
      }
      saveState(); renderRoster(); renderFormation(); renderSummary();
    });
    tdOwn.appendChild(cb);
    tr.appendChild(tdOwn);

    // 武将名
    const tdName = document.createElement('td');
    tdName.innerHTML = `<strong>${g.name}</strong>${g.yomi ? `<span style="color:var(--muted);font-size:11px;"> (${g.yomi})</span>` : ''}`;
    tr.appendChild(tdName);

    // 属性
    const tdAttr = document.createElement('td');
    const slotS = Array.isArray(g.slot_stat) ? g.slot_stat.join('/') : (g.slot_stat || '?');
    tdAttr.innerHTML =
      `<span class="badge b-dev-${devType(g)}">${devTypeLabel(g)}</span>` +
      `<span class="badge b-troop b-troop-${g.troop_type}">${g.troop_type}</span>` +
      `<span style="font-size:11px;color:var(--muted);">${slotS}</span>`;
    tr.appendChild(tdAttr);

    // 育成段階（武将タイプで選択肢を出し分け）
    //   装備武将: 3突/4突/3装/4装   将印武将: 3突/4突/印   どちらでもない: 3突/4突
    const tdProg = document.createElement('td');
    const bt4pure = own.breakthrough === 4 && (own.equipment || 0) === 0 && (own.seal || 0) === 0;
    const dt = devType(g);
    let progHtml = `
        <label>3突<input type="checkbox" ${own.breakthrough === 3 ? 'checked' : ''} data-id="${g.id}" data-axis="bt3"></label>
        <label>4突<input type="checkbox" ${bt4pure ? 'checked' : ''} data-id="${g.id}" data-axis="bt4"></label>`;
    if (dt === 'equipment') {
      progHtml += `
        <label>3装<input type="checkbox" ${own.equipment === 3 ? 'checked' : ''} data-id="${g.id}" data-axis="eq3"></label>
        <label>4装<input type="checkbox" ${own.equipment === 4 ? 'checked' : ''} data-id="${g.id}" data-axis="eq4"></label>`;
    } else if (dt === 'seal') {
      progHtml += `
        <label>印<input type="number" min="0" max="10" value="${own.seal}" data-id="${g.id}" data-axis="seal"></label>`;
    }
    tdProg.innerHTML = `<span class="progression">${progHtml}</span>`;
    tr.appendChild(tdProg);

    tbody.appendChild(tr);
  }

  updateBulkCheckboxes();

  // bind progression inputs
  // なし→3突→4突→(4装 or 将印)。4装と将印(印>0)は排他。
  tbody.querySelectorAll('input[data-axis]').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.id;
      const axis = inp.dataset.axis;
      const own = getOwn(id);
      if (axis === 'bt3') {
        if (inp.checked) { own.breakthrough = 3; own.equipment = 0; own.seal = 0; }
        else if (own.breakthrough === 3) own.breakthrough = 0;
      } else if (axis === 'bt4') {
        if (inp.checked) { own.breakthrough = 4; own.equipment = 0; own.seal = 0; }
        else if (own.breakthrough === 4 && (own.equipment||0) === 0 && (own.seal||0) === 0) own.breakthrough = 0;
      } else if (axis === 'eq3') {
        // 3装パス: 4突到達 + 装備3。将印とは排他なので印をクリア
        if (inp.checked) { own.breakthrough = 4; own.equipment = 3; own.seal = 0; }
        else if (own.equipment === 3) own.equipment = 0;
      } else if (axis === 'eq4') {
        // 4装パス: 4突到達 + 装備4。将印とは排他なので印をクリア
        if (inp.checked) { own.breakthrough = 4; own.equipment = 4; own.seal = 0; }
        else if (own.equipment === 4) own.equipment = 0;
      } else if (axis === 'seal') {
        const v = Math.max(0, Math.min(10, parseInt(inp.value, 10) || 0));
        own.seal = v;
        // 将印パス: 印>0 なら 4突到達 + 装備とは排他なので装備をクリア
        if (v > 0) { own.breakthrough = 4; own.equipment = 0; }
      } else {
        own[axis] = parseInt(inp.value, 10) || 0;
      }
      saveState();
      // 状態が排他で変わるので再描画（印も装備チェックに影響）
      renderRoster();
      renderSummary();
    });
  });
}

function fmtVal(v, unit) {
  if (v == null) return '—';
  if (unit === 'percent') return `${v > 0 ? '+' : ''}${v}%`;
  return `${v}`;
}

const CORE_ATTRS = ['攻撃', '防御', '連撃', '貫通', '抵抗', 'シールド', '貫通抵抗', 'ダメージ', '軍紀', '率兵', '兵士数', '抑制'];
const SCOPE_LABELS = { legion: '軍団', rally: '集結', array: '角陣', self: '自部隊' };

// 属性マトリクス集計
function aggregateByAttribute(breakdown) {
  // 戻り値: { [attr]: { [scope]: { up: [items], down: [items], both: [items] } }, その他: [items] }
  const matrix = {};
  for (const attr of [...CORE_ATTRS, 'その他']) {
    matrix[attr] = { legion: {up:[], down:[], both:[]}, rally: {up:[], down:[], both:[]}, array: {up:[], down:[], both:[]}, self: {up:[], down:[], both:[]} };
  }
  for (const b of breakdown) {
    if (b.value == null) continue;
    const attr = b.attribute || 'その他';
    const dir = b.direction || (b.value > 0 ? 'up' : (b.value < 0 ? 'down' : null));
    if (!dir) continue;
    const scope = b.scope || 'self';
    if (!matrix[attr] || !matrix[attr][scope]) continue;
    if (!matrix[attr][scope][dir]) matrix[attr][scope][dir] = [];
    matrix[attr][scope][dir].push(b);
  }
  return matrix;
}

function renderAttributeMatrix(breakdown) {
  const el = document.getElementById('attr-matrix');
  el.innerHTML = '';
  if (!breakdown.length) {
    el.innerHTML = '<em style="color:var(--muted);">集計対象の武将がありません。</em>';
    return;
  }
  const matrix = aggregateByAttribute(breakdown);

  const table = document.createElement('table');
  table.className = 'attr-table';
  const thead = document.createElement('thead');
  thead.innerHTML = `
    <tr>
      <th>属性</th>
      <th>集結</th>
      <th>軍団</th>
      <th>角陣</th>
      <th>自部隊</th>
    </tr>
  `;
  table.appendChild(thead);
  const tbody = document.createElement('tbody');

  // 各属性行: 該当属性で全スコープ effects=0 の行は非表示（B）
  for (const attr of CORE_ATTRS) {
    // 行内の全 effects を先に集約してから、ゼロ行ならスキップ
    const cells = [];
    let rowHasEffect = false;
    for (const scope of ['rally', 'legion', 'array', 'self']) {
      const ups = matrix[attr][scope].up || [];
      const downs = matrix[attr][scope].down || [];
      const both = matrix[attr][scope].both || [];
      const all = [...ups, ...downs, ...both];
      if (all.length) rowHasEffect = true;
      const sum = all.reduce((s, i) => s + (i.value || 0), 0);
      cells.push({ effective: all, sum });
    }
    if (!rowHasEffect) continue;

    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="attr-name">${attr}</td>`;
    for (const c of cells) {
      const td = document.createElement('td');
      if (c.effective.length === 0) {
        td.className = 'empty';
        td.textContent = '—';
      } else {
        td.className = (c.sum > 0 ? 'up' : (c.sum < 0 ? 'down' : 'zero')) + ' has-detail';
        const hasEstimated = c.effective.some(i => i.estimated);
        const signed = (c.sum > 0 ? '+' : '') + fmtVal(c.sum, 'percent') + (hasEstimated ? '🔶' : '');
        const detailLines = c.effective.map(i => {
          const capParts = [];
          if (i.cap && i.cap.cap_value != null) capParts.push(`上限${i.cap.cap_value}%`);
          if (i.cap && i.cap.floor_value != null) capParts.push(`下限${i.cap.floor_value}%`);
          if (i.cap && i.cap.shared === true) capParts.push('共有');
          else if (i.cap && i.cap.shared === false) capParts.push('非共有');
          const capStr = capParts.length ? ` [${capParts.join('・')}]` : '';
          const estMark = i.estimated ? ' <span style="color:#a86a00;" title="該当段階データ未登録のため別段階値で推定">🔶推定</span>' : '';
          return `${i.general}/${i.skill.slice(0,16)} (${fmtVal(i.value, 'percent')})${estMark}${capStr}`;
        });
        td.innerHTML = `<strong>${signed}</strong>` +
          `<div class="attr-list">${detailLines.join('<br>')}</div>`;
        td.title = 'クリックで詳細を展開/折りたたみ';
        td.addEventListener('click', () => td.classList.toggle('expanded'));
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  el.appendChild(table);

  if (!tbody.children.length) {
    el.innerHTML = '<em style="color:var(--muted);">主要属性での効果はありません。</em>';
  }

  // その他は別枠でリスト表示
  const others = [];
  for (const scope of ['rally','legion','array','self']) {
    for (const dir of ['up','down','both']) {
      for (const b of (matrix['その他'][scope][dir] || [])) others.push(b);
    }
  }
  if (others.length) {
    const ol = document.createElement('details');
    ol.style.marginTop = '8px';
    const sum = document.createElement('summary');
    sum.textContent = `その他 (${others.length}件)`;
    ol.appendChild(sum);
    for (const b of others) {
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.innerHTML = `<span class="scope-badge scope-${b.scope}">${SCOPE_LABELS[b.scope]||b.scope}</span> <strong>${b.general}/${b.skill}</strong> → ${fmtVal(b.value, b.unit)}`;
      ol.appendChild(row);
    }
    el.appendChild(ol);
  }
}

// 上限プール状況: capValue が設定された pool の現状と推奨武将を表示
function renderCapPoolStatus(aggregated) {
  const el = document.getElementById('cap-pools');
  if (!el) return;
  el.innerHTML = '';

  // formation に既に入っている genId 集合
  const placedIds = new Set(formationPlacements().map(p => p.genId));

  // ruleKey ごとに pool を集約（scope 別に列挙）
  const pools = [];
  const scopeLabels = SCOPE_LABELS;
  for (const scope of ['rally','legion','array','self']) {
    const byRule = aggregated[scope] || [];
    for (const p of byRule) {
      if (p.capValue == null) continue;     // 上限なしはスキップ
      if (p.ruleKey === 'no_cap_implicit' || p.ruleKey === 'no_cap') continue;
      if (!p.items.length) continue;
      pools.push({ scope, ...p });
    }
  }
  if (!pools.length) {
    el.innerHTML = '<em style="color:var(--muted);">上限ルールが適用されたスキルは編成内にありません。</em>';
    return;
  }

  // 候補武将: 編成外で、各 ruleKey と一致する cap.rule を持つスキルがある武将を抽出
  function candidatesFor(ruleKey) {
    const recs = [];
    for (const g of state.data.generals) {
      if (placedIds.has(g.id)) continue;
      for (const sk of (g.skills || [])) {
        if (sk.cap && sk.cap.rule === ruleKey) {
          // 突破4時点の値を表示
          const vals = (sk.value && sk.value.by_breakthrough) || [];
          const v4 = vals[4];
          recs.push({ gname: g.name, sname: sk.name, value: v4 });
          break; // 同武将は1スキル代表で十分
        }
      }
    }
    return recs;
  }

  for (const p of pools) {
    const card = document.createElement('div');
    card.className = 'pool-card';

    const ratio = p.capValue !== 0
      ? Math.min(100, Math.abs(p.sum) / Math.abs(p.capValue) * 100)
      : 0;
    const remaining = (p.capValue || 0) - (p.capped || 0);
    const remainStr = (p.capValue > 0)
      ? `余裕 ${(p.capValue - p.capped).toFixed(1)}%`
      : `余裕 ${(p.capped - p.capValue).toFixed(1)}%`;
    const statusHtml = p.overflow
      ? `<span class="status-full">上限到達 (溢れ ${Math.abs(p.sum - p.capped).toFixed(1)}%)</span>`
      : (Math.abs(p.sum) >= Math.abs(p.capValue) ? `<span class="status-full">上限ぴったり</span>` : `<span class="status-room">${remainStr}</span>`);

    const scopeLabel = scopeLabels[p.scope] || p.scope;
    // 構成スキルから属性・方向を導出（最頻値）
    const attrCount = {};
    const dirCount = {};
    for (const it of p.items) {
      const a = it.attribute || 'その他';
      attrCount[a] = (attrCount[a]||0) + 1;
      const d = it.direction || (it.value > 0 ? 'up' : (it.value < 0 ? 'down' : 'unknown'));
      dirCount[d] = (dirCount[d]||0) + 1;
    }
    const topAttr = Object.entries(attrCount).sort((a,b)=>b[1]-a[1])[0][0];
    const topDir = Object.entries(dirCount).sort((a,b)=>b[1]-a[1])[0][0];
    const dirLabel = topDir === 'up' ? 'アップ' : (topDir === 'down' ? 'ダウン' : '');
    const sharedLabel = p.isShared ? '共有' : '非共有';
    const titleLabel = `${scopeLabel}・${topAttr}${dirLabel}（${sharedLabel}・上限${Math.abs(p.capValue)}%）`;

    card.innerHTML = `
      <div class="head">
        <strong>${titleLabel}</strong>
        <span>${fmtVal(p.capped, 'percent')} / ${fmtVal(p.capValue, 'percent')}</span>
        <span class="bar ${p.overflow ? 'overflow' : ''}"><span style="width:${ratio}%;"></span></span>
        ${statusHtml}
      </div>
      <div class="pool-note">rule: <code>${p.ruleKey}</code>${p.ruleNote ? ' — ' + p.ruleNote : ''}</div>
    `;

    // 現メンバーリスト（武将名 / 完全スキル名 / 値 を箇条書きで明示）
    const memDiv = document.createElement('div');
    memDiv.className = 'recs';
    memDiv.innerHTML = '<strong>構成スキル:</strong><ul style="margin:2px 0 2px 18px;padding:0;">' +
      p.items.map(i => `<li><strong>${i.general}</strong> / ${i.skill} <span style="color:var(--muted)">(${fmtVal(i.value,'percent')})</span></li>`).join('') +
      '</ul>';
    card.appendChild(memDiv);

    // 余裕がある場合のみ候補表示
    if (!p.overflow && Math.abs(p.sum) < Math.abs(p.capValue)) {
      const recs = candidatesFor(p.ruleKey);
      const recDiv = document.createElement('div');
      recDiv.className = 'recs';
      if (recs.length) {
        const top = recs.slice(0, 10);
        recDiv.innerHTML = `<strong>➕ 候補武将 (${recs.length}件、上位${top.length}件):</strong><ul style="margin:2px 0 2px 18px;padding:0;">` +
          top.map(r => `<li><strong>${r.gname}</strong> / ${r.sname}${r.value != null ? ` <span style="color:var(--muted)">(${fmtVal(r.value,'percent')})</span>` : ''}</li>`).join('') +
          '</ul>';
      } else {
        recDiv.innerHTML = '<em>編成外に該当武将なし</em>';
      }
      card.appendChild(recDiv);
    }

    el.appendChild(card);
  }
}

function renderSummary() {
  const { aggregated, issues, breakdown } = aggregate();

  // 属性マトリクスを最初に描画
  renderAttributeMatrix(breakdown);

  // 上限プール状況
  renderCapPoolStatus(aggregated);

  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML = '';

  const scopeLabels = SCOPE_LABELS;

  for (const scope of ['rally', 'legion', 'array', 'self']) {
    const groups = aggregated[scope] || [];
    if (!groups.length) continue;
    const section = document.createElement('details');
    section.open = (scope === 'rally' || scope === 'legion');
    const sum = document.createElement('summary');
    sum.innerHTML = `<span class="scope-badge scope-${scope}">${scopeLabels[scope]}</span> ${groups.length}グループ`;
    section.appendChild(sum);

    for (const grp of groups) {
      const row = document.createElement('div');
      row.className = 'summary-row';
      const labels = grp.items.map(i => `${i.general}/${i.skill}`).join(', ');
      const capLabel = grp.capValue == null ? '上限未指定' :
                       (grp.overflow ? `上限${grp.capValue}（超過）` : `上限${grp.capValue}`);
      const valLabel = `合算 ${fmtVal(grp.sum, grp.items[0].unit)} → 実効 ${fmtVal(grp.capped, grp.items[0].unit)}`;
      const sharedLabel = grp.isShared ? '<span class="badge" style="background:#ddd;">共有</span>' : '';
      row.innerHTML = `
        <div class="label">${sharedLabel}${grp.ruleKey}<br><span style="font-size:11px;">${labels}</span></div>
        <div class="value ${grp.overflow ? 'overflow' : 'ok'}">${valLabel}<br><span style="font-size:11px;color:var(--muted);">${capLabel}</span></div>
      `;
      section.appendChild(row);
    }
    summaryEl.appendChild(section);
  }

  // 警告
  if (issues.length) {
    const warnEl = document.createElement('div');
    warnEl.className = 'warn-banner';
    warnEl.innerHTML = `<strong>要確認 (${issues.length}件):</strong><ul style="margin:4px 0 0 16px;padding:0;">` +
      issues.map(i => `<li>${i}</li>`).join('') + '</ul>';
    summaryEl.appendChild(warnEl);
  }

  if (!groupsHadAnyContent(aggregated)) {
    summaryEl.innerHTML = '<em style="color:var(--muted);">所持武将がありません。一覧から所持にチェックを入れてください。</em>';
  }

  // スキル詳細
  const detailEl = document.getElementById('skill-detail');
  if (breakdown.length === 0) {
    detailEl.innerHTML = '<em style="color:var(--muted);">所持武将のスキルがここに表示されます。</em>';
    return;
  }
  detailEl.innerHTML = '';
  const byGeneral = {};
  for (const b of breakdown) {
    if (!byGeneral[b.general]) byGeneral[b.general] = [];
    byGeneral[b.general].push(b);
  }
  for (const gname of Object.keys(byGeneral)) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = gname;
    d.appendChild(s);
    for (const b of byGeneral[gname]) {
      const row = document.createElement('div');
      row.className = 'skill-row';
      const lockedNote = b.value == null
        ? (b.unlocked_at > 0 ? `（突破${b.unlocked_at}で解放／現状未解放 or 未登録）` : '（値未登録）')
        : '';
      row.innerHTML = `
        <span class="scope-badge scope-${b.scope}">${scopeLabels[b.scope] || b.scope}</span>
        <strong>${b.skill}</strong>
        <span class="conf-${b.confidence}">[${b.confidence}]</span>
        ${b.stacking === 'non_stackable' ? '<span class="badge" style="background:#fbecdc;">累加不可</span>' : ''}
        ${b.unlocked_at_equipment != null ? `<span class="badge" style="background:#e8eef4;">装備${b.unlocked_at_equipment}</span>` : ''}
        → 値=${fmtVal(b.value, b.unit)} ${lockedNote}
      `;
      d.appendChild(row);
    }
    detailEl.appendChild(d);
  }
}

function groupsHadAnyContent(aggregated) {
  for (const s of Object.keys(aggregated)) {
    if (aggregated[s] && aggregated[s].length) return true;
  }
  return false;
}

// 集結共通の優先属性 UI（第一/第二優先を1セットだけ表示）
function renderGlobalPriority() {
  const priOpts = buildPriorityOptions();
  for (const key of ['pri1', 'pri2', 'pri3', 'pri4', 'pri5']) {
    const sel = document.getElementById(`global-${key}`);
    if (!sel) continue;
    sel.innerHTML = priOpts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    sel.value = state.priority[key] || '';
    sel.onchange = () => {
      state.priority[key] = sel.value;
      saveState();
    };
  }
}

const GROUP_LOCK_KEY = 'sangoku_group_unlocked_v1';

function isGroupUnlocked() {

      <button id="btn-cloud-push" title="この端末の現在状態をクラウドへ保存（他端末に同期）" style="background:var(--accent);color:#fff;">⬆️ クラウドへ保存</button>

    </div>
    <div style="font-size:11px;color:#777;margin-top:6px;">
      ※ 後勝ち（last-write-wins）方式。試作モード中は保存ボタンが警告色になります。
      <a href="https://github.com/yuichi4107-lab/sangoku-sim/blob/main/docs/group_sync.md" target="_blank" style="color:#3a5520;">📖 詳細</a>

// =========================
// クラウド同期（GAS Web App）
// =========================
const GROUP_API_URL = 'https://script.google.com/macros/s/AKfycbzHbJsj9mdyVqJvMl85_NkB5y4k4tbQ2hYXahT3gVNAPaQfCU4629xuvmnEtQJc6B26/exec';
const GROUP_MODE_KEY = 'sangoku_group_mode_v1';  // "sync" | "draft"
let lastCloudUpdatedAt = '';

function getGroupMode() {
  return localStorage.getItem(GROUP_MODE_KEY) === 'draft' ? 'draft' : 'sync';
}
function setGroupMode(m) {
  localStorage.setItem(GROUP_MODE_KEY, m);
}

async function cloudGet() {
  const res = await fetch(GROUP_API_URL, { method: 'GET' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function cloudPut(payload) {
  // GAS Web App のリダイレクト先(googleusercontent.com)が Allow-Origin を返さない
  // 既知の問題を回避するため mode: 'no-cors' で送信。レスポンスは opaque
  // になるため、送信成功後に GET で updated_at を確認する。
  const form = new URLSearchParams();
  form.append('payload', JSON.stringify(payload));
  const beforeTs = lastCloudUpdatedAt;
  await fetch(GROUP_API_URL, {
    method: 'POST',
    body: form,
    mode: 'no-cors',
  });
  // 送信完了を GET 結果の updated_at 変化で確認（最大3秒待つ）
  for (let i = 0; i < 6; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      const r = await cloudGet();
      if (r && r.ok && r.updated_at && r.updated_at !== beforeTs) {
        return { ok: true, updated_at: r.updated_at };
      }
    } catch (e) {}
  }
  // タイムアウトでも保存自体は成功している可能性が高いので警告のみ
  return { ok: true, updated_at: new Date().toISOString(), warning: 'unverified' };
}

function buildSharedPayload() {
  return {
    schema: 'sangoku_group_v1',
    users: state.users,
    ownerships: state.ownerships,
    playerStats: state.playerStats,
    activeUserId: state.activeUserId,
    formations: state.formations,
    priority: state.priority,
    aggMode: state.aggMode,
  };
}

function applySharedPayload(d) {
  if (!d || typeof d !== 'object') return false;
  if (Array.isArray(d.users)) state.users = d.users;
  if (d.ownerships && typeof d.ownerships === 'object') state.ownerships = d.ownerships;
  if (d.playerStats && typeof d.playerStats === 'object') state.playerStats = d.playerStats;
  if (typeof d.activeUserId === 'number' && state.users.find(u => u.id === d.activeUserId)) state.activeUserId = d.activeUserId;
  if (Array.isArray(d.formations)) state.formations = d.formations;
  if (d.priority && typeof d.priority === 'object') state.priority = d.priority;
  if (d.aggMode) state.aggMode = d.aggMode;
  saveState();
  renderUserTabs();
  renderGlobalPriority();
  renderRoster();
  renderFormation();
  renderSummary();
  return true;
}

function setGroupStatus(text, color) {
  const el = document.getElementById('group-status');
  if (!el) return;
  el.textContent = text;
  el.style.color = color || '#666';
}

async function cloudGetInbox() {
  const res = await fetch(GROUP_API_URL + '?action=get_inbox', { method: 'GET' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

function initCloudSync() {
  const btnPull = document.getElementById('btn-cloud-pull');
  const btnPush = document.getElementById('btn-cloud-push');
  const btnMode = document.getElementById('btn-mode-toggle');
  const btnInbox = document.getElementById('btn-inbox');
  if (!btnPull) return;

  const btnCompare = document.getElementById('btn-compare-stats');
  if (btnCompare) btnCompare.addEventListener('click', () => showStatsCompareModal());

  // 受信箱を取得 → モーダルで選択 → ユーザー追加/上書き
  if (btnInbox) btnInbox.addEventListener('click', async () => {
    setGroupStatus('受信箱を取得中…', '#888');
    let r;
    try {
      r = await cloudGetInbox();
      if (!r.ok) throw new Error(r.error || 'unknown');
    } catch (e) {
      setGroupStatus('受信箱取得失敗', '#c33');
      notify(`受信箱取得失敗: ${e.message}`);
      return;
    }
    const inbox = r.inbox || [];
    if (!inbox.length) {
      setGroupStatus('受信箱は空', '#888');
      notify('受信箱に新着はありません。');
      return;
    }
    refreshModeUI();
    showInboxModal(inbox);
  });

  function showInboxModal(inbox) {
    const existingNames = new Set(state.users.map(u => u.name));
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;padding:16px 18px;border-radius:6px;max-width:620px;max-height:85vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,0.25);font-family:inherit;';
    let html = `<div style="font-weight:600;font-size:14px;margin-bottom:8px;">📥 受信箱 (${inbox.length}名)</div>
      <div style="font-size:11px;color:#666;margin-bottom:10px;">取り込みたいユーザーを選択 → 取込で追加/上書き。「📋 ステ編集」で兵士属性を貼付け登録。</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">`;
    inbox.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
    inbox.forEach((row, idx) => {
      const ownedCount = Object.values(row.ownerships || {}).filter(o => o && o.owned).length;
      const exists = existingNames.has(row.user_name);
      const ts = row.updated_at ? new Date(row.updated_at).toLocaleString() : '';
      const imgs = (row.image_refs || []).filter(r => r && r.url);
      const hasStats = !!row.player_stats && Object.keys(row.player_stats).length > 0;
      const imgLinks = imgs.length
        ? imgs.map((r, i) => `<a href="${r.url}" target="_blank" style="font-size:10px;color:#4472c4;text-decoration:underline;margin-right:6px;">📸${i+1}</a>`).join('')
        : '<span style="font-size:10px;color:#aaa;">画像なし</span>';
      html += `<div style="border:1px solid #ccc;border-radius:3px;background:${exists ? '#fff8e8' : '#fff'};padding:6px 8px;">
        <label style="display:flex;gap:6px;align-items:center;cursor:pointer;">
          <input type="checkbox" data-idx="${idx}" checked>
          <div style="flex:1;">
            <div><strong>${row.user_name}</strong> ${exists ? '<span style="color:#a86a00;font-size:11px;">（既存・上書き）</span>' : '<span style="color:#3a5520;font-size:11px;">（新規）</span>'} ${hasStats ? '<span style="color:#3a5520;font-size:11px;">✓ステ登録済</span>' : '<span style="color:#a86a00;font-size:11px;">✗ステ未登録</span>'}</div>
            <div style="font-size:11px;color:#666;">所持 ${ownedCount}件 / 受信 ${ts}</div>
          </div>
        </label>
        <div style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${imgLinks}
          <button class="btn-edit-stats" data-name="${row.user_name}" style="font-size:11px;padding:2px 8px;margin-left:auto;background:#5a7a5a;color:#fff;border:none;border-radius:3px;cursor:pointer;">📋 ステ編集</button>
          <button class="btn-del-inbox" data-name="${row.user_name}" style="font-size:11px;padding:2px 8px;background:#a66;color:#fff;border:none;border-radius:3px;cursor:pointer;">🗑 削除</button>
        </div>
      </div>`;
    });
    html += `</div>
      <div id="batch-ocr-msg" style="font-size:11px;color:#666;margin-bottom:6px;"></div>
      <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;">
        <button id="btn-batch-ocr" style="background:#4472c4;color:#fff;" title="ステ未登録の友人を全員AI OCRする">🤖 全員OCR(未登録)</button>
        <button id="btn-inbox-all">全選択</button>
        <button id="btn-inbox-none">全解除</button>
        <button id="btn-inbox-ok" style="background:var(--accent);color:#fff;">選択を取込</button>
        <button id="btn-inbox-cancel" style="background:#888;color:#fff;">閉じる</button>
      </div>`;
    box.innerHTML = html;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const cleanup = () => { if (overlay.parentNode) overlay.remove(); };
    box.querySelector('#btn-inbox-cancel').onclick = cleanup;

    // 全員OCR(未登録のみ): 各エントリを順次 re_ocr → ポーリングで完了確認
    box.querySelector('#btn-batch-ocr').onclick = async () => {
      const msg = box.querySelector('#batch-ocr-msg');
      // 画像あり & stats 未登録(空) の対象を抽出
      const targets = inbox.filter(r => {
        const imgs = (r.image_refs || []).filter(x => x && x.fileId);
        const filled = r.player_stats ? countFilledStats(r.player_stats) : 0;
        return imgs.length > 0 && filled === 0;
      });
      if (!targets.length) { msg.textContent = 'OCR対象（画像あり・ステ未登録）はありません。'; return; }
      const btn = box.querySelector('#btn-batch-ocr');
      btn.disabled = true;
      let done = 0, failed = 0;
      for (const t of targets) {
        msg.textContent = `🤖 OCR中… ${done + failed + 1}/${targets.length} (${t.user_name})`;
        try {
          const form = new URLSearchParams();
          form.append('payload', JSON.stringify({ action: 're_ocr', user_name: t.user_name }));
          fetch(GROUP_API_URL, { method: 'POST', body: form, mode: 'no-cors' }).catch(() => {});
          // ポーリングで stats が埋まるのを待つ（最大40秒）
          let ok = false;
          for (let i = 0; i < 20; i++) {
            await new Promise(r => setTimeout(r, 2000));
            try {
              const res = await fetch(GROUP_API_URL + '?action=get_inbox');
              const r = await res.json();
              const row = (r.inbox || []).find(x => x.user_name === t.user_name);
              if (row && row.player_stats && countFilledStats(row.player_stats) > 0) { ok = true; break; }
            } catch (e) {}
          }
          if (ok) done++; else failed++;
        } catch (e) { failed++; }
      }
      btn.disabled = false;
      msg.textContent = `✅ 完了: ${done}名 / 失敗(タイムアウト): ${failed}名。受信箱を再取得します…`;
      setTimeout(() => { cleanup(); document.getElementById('btn-inbox').click(); }, 1500);
    };
    box.querySelector('#btn-inbox-all').onclick = () => box.querySelectorAll('input[type=checkbox]').forEach(i => i.checked = true);
    box.querySelector('#btn-inbox-none').onclick = () => box.querySelectorAll('input[type=checkbox]').forEach(i => i.checked = false);
    // ステ編集ボタン
    box.querySelectorAll('.btn-edit-stats').forEach(b => {
      b.addEventListener('click', async () => {
        const name = b.dataset.name;
        const row = inbox.find(r => r.user_name === name);
        await showStatsEditModal(name, row && row.player_stats);
        // 編集後は受信箱再読込
        cleanup();
        document.getElementById('btn-inbox').click();
      });
    });
    // 削除ボタン: 受信箱からエントリ削除（画像も削除）
    box.querySelectorAll('.btn-del-inbox').forEach(b => {
      b.addEventListener('click', async () => {
        const name = b.dataset.name;
        if (!await askConfirm(`「${name}」を受信箱から削除します。\n（提出画像も Drive から削除されます）\nよろしいですか？`)) return;
        const msg = box.querySelector('#batch-ocr-msg');
        if (msg) msg.textContent = `🗑 「${name}」を削除中…`;
        const form = new URLSearchParams();
        form.append('payload', JSON.stringify({ action: 'delete_inbox', user_name: name, delete_images: true }));
        fetch(GROUP_API_URL, { method: 'POST', body: form, mode: 'no-cors' }).catch(() => {});
        // 削除完了をポーリング確認（最大20秒）
        let gone = false;
        for (let i = 0; i < 10; i++) {
          await new Promise(r => setTimeout(r, 2000));
          try {
            const res = await fetch(GROUP_API_URL + '?action=get_inbox');
            const r = await res.json();
            if (!(r.inbox || []).find(x => x.user_name === name)) { gone = true; break; }
          } catch (e) {}
        }
        cleanup();
        if (gone) { notify(`🗑 「${name}」を削除しました。`); }
        else { notify(`⚠️ 削除確認タイムアウト。受信箱を再取得して確認してください。`); }
        document.getElementById('btn-inbox').click();
      });
    });
    box.querySelector('#btn-inbox-ok').onclick = async () => {
      const selected = Array.from(box.querySelectorAll('input[type=checkbox]:checked')).map(i => inbox[parseInt(i.dataset.idx, 10)]);
      if (!selected.length) { notify('1名以上選択してください。'); return; }
      cleanup();
      const added = [];
      const overwritten = [];
      const skipped = [];
      for (const row of selected) {
        const existing = state.users.find(u => u.name === row.user_name);
        if (existing) {
          const ok = await askConfirm(`「${row.user_name}」は既存です。\n所持データを上書きしますか？\n[OK]=上書き / [キャンセル]=スキップ`);
          if (!ok) { skipped.push(row.user_name); continue; }
          state.ownerships[existing.id] = row.ownerships || {};
          if (row.player_stats) {
            if (!state.playerStats) state.playerStats = {};
            state.playerStats[existing.id] = row.player_stats;
          }
          overwritten.push(row.user_name);
        } else {
          const newId = Math.max(0, ...state.users.map(u => u.id)) + 1;
          state.users.push({ id: newId, name: row.user_name });
          state.ownerships[newId] = row.ownerships || {};
          if (row.player_stats) {
            if (!state.playerStats) state.playerStats = {};
            state.playerStats[newId] = row.player_stats;
          }
          added.push(row.user_name);
        }
      }
      saveState();
      renderUserTabs();
      renderRoster();
      renderFormation();
      renderSummary();
      const lines = [];
      if (added.length) lines.push(`新規追加: ${added.length}名 (${added.join(', ')})`);
      if (overwritten.length) lines.push(`上書き: ${overwritten.length}名 (${overwritten.join(', ')})`);
      if (skipped.length) lines.push(`スキップ: ${skipped.length}名 (${skipped.join(', ')})`);
      notify(lines.length ? lines.join('\n') : '処理対象なし');
    };
    overlay.addEventListener('click', e => { if (e.target === overlay) cleanup(); });
  }

  // モード表示の更新
  function refreshModeUI() {
    const mode = getGroupMode();
    if (mode === 'draft') {
      btnMode.textContent = '🧪 試作モード';
      btnMode.style.background = '#a05a2a';
      btnPush.style.background = '#c33';
      btnPush.title = '⚠️ 試作モード中。押すと試作内容が本番に反映されます';
      setGroupStatus('試作中（保存しても本番反映可、要確認）', '#a05a2a');
    } else {
      btnMode.textContent = '🔗 同期モード';
      btnMode.style.background = '#3a5520';
      btnPush.style.background = 'var(--accent)';
      btnPush.title = 'この端末の現在状態をクラウドへ保存（他端末に同期）';
      setGroupStatus('同期中', '#3a5520');
    }
  }
  refreshModeUI();

  // モード切替（ワンタッチ）
  btnMode.addEventListener('click', () => {
    const next = getGroupMode() === 'sync' ? 'draft' : 'sync';
    setGroupMode(next);
    refreshModeUI();
  });

  btnPull.addEventListener('click', async () => {
    if (!await askConfirm('クラウド上の最新データでこの端末を上書きします。よろしいですか？\n（この端末の現在の編集内容は失われます）')) return;
    setGroupStatus('取得中…', '#888');
    try {
      const r = await cloudGet();
      if (!r.ok) throw new Error('GET failed');
      if (!r.data || !Object.keys(r.data).length) {
        setGroupStatus('クラウドはまだ空です', '#888');
        notify('クラウドにはまだデータがありません。\nまず「クラウドへ保存」で初期データをアップロードしてください。');
        return;
      }
      applySharedPayload(r.data);
      lastCloudUpdatedAt = r.updated_at || '';
      notify('クラウドから取得しました。');
      refreshModeUI();
      setGroupStatus(`取得完了 ${new Date().toLocaleTimeString()}`, '#3a5520');
    } catch (e) {
      setGroupStatus('取得失敗', '#c33');
      notify(`取得失敗: ${e.message}`);
    }
  });

  btnPush.addEventListener('click', async () => {
    // 試作モード中は確認ダイアログ
    if (getGroupMode() === 'draft') {
      const ok = await askConfirm('⚠️ 試作モード中です。\n試作中の内容をクラウド（本番）に反映してよろしいですか？');
      if (!ok) return;
    }

    // 衝突確認: クラウドの updated_at を取得して比較
    setGroupStatus('衝突確認中…', '#888');
    let cloudCheck = null;
    try {
      cloudCheck = await cloudGet();
    } catch (e) {
      const ok = await askConfirm(`⚠️ 衝突確認の通信に失敗しました（${e.message}）。\nそれでも保存しますか？`);
      if (!ok) { setGroupStatus('キャンセル', '#888'); return; }
    }

    // 他者の更新が入っている場合は3択ダイアログ
    if (cloudCheck && cloudCheck.updated_at && cloudCheck.updated_at !== lastCloudUpdatedAt && lastCloudUpdatedAt) {
      const choice = await askConflictChoice(cloudCheck.updated_at);
      if (choice === 'cancel') { setGroupStatus('キャンセル', '#888'); return; }
      if (choice === 'pull') {
        if (cloudCheck.data && Object.keys(cloudCheck.data).length) {
          applySharedPayload(cloudCheck.data);
          lastCloudUpdatedAt = cloudCheck.updated_at;
          notify('クラウドから取得しました。\nあなたの未保存の編集は破棄されました。');
          refreshModeUI();
          setGroupStatus(`取得完了 ${new Date().toLocaleTimeString()}`, '#3a5520');
        }
        return;
      }
      // choice === 'overwrite' → 続行して保存
    }

    setGroupStatus('保存中…', '#888');
    try {
      const r = await cloudPut(buildSharedPayload());
      lastCloudUpdatedAt = r.updated_at || '';
      notify('クラウドに保存しました。');
      refreshModeUI();
      setGroupStatus(`保存完了 ${new Date().toLocaleTimeString()}`, '#3a5520');
    } catch (e) {
      setGroupStatus('保存失敗', '#c33');
      notify(`保存失敗: ${e.message}`);
    }
  });
}

// 3択モーダル: 他人更新検出時 - 'overwrite' | 'pull' | 'cancel'
function askConflictChoice(remoteUpdatedAt) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;padding:18px 20px;border-radius:6px;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,0.25);font-family:inherit;';
    const timeStr = (() => {
      try {
        const d = new Date(remoteUpdatedAt);
        const diff = Math.round((Date.now() - d.getTime()) / 1000);
        let when;
        if (diff < 60) when = `${diff}秒前`;
        else if (diff < 3600) when = `${Math.floor(diff/60)}分前`;
        else when = `${Math.floor(diff/3600)}時間前`;
        return `${d.toLocaleTimeString()}（${when}）`;
      } catch { return remoteUpdatedAt; }
    })();
    box.innerHTML = `
      <div style="font-weight:600;font-size:14px;color:#c33;margin-bottom:8px;">⚠️ 他の人が更新しています</div>
      <div style="font-size:12px;line-height:1.6;margin-bottom:12px;">
        クラウドの最終更新: <strong>${timeStr}</strong><br>
        あなたが取得した状態より新しい変更がクラウドにあります。<br>
        どうしますか？
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button data-act="overwrite" style="padding:8px 12px;background:#c33;color:#fff;border:none;border-radius:4px;cursor:pointer;text-align:left;">
          <strong>上書き保存</strong><br><span style="font-size:11px;opacity:0.85;">他の人の更新を捨てて自分の編集で上書き</span>
        </button>
        <button data-act="pull" style="padding:8px 12px;background:#3a5520;color:#fff;border:none;border-radius:4px;cursor:pointer;text-align:left;">
          <strong>クラウドから取得</strong><br><span style="font-size:11px;opacity:0.85;">自分の編集を破棄して最新を取得</span>
        </button>
        <button data-act="cancel" style="padding:8px 12px;background:#888;color:#fff;border:none;border-radius:4px;cursor:pointer;text-align:left;">
          <strong>キャンセル</strong><br><span style="font-size:11px;opacity:0.85;">何もせず閉じる（自分の編集はローカルに残る）</span>
        </button>
      </div>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const close = (v) => { if (overlay.parentNode) overlay.remove(); resolve(v); };
    box.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => close(b.dataset.act));
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) close('cancel'); });
  });
}

// =========================
// プレイヤー兵士属性スキーマ & パーサー
// =========================
const STATS_TROOPS = ['歩兵', '騎兵', '弓兵', '戦車'];
const STATS_TROOP_ATTRS = [
  ['attack', '攻撃ボーナス'],
  ['defense', '防御ボーナス'],
  ['speed', '速度ボーナス'],
  ['siege', '攻城ボーナス'],
  ['load', '荷重ボーナス'],
  ['shield', 'シールド付加'],
  ['pierce', '貫通付加'],
  ['rensa', '連撃付加'],
  ['resist', '抵抗付加'],
  ['pierce_resist', '貫通抵抗付加'],
  ['discipline', '軍紀付加'],
];
const STATS_DEBUFF = [
  ['attack', '攻撃'],
  ['defense', '防御'],
  ['shield', 'シールド'],
  ['pierce', '貫通'],
  ['rensa', '連撃'],
  ['resist', '抵抗'],
  ['pierce_resist', '貫通抵抗'],
  ['discipline', '軍紀'],
];
// 武府属性（プレイヤーが振っている属性。値>0のものを bufu_attrs にフラグ記録）
const BUFU_MAP = [
  ['rensa', '連撃上昇'],
  ['resist', '抵抗上昇'],
  ['shield', 'シールド上昇'],
  ['pierce', '貫通上昇'],
  ['attack', '攻撃上昇'],
  ['defense', '防御上昇'],
  ['pierce_resist', '貫通抵抗上昇'],
];

function emptyPlayerStats() {
  const ps = { general: { march_count: null, max_legions: null }, by_troop: {}, tank_support: null, debuff_enemy: {}, bufu_attrs: [] };
  for (const t of STATS_TROOPS) {
    ps.by_troop[t] = {};
    for (const [k] of STATS_TROOP_ATTRS) ps.by_troop[t][k] = null;
  }
  for (const [k] of STATS_DEBUFF) ps.debuff_enemy[k] = null;
  return ps;
}

// テキスト（OCR/手入力）から兵士属性を抽出
function parsePlayerStatsText(text) {
  const ps = emptyPlayerStats();
  const lines = text.split(/\r?\n/);
  function matchLine(line) {
    const m = line.match(/^[\s\-・\*]*(.+?)[:：\s]+(-?[\d,]+(?:\.\d+)?)\s*[%％]?\s*$/);
    if (!m) return null;
    const key = m[1].trim().replace(/\s+/g, '');
    const val = parseFloat(m[2].replace(/,/g, ''));
    return { key, val };
  }
  if (!ps.bufu_attrs) ps.bufu_attrs = [];
  for (const raw of lines) {
    const m = matchLine(raw);
    if (!m) continue;
    const { key, val } = m;
    // 一般
    if (key === '行軍部隊総数') { ps.general.march_count = val; continue; }
    if (key === '出征可軍団上限') { ps.general.max_legions = val; continue; }
    if (key === '戦車支援付加') { ps.tank_support = val; continue; }
    // 武府属性（値>0 の属性キーを bufu_attrs に記録）
    const bufu = BUFU_MAP.find(([, jp]) => jp === key);
    if (bufu) {
      if (val > 0 && ps.bufu_attrs.indexOf(bufu[0]) < 0) ps.bufu_attrs.push(bufu[0]);
      continue;
    }
    // 敵方への減益
    const debuffMatch = key.match(/^敵方の(.+?)に対する減益$/);
    if (debuffMatch) {
      const name = debuffMatch[1];
      const found = STATS_DEBUFF.find(([, jp]) => jp === name);
      if (found) ps.debuff_enemy[found[0]] = val;
      continue;
    }
    // 兵種別属性
    for (const troop of STATS_TROOPS) {
      if (!key.startsWith(troop)) continue;
      const rest = key.slice(troop.length);
      const found = STATS_TROOP_ATTRS.find(([, jp]) => jp === rest);
      if (found) {
        ps.by_troop[troop][found[0]] = val;
        break;
      }
    }
  }
  return ps;
}

function countFilledStats(ps) {
  if (!ps) return 0;
  let n = 0;
  if (ps.general) {
    if (ps.general.march_count != null) n++;
    if (ps.general.max_legions != null) n++;
  }
  if (ps.by_troop) {
    for (const t of STATS_TROOPS) {
      const r = ps.by_troop[t] || {};
      for (const [k] of STATS_TROOP_ATTRS) if (r[k] != null) n++;
    }
  }
  if (ps.tank_support != null) n++;
  if (ps.debuff_enemy) {
    for (const [k] of STATS_DEBUFF) if (ps.debuff_enemy[k] != null) n++;
  }
  return n;
}

// 兵士属性編集モーダル（テキスト貼付パース or 手動入力）
async function showStatsEditModal(userName, currentStats) {
  return new Promise(resolve => {
    let ps = currentStats ? JSON.parse(JSON.stringify(currentStats)) : emptyPlayerStats();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;padding:14px 16px;border-radius:6px;max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
    function buildTroopGrid() {
      const bufu = ps.bufu_attrs || [];
      let h = '<table style="border-collapse:collapse;font-size:11px;width:100%;margin-bottom:8px;"><thead><tr><th style="border:1px solid #999;background:#ede7d9;padding:3px;">属性</th>';
      for (const t of STATS_TROOPS) h += `<th style="border:1px solid #999;background:#ede7d9;padding:3px;">${t}</th>`;
      h += '</tr></thead><tbody>';
      for (const [k, label] of STATS_TROOP_ATTRS) {
        const isBufu = bufu.indexOf(k) >= 0;  // 武府投資ありの属性
        const labelBg = isBufu ? '#ffe8a0' : '#f7f3e8';
        const cellBg = isBufu ? '#fff6d8' : 'transparent';
        const mark = isBufu ? '★' : '';
        h += `<tr><td style="border:1px solid #999;padding:3px;font-weight:600;background:${labelBg};">${mark}${label}</td>`;
        for (const t of STATS_TROOPS) {
          const v = ps.by_troop[t][k];
          h += `<td style="border:1px solid #999;padding:1px;background:${cellBg};"><input type="number" step="0.1" data-troop="${t}" data-attr="${k}" value="${v ?? ''}" style="width:100%;border:none;padding:3px;font-size:11px;text-align:right;background:transparent;"></td>`;
        }
        h += '</tr>';
      }
      h += '</tbody></table>';
      return h;
    }
    function buildDebuff() {
      let h = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:8px;">';
      for (const [k, label] of STATS_DEBUFF) {
        const v = ps.debuff_enemy[k];
        h += `<label style="display:flex;align-items:center;gap:4px;font-size:11px;"><span style="flex:1;">敵${label}減益</span><input type="number" step="0.1" data-debuff="${k}" value="${v ?? ''}" style="width:60px;text-align:right;font-size:11px;padding:2px;border:1px solid #ccc;"></label>`;
      }
      h += '</div>';
      return h;
    }
    function buildGeneral() {
      return `<div style="display:flex;gap:8px;margin-bottom:8px;">
        <label style="font-size:11px;display:flex;align-items:center;gap:4px;">行軍部隊総数<input type="number" step="1" data-general="march_count" value="${ps.general.march_count ?? ''}" style="width:50px;font-size:11px;padding:2px;border:1px solid #ccc;text-align:right;"></label>
        <label style="font-size:11px;display:flex;align-items:center;gap:4px;">出征可軍団上限<input type="number" step="1" data-general="max_legions" value="${ps.general.max_legions ?? ''}" style="width:50px;font-size:11px;padding:2px;border:1px solid #ccc;text-align:right;"></label>
        <label style="font-size:11px;display:flex;align-items:center;gap:4px;">戦車支援付加<input type="number" step="0.1" data-tank-support="1" value="${ps.tank_support ?? ''}" style="width:60px;font-size:11px;padding:2px;border:1px solid #ccc;text-align:right;">%</label>
      </div>`;
    }
    function rebuild() {
      const filled = countFilledStats(ps);
      box.innerHTML = `<div style="font-weight:600;font-size:14px;margin-bottom:6px;">📋 兵士属性編集 — ${userName} <span style="font-size:11px;color:#666;font-weight:normal;">(入力済: ${filled}/55)</span></div>
        <details style="margin-bottom:8px;font-size:12px;"><summary style="cursor:pointer;color:#4472c4;">📥 テキスト貼付けで一括入力（Geminiの出力など）</summary>
          <textarea id="paste-area" placeholder="例:&#10;行軍部隊総数: 5&#10;出征可軍団上限: 10&#10;歩兵攻撃ボーナス: 3032.9%&#10;..." style="width:100%;height:90px;font-family:monospace;font-size:11px;padding:4px;margin-top:4px;box-sizing:border-box;"></textarea>
          <button id="btn-parse" style="margin-top:4px;padding:4px 10px;background:#4472c4;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:12px;">パースして反映</button>
        </details>
        ${buildGeneral()}
        <div style="font-weight:600;font-size:12px;margin-bottom:4px;">兵種別属性</div>
        ${buildTroopGrid()}
        <div style="font-weight:600;font-size:12px;margin-bottom:4px;">敵方への減益</div>
        ${buildDebuff()}
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;">
          <button id="btn-stats-reocr" style="background:#4472c4;color:#fff;" title="この友人の提出画像から AI で再OCR">🤖 AIで再OCR</button>
          <button id="btn-stats-clear" style="background:#a66;color:#fff;">全クリア</button>
          <button id="btn-stats-cancel" style="background:#888;color:#fff;">キャンセル</button>
          <button id="btn-stats-save" style="background:var(--ok);color:#fff;">クラウドに保存</button>
        </div>
        <div id="stats-msg" style="font-size:11px;color:#666;margin-top:6px;"></div>`;
      bind();
    }
    function bind() {
      box.querySelectorAll('input[data-troop]').forEach(inp => inp.addEventListener('input', () => {
        const t = inp.dataset.troop, a = inp.dataset.attr;
        ps.by_troop[t][a] = inp.value === '' ? null : parseFloat(inp.value);
      }));
      box.querySelectorAll('input[data-debuff]').forEach(inp => inp.addEventListener('input', () => {
        ps.debuff_enemy[inp.dataset.debuff] = inp.value === '' ? null : parseFloat(inp.value);
      }));
      box.querySelectorAll('input[data-general]').forEach(inp => inp.addEventListener('input', () => {
        ps.general[inp.dataset.general] = inp.value === '' ? null : parseFloat(inp.value);
      }));
      const tsInp = box.querySelector('input[data-tank-support]');
      if (tsInp) tsInp.addEventListener('input', () => ps.tank_support = tsInp.value === '' ? null : parseFloat(tsInp.value));
      box.querySelector('#btn-parse').onclick = () => {
        const txt = box.querySelector('#paste-area').value;
        const parsed = parsePlayerStatsText(txt);
        // merge (non-null から優先)
        function mergeIn(target, source) {
          for (const k of Object.keys(source)) {
            if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])) {
              if (!target[k]) target[k] = {};
              mergeIn(target[k], source[k]);
            } else if (source[k] != null) {
              target[k] = source[k];
            }
          }
        }
        mergeIn(ps, parsed);
        rebuild();
        box.querySelector('#stats-msg').textContent = `✅ パース反映完了。${countFilledStats(parsed)}項目を更新。`;
      };
      box.querySelector('#btn-stats-clear').onclick = () => {
        if (confirm('全項目をクリアします。よろしいですか？')) { ps = emptyPlayerStats(); rebuild(); }
      };
      box.querySelector('#btn-stats-reocr').onclick = async () => {
        const msg = box.querySelector('#stats-msg');
        const startTs = Date.now();
        // 開始前の埋まり数を記録（変化を検出するため）
        const initialFilled = countFilledStats(ps);
        msg.textContent = '🤖 AI OCR 開始… (送信中)';
        // POST は fire-and-forget(no-cors)。並行してポーリング開始
        const form = new URLSearchParams();
        form.append('payload', JSON.stringify({ action: 're_ocr', user_name: userName }));
        fetch(GROUP_API_URL, { method: 'POST', body: form, mode: 'no-cors' }).catch(() => {});

        let updated = null;
        for (let i = 0; i < 25; i++) {
          await new Promise(r => setTimeout(r, 2000));
          const sec = Math.round((Date.now() - startTs) / 1000);
          msg.textContent = `🤖 AI OCR 中… (${sec}秒経過 / 最大50秒)`;
          try {
            const res = await fetch(GROUP_API_URL + '?action=get_inbox');
            const r = await res.json();
            const row = (r.inbox || []).find(x => x.user_name === userName);
            if (row && row.player_stats) {
              const filled = countFilledStats(row.player_stats);
              // 開始時より埋まり数が増えたら反映
              if (filled > initialFilled) {
                updated = row.player_stats;
                break;
              }
            }
          } catch (e) {
            console.warn('poll error', e);
          }
        }
        if (updated) {
          ps = updated;
          rebuild();
          const sec = Math.round((Date.now() - startTs) / 1000);
          msg.textContent = `✅ AI OCR 完了 (${sec}秒)。値を確認・修正してから「クラウドに保存」してください。`;
        } else {
          msg.textContent = '⚠️ OCR タイムアウト（50秒）。GAS 実行ログを確認してください。\n（モデル名 / API KEY / 画像参照 が原因の可能性）';
        }
      };
      box.querySelector('#btn-stats-cancel').onclick = () => { if (overlay.parentNode) overlay.remove(); resolve(null); };
      box.querySelector('#btn-stats-save').onclick = async () => {
        const msg = box.querySelector('#stats-msg');
        msg.textContent = '保存中…';
        try {
          const form = new URLSearchParams();
          form.append('payload', JSON.stringify({ action: 'update_stats', user_name: userName, player_stats: ps }));
          await fetch(GROUP_API_URL, {
            method: 'POST',
            body: form,
            mode: 'no-cors',
          });
          msg.textContent = '✅ クラウドに保存しました（送信完了、反映確認は受信箱再取得で）';
          // ローカル state にも反映
          const existing = state.users.find(u => u.name === userName);
          if (existing) {
            if (!state.playerStats) state.playerStats = {};
            state.playerStats[existing.id] = ps;
            saveState();
          }
          setTimeout(() => { if (overlay.parentNode) overlay.remove(); resolve(ps); }, 800);
        } catch (e) {
          msg.textContent = `❌ 保存失敗: ${e.message}`;
        }
      };
    }
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    rebuild();
  });
}

// 兵士属性比較ビュー（4名選択）
function showStatsCompareModal() {
  const users = state.users.filter(u => state.playerStats && state.playerStats[u.id]);
  if (!users.length) { notify('プレイヤーステータスが未登録です。\n受信箱の「📋 ステ編集」で登録してください。'); return; }
  const overlay = document.createElement('div');

  box.style.cssText = 'background:#fff;padding:14px 16px;border-radius:6px;max-width:800px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
  let selectedIds = [];
  function rebuild() {

      <div style="font-size:11px;color:#666;margin-bottom:8px;">4名まで選択。各列に各プレイヤーの値を表示します。</div>

    for (const u of users) {
      const checked = selectedIds.includes(u.id) ? 'checked' : '';
      h += `<label style="display:inline-flex;align-items:center;gap:4px;border:1px solid #ccc;padding:4px 8px;border-radius:3px;cursor:pointer;background:${selectedIds.includes(u.id) ? '#e8f0e0' : '#fff'};"><input type="checkbox" data-uid="${u.id}" ${checked}>${u.name}</label>`;
    }
    h += '</div>';
    if (selectedIds.length > 0) {
      const cols = selectedIds.map(id => ({ user: state.users.find(u => u.id === id), ps: state.playerStats[id] }));
      h += '<table style="border-collapse:collapse;font-size:11px;width:100%;">';
      h += '<thead><tr><th style="border:1px solid #999;background:#ede7d9;padding:4px;text-align:left;">項目</th>';
      for (const c of cols) h += `<th style="border:1px solid #999;background:#ede7d9;padding:4px;">${c.user.name}</th>`;
      h += '</tr></thead><tbody>';
      // bufuKey 指定時は、各列のプレイヤーが武府投資ありなら該当セルを着色
      function row(label, fn, bufuKey) {
        h += `<tr><td style="border:1px solid #999;padding:3px;background:#f7f3e8;">${label}</td>`;
        for (const c of cols) {
          const v = fn(c.ps);
          const isBufu = bufuKey && c.ps.bufu_attrs && c.ps.bufu_attrs.indexOf(bufuKey) >= 0;
          const bg = isBufu ? 'background:#fff6d8;' : '';
          h += `<td style="border:1px solid #999;padding:3px;text-align:right;${bg}${v == null ? 'color:#bbb;' : ''}">${v == null ? '—' : v}${isBufu ? ' ★' : ''}</td>`;
        }
        h += '</tr>';
      }
      row('行軍部隊総数', ps => ps.general ? ps.general.march_count : null);
      row('出征可軍団上限', ps => ps.general ? ps.general.max_legions : null);
      for (const t of STATS_TROOPS) {
        h += `<tr><td colspan="${cols.length+1}" style="border:1px solid #999;padding:3px;background:#ddd;font-weight:600;">${t}</td></tr>`;
        for (const [k, label] of STATS_TROOP_ATTRS) {
          row(`　${label}`, ps => {
            const v = ps.by_troop && ps.by_troop[t] ? ps.by_troop[t][k] : null;
            return v != null ? v + '%' : null;
          }, k);
        }
      }
      row('戦車支援付加', ps => ps.tank_support != null ? ps.tank_support + '%' : null);
      h += `<tr><td colspan="${cols.length+1}" style="border:1px solid #999;padding:3px;background:#ddd;font-weight:600;">敵方への減益</td></tr>`;
      for (const [k, label] of STATS_DEBUFF) {
        row(`　${label}`, ps => {
          const v = ps.debuff_enemy ? ps.debuff_enemy[k] : null;
          return v != null ? v + '%' : null;
        });
      }
      h += '</tbody></table>';
    }
    h += '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:10px;"><button id="btn-cmp-close" style="background:#888;color:#fff;">閉じる</button></div>';
    box.innerHTML = h;
    box.querySelectorAll('input[data-uid]').forEach(inp => inp.addEventListener('change', () => {
      const id = parseInt(inp.dataset.uid, 10);
      if (inp.checked) {
        if (selectedIds.length >= 4) { inp.checked = false; notify('最大4名まで選択できます。'); return; }
        selectedIds.push(id);
      } else {
        selectedIds = selectedIds.filter(x => x !== id);
      }
      rebuild();
    }));
    box.querySelector('#btn-cmp-close').onclick = () => { if (overlay.parentNode) overlay.remove(); };
  }
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  rebuild();
}
window.showStatsCompareModal = showStatsCompareModal;

</script>
</body>
</html>
